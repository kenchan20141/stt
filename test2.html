<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AirMic Studio - 零延遲無線麥克風 [除錯加強版]</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- WebRTC 核心引擎 (專門解決 P2P 穿透與候選佇列死鎖) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- QRCode 生成庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-base: #121315;       
            --surface: #1B1C20;       
            --surface-light: #26272D; 
            --primary: #C5A059;       
            --primary-hover: #D8B46E;
            --text-main: #ECE9DF;     
            --text-muted: #7E7F85;    
            --border: #32333A;        
            --accent-red: #D94A43;
            --accent-green: #3EB370;

            --font-title: 'Oswald', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 0%, #202229 0%, var(--bg-base) 90%);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .studio-rig {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 760px;
            height: 100vh;
            height: 100dvh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .rig-enclosure {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        /* 頂部 Header */
        header {
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: #17181B;
            gap: 10px;
        }

        .brand-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4A4B50;
            transition: all 0.3s ease;
        }

        .status-dot.active-live {
            background: var(--accent-red);
            box-shadow: 0 0 12px var(--accent-red);
            animation: pulseLive 1.4s infinite ease-in-out;
        }

        .status-dot.active-connected {
            background: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
        }

        @keyframes pulseLive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.85); }
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            font-family: var(--font-title);
            text-transform: uppercase;
        }

        .brand-title span {
            color: var(--primary);
            font-size: 0.75rem;
            font-family: var(--font-mono);
            margin-left: 4px;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-muted);
            height: 36px;
            padding: 0 10px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 1px;
        }

        .icon-btn:hover {
            background: #34353C;
            color: var(--text-main);
        }

        .icon-btn.mode-active {
            background: rgba(197, 160, 89, 0.18);
            border-color: var(--primary);
            color: var(--primary);
        }

        .icon-btn svg { width: 15px; height: 15px; }

        /* 工作區 */
        .workspace-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px;
            background: #101113;
            overflow-y: auto;
        }

        .session-info-badge {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #17181B;
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .session-info-badge strong { color: var(--primary); }

        /* 中央互動按鈕 */
        .main-action-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin: auto 0;
        }

        .big-push-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #18191D;
            border: 3px solid var(--border);
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .big-push-btn svg {
            width: 46px;
            height: 46px;
            margin-bottom: 6px;
        }

        .big-push-btn span {
            font-family: var(--font-title);
            font-size: 1.05rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .big-push-btn:hover {
            border-color: #555760;
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .big-push-btn.broadcasting {
            background: radial-gradient(circle, #521815 0%, #1D0D0C 100%);
            border-color: var(--accent-red);
            color: #FFFFFF;
            box-shadow: 0 0 35px rgba(217, 74, 67, 0.45);
        }

        .big-push-btn.receiving {
            background: radial-gradient(circle, #123C27 0%, #0B1C13 100%);
            border-color: var(--accent-green);
            color: #FFFFFF;
            box-shadow: 0 0 35px rgba(62, 179, 112, 0.45);
        }

        .latency-hint {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-align: center;
        }

        /* 音訊頻譜電平表 */
        .meter-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #visualizerCanvas {
            width: 100%;
            height: 70px;
            background: #0B0C0D;
            border-radius: 4px;
            border: 1px solid #232428;
        }

        /* 底部控制欄 */
        .footer-controls {
            width: 100%;
            background: #17181B;
            border-top: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .control-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            width: 140px;
        }

        .slider-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            background: #2B2C31;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .val-display {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--primary);
            width: 48px;
            text-align: right;
        }

        /* 即時診斷日誌框 (Debug Console) */
        .debug-console {
            background: #0B0C0D;
            border: 1px solid #26272C;
            border-radius: 4px;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: #8C8E96;
            height: 72px;
            overflow-y: auto;
            line-height: 1.4;
            display: flex;
            flex-direction: column-reverse;
        }

        .log-entry.error { color: #D94A43; }
        .log-entry.success { color: #3EB370; }
        .log-entry.info { color: #C5A059; }

        /* 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 11, 13, 0.94);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active { display: flex; }

        .modal-window {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 380px;
            border-radius: 8px;
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-title);
            font-size: 1.1rem;
            letter-spacing: 2px;
            background: #17181B;
        }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #qrContainer { background: #FFFFFF; padding: 10px; border-radius: 4px; }
        .room-num-box { font-family: var(--font-mono); font-size: 2rem; font-weight: 700; color: var(--primary); }
        .app-input {
            width: 100%; background: #101113; border: 1px solid var(--border);
            padding: 10px 14px; border-radius: 4px; color: var(--primary);
            font-family: var(--font-mono); font-size: 1.2rem; text-align: center; outline: none;
        }
        .btn-confirm {
            width: 100%; background: var(--primary); color: #121315; border: none;
            padding: 10px; border-radius: 4px; font-family: var(--font-title);
            font-size: 1.05rem; letter-spacing: 2px; cursor: pointer; font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- 關鍵核心：實體音訊標籤 (防止 Safari / Chrome 靜默封鎖 WebRTC 音軌) -->
    <audio id="remoteAudioTag" autoplay playsinline></audio>

    <main class="studio-rig">
        <div class="rig-enclosure">
            <header>
                <div class="brand-meta">
                    <span id="statusDot" class="status-dot"></span>
                    <span class="brand-title">AirMic <span>DEBUGGED LIVE</span></span>
                </div>
                
                <div class="btn-group">
                    <button id="btnRoleBroadcast" class="icon-btn mode-active" onclick="switchRole('broadcaster')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
                        <span>發射端 (咪)</span>
                    </button>
                    <button id="btnRoleReceiver" class="icon-btn" onclick="switchRole('receiver')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        <span>接收端 (喇叭)</span>
                    </button>
                    <button class="icon-btn" onclick="openPairModal()" title="配對">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"></rect><rect x="2" y="14" width="20" height="8" rx="2"></rect></svg>
                    </button>
                </div>
            </header>

            <div class="workspace-viewport">
                <div class="session-info-badge">
                    <span>ROOM: <strong id="roomCodeDisplay">------</strong></span>
                    <span>LINK: <strong id="linkStatusText">INIT</strong></span>
                </div>

                <div class="main-action-zone">
                    <button id="mainToggleBtn" class="big-push-btn" onclick="handleMainAction()">
                        <svg id="btnIconMic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
                        <svg id="btnIconSpeaker" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        <span id="mainBtnText">開啟咪高風</span>
                    </button>
                    <div id="subHintText" class="latency-hint">點擊上方按鈕開始廣播語音</div>
                </div>

                <div class="meter-container">
                    <canvas id="visualizerCanvas" width="500" height="70"></canvas>
                    <div style="width:100%; display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:0.65rem; color:var(--text-muted);">
                        <span>-48dB</span>
                        <span>-24dB</span>
                        <span>-12dB</span>
                        <span>0dB (PEAK)</span>
                    </div>
                </div>
            </div>

            <div class="footer-controls">
                <div class="control-row">
                    <span class="control-label" id="gainLabel">增益放大 / BOOST</span>
                    <div class="slider-wrapper">
                        <input id="gainSlider" type="range" min="0" max="4" step="0.1" value="1.5" oninput="updateGain(this.value)">
                        <span id="gainValueDisplay" class="val-display">150%</span>
                    </div>
                </div>
                
                <div class="control-row" style="gap:8px;">
                    <button class="icon-btn" style="flex:1;" onclick="testHardwareAudio()">🔊 喇叭測試 (Beep Test)</button>
                    <button class="icon-btn" style="width:110px;" onclick="clearLogs()">清除日誌</button>
                </div>

                <!-- 實時連線日誌 -->
                <div id="debugConsole" class="debug-console"></div>
            </div>
        </div>
    </main>

    <!-- 配對 QR 彈窗 -->
    <div id="pairModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-window">
            <div class="modal-header">
                <span>終端配對 / PAIRING</span>
                <button class="icon-btn" style="width:28px; height:28px; padding:0;" onclick="closePairModal()">✕</button>
            </div>
            <div class="modal-body">
                <div id="qrContainer"></div>
                <div style="text-align:center;">
                    <div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono);">純數字房間號</div>
                    <div id="modalRoomNum" class="room-num-box">------</div>
                </div>
                <div style="width:100%; border-top:1px solid var(--border); padding-top:12px;">
                    <input id="inputJoinRoom" type="text" inputmode="numeric" pattern="[0-9]*" class="app-input" placeholder="輸入 6 位數字加入" />
                </div>
                <button class="btn-confirm" onclick="submitManualJoin()">連線至該房間</button>
            </div>
        </div>
    </div>

    <script>
        /* ------------------ 0. 日誌與除錯監視器 ------------------ */
        const debugConsole = document.getElementById('debugConsole');
        function log(msg, type = 'info') {
            const time = new Date().toTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.innerText = `[${time}] ${msg}`;
            debugConsole.prepend(div);
        }
        function clearLogs() { debugConsole.innerHTML = ''; }

        /* ------------------ 1. 狀態與房間初始化 ------------------ */
        const urlParams = new URLSearchParams(window.location.search);
        let assignedRoom = urlParams.get('room') ? urlParams.get('room').replace(/\D/g, '') : null;
        let myRole = urlParams.get('role') || (assignedRoom ? 'receiver' : 'broadcaster');

        let currentRoomId = assignedRoom || String(Math.floor(100000 + Math.random() * 900000));

        let peer = null;
        let activeCall = null;
        let localMicStream = null;
        let audioCtx = null;
        let gainNode = null;
        let analyser = null;

        const remoteAudioTag = document.getElementById('remoteAudioTag');
        const roomCodeDisplay = document.getElementById('roomCodeDisplay');
        const modalRoomNum = document.getElementById('modalRoomNum');
        const linkStatusText = document.getElementById('linkStatusText');
        const statusDot = document.getElementById('statusDot');
        const mainToggleBtn = document.getElementById('mainToggleBtn');
        const btnIconMic = document.getElementById('btnIconMic');
        const btnIconSpeaker = document.getElementById('btnIconSpeaker');
        const mainBtnText = document.getElementById('mainBtnText');
        const subHintText = document.getElementById('subHintText');
        const gainSlider = document.getElementById('gainSlider');
        const gainValueDisplay = document.getElementById('gainValueDisplay');

        // 生成符合房間規則的 Peer ID
        function getHostPeerId(roomId) { return `airmic-v2-${roomId}-host`; }

        /* ------------------ 2. 核心 WebRTC (PeerJS) 引擎 ------------------ */
        function initPeerNode() {
            if (peer) {
                try { peer.destroy(); } catch (e) {}
            }

            const myPeerId = (myRole === 'broadcaster') ? getHostPeerId(currentRoomId) : undefined;
            log(`正在初始化節點 (角色: ${myRole})...`);

            peer = new Peer(myPeerId, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun.cloudflare.com:3478' }
                    ]
                }
            });

            peer.on('open', (id) => {
                log(`信號伺服器連線成功！ID: ${id}`, 'success');
                linkStatusText.innerText = "READY";
                statusDot.className = 'status-dot active-connected';

                if (myRole === 'receiver') {
                    // 接收端主動向發射端發起連線
                    connectToBroadcaster();
                }
            });

            peer.on('call', (call) => {
                log(`偵測到連線請求 (From: ${call.peer})`, 'info');
                if (myRole === 'broadcaster') {
                    if (localMicStream) {
                        call.answer(localMicStream);
                        log("已回應接收端，傳送麥克風音訊串流！", 'success');
                    } else {
                        log("接收端已連入，請點擊中央按鈕開啟麥克風！", 'error');
                        // 暫存此連線，待開啟麥克風後回答
                        activeCall = call;
                    }
                }
            });

            peer.on('error', (err) => {
                log(`Peer 錯誤: ${err.type} - ${err.message}`, 'error');
                if (err.type === 'unavailable-id') {
                    alert("該房間已有發射端在線，請換一個房間號碼或切換為接收端。");
                }
            });
        }

        /* ------------------ 3. 接收端專用：安全建立連線 ------------------ */
        // 核心黑科技：生成 0 頻寬虛擬靜音軌，讓接收端無需申請麥克風權限即可建立通話
        function createSilentMediaStream() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const dst = ctx.createMediaStreamDestination();
            osc.connect(dst);
            osc.start();
            const stream = dst.stream;
            stream.getAudioTracks().forEach(t => t.enabled = false); // 關閉輸出，純佔位
            return stream;
        }

        function connectToBroadcaster() {
            const hostId = getHostPeerId(currentRoomId);
            log(`正在呼叫發射端 [${hostId}]...`);

            const dummyStream = createSilentMediaStream();
            const call = peer.call(hostId, dummyStream);

            if (!call) {
                log("呼叫失敗，請確認發射端是否在線", 'error');
                return;
            }

            bindCallEvents(call);
        }

        function bindCallEvents(call) {
            activeCall = call;

            call.on('stream', (remoteStream) => {
                log("★★★ 成功接收到發射端音訊串流！★★★", 'success');
                attachRemoteAudio(remoteStream);
            });

            call.on('close', () => {
                log("連線已中斷", 'error');
                statusDot.className = 'status-dot';
                linkStatusText.innerText = "DISCONNECTED";
            });

            call.on('error', (e) => {
                log("通話中斷錯誤: " + e, 'error');
            });
        }

        /* ------------------ 4. 解決瀏覽器封鎖音訊：實體播放與增益 ------------------ */
        async function attachRemoteAudio(stream) {
            // 1. 先綁定實體 Audio 標籤
            remoteAudioTag.srcObject = stream;
            
            try {
                await remoteAudioTag.play();
                log("實體 <audio> 標籤播放成功！", 'success');
            } catch (err) {
                log("瀏覽器阻擋自動播放！請點擊中央大按鈕解鎖！", 'error');
            }

            // 2. 接管至 Web Audio API 進行音量增益放大與頻譜繪製
            setupAudioPipeline(stream, true);

            mainToggleBtn.classList.add('receiving');
            mainBtnText.innerText = "ON SPEAKER";
            subHintText.innerText = "正在實時零延遲播放來自發射端的聲音";
            statusDot.className = 'status-dot active-live';
            linkStatusText.innerText = "STREAMING";
        }

        function setupAudioPipeline(stream, isOutputDestination) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const source = audioCtx.createMediaStreamSource(stream);
            gainNode = audioCtx.createGain();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;

            gainNode.gain.value = parseFloat(gainSlider.value);

            source.connect(gainNode);
            gainNode.connect(analyser);

            if (isOutputDestination) {
                // 如果是接收端，輸出至音效卡
                gainNode.connect(audioCtx.destination);
                log("音訊管線已導向音效卡喇叭");
            }

            drawVU();
        }

        /* ------------------ 5. 發射端：取得低延遲麥克風 ------------------ */
        async function startBroadcasterMic() {
            try {
                log("正在請求低延遲麥克風權限...");
                localMicStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false, // 關閉回音消除，延遲降到最低
                        noiseSuppression: false,
                        autoGainControl: true,
                        latency: 0,
                        channelCount: 1
                    },
                    video: false
                });

                log("麥克風已就緒，啟動頻譜監視", 'success');
                setupAudioPipeline(localMicStream, false);

                mainToggleBtn.classList.add('broadcasting');
                mainBtnText.innerText = "ON AIR (直播)";
                subHintText.innerText = "麥克風正常收音中，聲音即時廣播";
                statusDot.className = 'status-dot active-live';
                linkStatusText.innerText = "LIVE TRANSMIT";

                // 若有排隊中的接收端，立刻給予音訊
                if (activeCall) {
                    activeCall.answer(localMicStream);
                    log("已向等待中的接收端推送聲音！", 'success');
                }

                // 防止手機鎖定睡眠
                if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});

            } catch (err) {
                log("存取麥克風失敗: " + err.message, 'error');
                alert("無法開啟麥克風：" + err.message);
            }
        }

        function stopBroadcasterMic() {
            if (localMicStream) {
                localMicStream.getTracks().forEach(t => t.stop());
                localMicStream = null;
            }
            mainToggleBtn.classList.remove('broadcasting');
            mainBtnText.innerText = "開啟咪高風";
            subHintText.innerText = "點擊開始廣播語音";
            statusDot.className = 'status-dot active-connected';
            linkStatusText.innerText = "READY";
        }

        /* ------------------ 6. 使用者互動按鈕 ------------------ */
        function handleMainAction() {
            // 核心：任意使用者手勢直接喚醒 AudioContext 與音訊播放
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (remoteAudioTag && remoteAudioTag.paused) {
                remoteAudioTag.play().catch(()=>{});
            }

            if (myRole === 'broadcaster') {
                if (!localMicStream) startBroadcasterMic();
                else stopBroadcasterMic();
            } else {
                log("手動解鎖音訊播放權限...", 'info');
                connectToBroadcaster();
            }
        }

        function updateGain(val) {
            const num = parseFloat(val);
            if (gainNode) gainNode.gain.value = num;
            gainValueDisplay.innerText = Math.round(num * 100) + '%';
        }

        // 硬體嗶聲測試（檢查裝置喇叭是否有聲音）
        function testHardwareAudio() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // 880Hz 音調
                g.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(g);
                g.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
                log("發出測試音效：如果您聽到聲響，代表喇叭硬體與瀏覽器正常！", 'success');
            } catch (e) {
                log("喇叭測試失敗: " + e.message, 'error');
            }
        }

        /* ------------------ 7. LED VU 動態表繪製 ------------------ */
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');

        function drawVU() {
            requestAnimationFrame(drawVU);
            if (!analyser) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = '#0B0C0D';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const avg = sum / dataArray.length;

            const bars = 36;
            const barWidth = (canvas.width / bars) - 2;
            const levelRatio = avg / 128;

            for (let i = 0; i < bars; i++) {
                const threshold = i / bars;
                let color = '#202226';

                if (levelRatio > threshold) {
                    if (threshold > 0.85) color = '#D94A43';
                    else if (threshold > 0.6) color = '#C5A059';
                    else color = '#3EB370';
                }

                ctx.fillStyle = color;
                const h = Math.min(canvas.height - 10, Math.max(6, avg * 0.5));
                ctx.fillRect(i * (barWidth + 2) + 2, (canvas.height - h) / 2, barWidth, h);
            }
        }

        /* ------------------ 8. 角色切換與配對 ------------------ */
        function switchRole(role) {
            if (localMicStream) stopBroadcasterMic();
            myRole = role;

            document.getElementById('btnRoleBroadcast').classList.toggle('mode-active', role === 'broadcaster');
            document.getElementById('btnRoleReceiver').classList.toggle('mode-active', role === 'receiver');
            mainToggleBtn.className = 'big-push-btn';

            if (role === 'broadcaster') {
                btnIconMic.style.display = 'block';
                btnIconSpeaker.style.display = 'none';
                mainBtnText.innerText = "開啟咪高風";
                subHintText.innerText = "點擊開啟麥克風並廣播聲音";
            } else {
                btnIconMic.style.display = 'none';
                btnIconSpeaker.style.display = 'block';
                mainBtnText.innerText = "連接發射端";
                subHintText.innerText = "點擊以允許播放來自發射端的聲音";
            }

            updateURL();
            initPeerNode();
        }

        function updateURL() {
            roomCodeDisplay.innerText = currentRoomId;
            modalRoomNum.innerText = currentRoomId;
            const newUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}&role=${myRole}`;
            window.history.replaceState(null, '', newUrl);
        }

        const pairModal = document.getElementById('pairModal');
        const qrContainer = document.getElementById('qrContainer');
        function openPairModal() {
            pairModal.classList.add('active');
            qrContainer.innerHTML = '';
            const opposite = (myRole === 'broadcaster') ? 'receiver' : 'broadcaster';
            const url = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}&role=${opposite}`;
            new QRCode(qrContainer, { text: url, width: 160, height: 160, colorDark: "#101113", colorLight: "#FFF" });
        }
        function closePairModal() { pairModal.classList.remove('active'); }
        function closeModalOnBackdrop(e) { if (e.target === pairModal) closePairModal(); }

        function submitManualJoin() {
            const val = document.getElementById('inputJoinRoom').value.replace(/\D/g, '').trim();
            if (val.length < 4) return alert("請輸入正確房間號");
            currentRoomId = val;
            updateURL();
            closePairModal();
            initPeerNode();
        }

        // 啟動
        switchRole(myRole);
    </script>
</body>
</html>
