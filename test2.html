<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AirMic Studio - 零延遲無線麥克風</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- 雲端信號交換庫 (WebRTC 信號中繼) -->
    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <!-- QRCode 生成庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-base: #141517;       
            --surface: #1E1F23;       
            --surface-light: #2A2B30; 
            --primary: #C5A059;       
            --primary-hover: #D8B46E;
            --text-main: #EDEAE1;     
            --text-muted: #808082;    
            --border: #323338;        
            --accent-red: #D94A43;
            --accent-green: #3EB370;

            --font-title: 'Oswald', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;

            --shadow-depth: 0 24px 60px rgba(0, 0, 0, 0.8);
            --inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 0%, #202227 0%, var(--bg-base) 85%);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 機身飾條水印 */
        body::before {
            content: "AIR-LINK // P2P ZERO-LATENCY OPUS AUDIO ENGINE";
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: left center;
            font-size: 10px;
            font-family: var(--font-mono);
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.12);
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
        }

        .studio-rig {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 720px;
            height: 100vh;
            height: 100dvh;
            max-height: 860px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .rig-enclosure {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-depth), var(--inner-glow);
            overflow: hidden;
            position: relative;
        }

        /* 頂部 Header */
        header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: #18191B;
            flex-shrink: 0;
            gap: 12px;
        }

        .brand-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 2px;
            font-family: var(--font-title);
            text-transform: uppercase;
        }

        .brand-title span {
            color: var(--primary);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            margin-left: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4A4B50;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .status-dot.active-live {
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
            animation: pulseLive 1.4s infinite ease-in-out;
        }

        .status-dot.active-connected {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        @keyframes pulseLive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.85); }
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-muted);
            height: 38px;
            padding: 0 12px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .icon-btn:hover {
            background: #36373D;
            color: var(--text-main);
            border-color: #4B4C52;
        }

        .icon-btn.mode-active {
            background: rgba(197, 160, 89, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: inset 0 0 12px rgba(197, 160, 89, 0.2);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        /* 核心中央控制視口 */
        .workspace-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 32px 24px;
            position: relative;
            background: #121315;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.85);
            overflow-y: auto;
        }

        /* 狀態卡片顯示 */
        .session-info-badge {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #18191C;
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 30px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .session-info-badge strong {
            color: var(--primary);
            font-weight: 700;
        }

        /* 動態波形與電平畫布 */
        .meter-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        #visualizerCanvas {
            width: 100%;
            height: 100px;
            background: #0E0F10;
            border-radius: 6px;
            border: 1px solid #232428;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
        }

        /* 中央巨大互動主掣 */
        .main-action-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin: auto 0;
        }

        .big-push-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #191A1D;
            border: 3px solid var(--border);
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255,255,255,0.05);
            position: relative;
        }

        .big-push-btn svg {
            width: 50px;
            height: 50px;
            margin-bottom: 8px;
            transition: transform 0.25s ease;
        }

        .big-push-btn span {
            font-family: var(--font-title);
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .big-push-btn:hover {
            border-color: #555760;
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .big-push-btn:active {
            transform: scale(0.96);
        }

        /* 發射中 (ON AIR) 狀態 */
        .big-push-btn.broadcasting {
            background: radial-gradient(circle, #521815 0%, #200E0D 100%);
            border-color: var(--accent-red);
            color: #FFFFFF;
            box-shadow: 0 0 35px rgba(217, 74, 67, 0.45);
        }

        .big-push-btn.broadcasting svg {
            color: var(--accent-red);
            animation: micPulse 1.8s infinite ease-in-out;
        }

        /* 接收播放中狀態 */
        .big-push-btn.receiving {
            background: radial-gradient(circle, #103422 0%, #0C1E15 100%);
            border-color: var(--accent-green);
            color: #FFFFFF;
            box-shadow: 0 0 35px rgba(62, 179, 112, 0.45);
        }

        .big-push-btn.receiving svg {
            color: var(--accent-green);
        }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .latency-hint {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-align: center;
        }

        /* 底部參數與音量推桿控制欄 */
        .footer-controls {
            width: 100%;
            background: #18191B;
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .slider-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            width: 130px;
        }

        .slider-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: #2B2C31;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(197, 160, 89, 0.7);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .val-display {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: var(--primary);
            width: 45px;
            text-align: right;
        }

        /* 彈窗樣式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(14, 15, 17, 0.94);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-window {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-depth);
        }

        .modal-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-title);
            font-size: 1.15rem;
            letter-spacing: 2px;
            color: var(--text-main);
            background: #18191B;
        }

        .modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        #qrContainer {
            background: #FFFFFF;
            padding: 12px;
            border-radius: 6px;
        }

        .room-num-box {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--primary);
        }

        .app-input {
            width: 100%;
            background: #121315;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 4px;
            color: var(--primary);
            font-family: var(--font-mono);
            font-size: 1.25rem;
            letter-spacing: 3px;
            text-align: center;
            outline: none;
        }

        .app-input:focus {
            border-color: var(--primary);
        }

        .btn-confirm {
            width: 100%;
            background: var(--primary);
            color: #121315;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-family: var(--font-title);
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-confirm:hover {
            background: var(--primary-hover);
        }

        @media (max-width: 600px) {
            body::before { display: none; }
            .studio-rig { padding: 8px; }
            .brand-title span { display: none; }
            .slider-label { width: 90px; }
        }
    </style>
</head>
<body>

    <main class="studio-rig">
        <div class="rig-enclosure">
            <!-- 頂部操控列 -->
            <header>
                <div class="brand-meta">
                    <span id="statusDot" class="status-dot"></span>
                    <span class="brand-title">AirMic <span>ZERO-LATENCY WIRELESS MIC</span></span>
                </div>
                
                <div class="btn-group">
                    <button id="btnRoleBroadcast" class="icon-btn mode-active" onclick="switchRole('broadcaster')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                        </svg>
                        <span>發射端 (咪)</span>
                    </button>
                    <button id="btnRoleReceiver" class="icon-btn" onclick="switchRole('receiver')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                        <span>接收端 (喇叭)</span>
                    </button>
                    <button id="btnPair" class="icon-btn" onclick="openPairModal()" title="配對設定">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                            <line x1="6" y1="6" x2="6.01" y2="6"></line>
                            <line x1="6" y1="18" x2="6.01" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- 工作區視窗 -->
            <div class="workspace-viewport">
                <div class="session-info-badge">
                    <span>ROOM: <strong id="roomCodeDisplay">------</strong></span>
                    <span>STATUS: <strong id="linkStatusText">STANDBY</strong></span>
                </div>

                <!-- 大動作切換圓鈕 -->
                <div class="main-action-zone">
                    <button id="mainToggleBtn" class="big-push-btn" onclick="handleMainAction()">
                        <svg id="btnIconMic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                        </svg>
                        <svg id="btnIconSpeaker" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                        <span id="mainBtnText">開啟咪高風</span>
                    </button>
                    <div id="subHintText" class="latency-hint">點擊上方按鈕開始超低延遲語音串流</div>
                </div>

                <!-- 實時音訊頻譜 & LED VU 表 -->
                <div class="meter-container">
                    <canvas id="visualizerCanvas" width="480" height="100"></canvas>
                    <div style="width:100%; display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:0.65rem; color:var(--text-muted);">
                        <span>-48dB</span>
                        <span>-24dB</span>
                        <span>-12dB</span>
                        <span>-6dB</span>
                        <span>0dB (PEAK)</span>
                    </div>
                </div>
            </div>

            <!-- 底部調節台 -->
            <div class="footer-controls">
                <div class="slider-row">
                    <span class="slider-label" id="gainLabel">咪增益 / GAIN</span>
                    <div class="slider-wrapper">
                        <input id="gainSlider" type="range" min="0" max="3" step="0.05" value="1.0" oninput="updateGain(this.value)">
                        <span id="gainValueDisplay" class="val-display">100%</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 配對資訊視窗 -->
    <div id="pairModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-window">
            <div class="modal-header">
                <span>配對終端 / CONNECT</span>
                <button class="icon-btn" style="width:30px; height:30px; padding:0;" onclick="closePairModal()">✕</button>
            </div>
            <div class="modal-body">
                <div id="qrContainer"></div>
                <div style="text-align:center;">
                    <div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono); margin-bottom:4px;">純數字房間號</div>
                    <div id="modalRoomNum" class="room-num-box">------</div>
                </div>
                <div style="width:100%; border-top:1px solid var(--border); padding-top:16px;">
                    <div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono); margin-bottom:8px;">或在此設備手動加入其他房間：</div>
                    <input id="inputJoinRoom" type="text" inputmode="numeric" pattern="[0-9]*" class="app-input" placeholder="輸入 6 位數字" />
                </div>
                <button class="btn-confirm" onclick="submitManualJoin()">立即加入該房間</button>
            </div>
        </div>
    </div>

    <script>
        /* ------------------ 0. 系統狀態與參數 ------------------ */
        const urlParams = new URLSearchParams(window.location.search);
        let assignedRoom = urlParams.get('room') ? urlParams.get('room').replace(/\D/g, '') : null;
        let myRole = urlParams.get('role') === 'receiver' || assignedRoom ? 'receiver' : 'broadcaster';

        let currentRoomId = assignedRoom || String(Math.floor(100000 + Math.random() * 900000));
        let myPeerId = 'peer_' + Math.random().toString(36).substring(2, 9);

        let isStreaming = false;
        let isReceiving = false;
        let localAudioStream = null;
        let audioContext = null;
        let gainNode = null;
        let analyser = null;
        let remoteAudioElem = null;

        let peerConnections = {}; // targetPeerId -> RTCPeerConnection
        let mqttClient = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        const roomCodeDisplay = document.getElementById('roomCodeDisplay');
        const modalRoomNum = document.getElementById('modalRoomNum');
        const linkStatusText = document.getElementById('linkStatusText');
        const statusDot = document.getElementById('statusDot');
        const mainToggleBtn = document.getElementById('mainToggleBtn');
        const btnIconMic = document.getElementById('btnIconMic');
        const btnIconSpeaker = document.getElementById('btnIconSpeaker');
        const mainBtnText = document.getElementById('mainBtnText');
        const subHintText = document.getElementById('subHintText');
        const gainLabel = document.getElementById('gainLabel');
        const gainSlider = document.getElementById('gainSlider');
        const gainValueDisplay = document.getElementById('gainValueDisplay');
        const btnRoleBroadcast = document.getElementById('btnRoleBroadcast');
        const btnRoleReceiver = document.getElementById('btnRoleReceiver');

        /* ------------------ 1. WebRTC & MQTT 信號中繼 (極低延遲架構) ------------------ */
        function initSignaling() {
            if (mqttClient) {
                try { mqttClient.end(); } catch (e) {}
            }

            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clean: true });

            mqttClient.on('connect', () => {
                mqttClient.subscribe(`airmic/room_${currentRoomId}`);
                linkStatusText.innerText = "ONLINE";
                statusDot.className = 'status-dot active-connected';

                if (myRole === 'receiver') {
                    // 接收端發送準備接收通知
                    sendSignal({ type: 'receiver-ready', from: myPeerId });
                }
            });

            mqttClient.on('message', async (topic, payload) => {
                try {
                    const data = JSON.parse(payload.toString());
                    if (data.from === myPeerId) return; // 忽略自己

                    if (data.type === 'receiver-ready' && myRole === 'broadcaster' && localAudioStream) {
                        // 有新的接收端進入，發射端建立連線並發送 Offer
                        initiatePeerConnection(data.from);
                    } else if (data.type === 'offer' && myRole === 'receiver') {
                        handleRemoteOffer(data.from, data.sdp);
                    } else if (data.type === 'answer' && myRole === 'broadcaster') {
                        if (peerConnections[data.from]) {
                            await peerConnections[data.from].setRemoteDescription(new RTCSessionDescription(data.sdp));
                        }
                    } else if (data.type === 'candidate') {
                        const pc = peerConnections[data.from];
                        if (pc && data.candidate) {
                            try {
                                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                            } catch (e) {}
                        }
                    }
                } catch (e) {}
            });
        }

        function sendSignal(msgObj) {
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(`airmic/room_${currentRoomId}`, JSON.stringify(msgObj));
            }
        }

        /* ------------------ 2. 發射端：開啟麥克風與點對點推流 ------------------ */
        async function startBroadcaster() {
            try {
                // 請求低延遲麥克風約束 (禁用回音消除避免處理引入延遲；開啟降噪)
                localAudioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: true,
                        autoGainControl: true,
                        latency: 0,
                        channelCount: 1
                    },
                    video: false
                });

                setupAudioContext(localAudioStream, false);
                isStreaming = true;

                // UI 更新
                mainToggleBtn.classList.add('broadcasting');
                mainBtnText.innerText = "ON AIR (直播中)";
                subHintText.innerText = "麥克風運作中，發音即刻超低延遲同步到音響";
                statusDot.className = 'status-dot active-live';
                linkStatusText.innerText = "TRANSMITTING";

                // 廣播給所有在此房間的接收端
                sendSignal({ type: 'broadcaster-started', from: myPeerId });

                // 保持螢幕喚醒
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').catch(() => {});
                }

            } catch (err) {
                alert("無法存取麥克風，請檢查權限：" + err.message);
            }
        }

        function stopBroadcaster() {
            if (localAudioStream) {
                localAudioStream.getTracks().forEach(t => t.stop());
                localAudioStream = null;
            }
            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};

            isStreaming = false;
            mainToggleBtn.classList.remove('broadcasting');
            mainBtnText.innerText = "開啟咪高風";
            subHintText.innerText = "點擊上方按鈕開始超低延遲語音串流";
            statusDot.className = 'status-dot active-connected';
            linkStatusText.innerText = "ONLINE";
        }

        async function initiatePeerConnection(targetReceiverId) {
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[targetReceiverId] = pc;

            localAudioStream.getAudioTracks().forEach(track => {
                pc.addTrack(track, localAudioStream);
            });

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    sendSignal({ type: 'candidate', from: myPeerId, target: targetReceiverId, candidate: e.candidate });
                }
            };

            const offer = await pc.createOffer({
                offerToReceiveAudio: false,
                offerToReceiveVideo: false,
                voiceActivityDetection: false
            });

            // 優化 Opus SDP: 限制最低延遲
            offer.sdp = offer.sdp.replace('useinbandfec=1', 'useinbandfec=1;minptime=10;cbr=1');
            await pc.setLocalDescription(offer);

            sendSignal({ type: 'offer', from: myPeerId, target: targetReceiverId, sdp: offer });
        }

        /* ------------------ 3. 接收端：播放音訊與擴音輸出 ------------------ */
        async function handleRemoteOffer(broadcasterId, offerSdp) {
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[broadcasterId] = pc;

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    sendSignal({ type: 'candidate', from: myPeerId, target: broadcasterId, candidate: e.candidate });
                }
            };

            pc.ontrack = (event) => {
                const stream = event.streams[0];
                setupAudioContext(stream, true);

                isReceiving = true;
                mainToggleBtn.classList.add('receiving');
                mainBtnText.innerText = "RECEIVING (播放中)";
                subHintText.innerText = "已連線至麥克風發射端，音訊正在即時輸出";
                statusDot.className = 'status-dot active-live';
                linkStatusText.innerText = "LINKED LIVE";
            };

            await pc.setRemoteDescription(new RTCSessionDescription(offerSdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            sendSignal({ type: 'answer', from: myPeerId, target: broadcasterId, sdp: answer });
        }

        /* ------------------ 4. 專業 Web Audio 增益放大與 LED 電平 ------------------ */
        function setupAudioContext(stream, isPlaybackDestination) {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    latencyHint: 'interactive'
                });
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            const source = audioContext.createMediaStreamSource(stream);
            gainNode = audioContext.createGain();
            analyser = audioContext.createAnalyser();

            analyser.fftSize = 64;
            gainNode.gain.value = parseFloat(gainSlider.value);

            source.connect(gainNode);
            gainNode.connect(analyser);

            if (isPlaybackDestination) {
                // 接收端將聲音導向喇叭輸出
                gainNode.connect(audioContext.destination);
            }

            drawVisualizer();
        }

        function updateGain(val) {
            const num = parseFloat(val);
            if (gainNode) gainNode.gain.value = num;
            gainValueDisplay.innerText = Math.round(num * 100) + '%';
        }

        /* ------------------ 5. 畫布：LED 級聯電平動態繪製 ------------------ */
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = '#0E0F10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const avg = sum / dataArray.length; // 0 ~ 255

            // 繪製 LED 柱段 (橫向多格立體表)
            const numBars = 32;
            const barWidth = (canvas.width / numBars) - 3;
            const levelRatio = avg / 120; // 敏感度系數

            for (let i = 0; i < numBars; i++) {
                const threshold = i / numBars;
                let barColor = '#242528';

                if (levelRatio > threshold) {
                    if (threshold > 0.85) barColor = '#D94A43'; // 紅色過載峰值
                    else if (threshold > 0.65) barColor = '#C5A059'; // 琥珀警戒
                    else barColor = '#3EB370'; // 綠色正常
                }

                ctx.fillStyle = barColor;
                const barHeight = Math.min(canvas.height - 16, Math.max(8, (avg * 0.7)));
                ctx.fillRect(i * (barWidth + 3) + 4, (canvas.height - barHeight) / 2, barWidth, barHeight);
            }
        }

        /* ------------------ 6. 操作邏輯與角色切換 ------------------ */
        function switchRole(role) {
            if (isStreaming) stopBroadcaster();
            myRole = role;

            btnRoleBroadcast.classList.remove('mode-active');
            btnRoleReceiver.classList.remove('mode-active');
            mainToggleBtn.className = 'big-push-btn';

            if (role === 'broadcaster') {
                btnRoleBroadcast.classList.add('mode-active');
                btnIconMic.style.display = 'block';
                btnIconSpeaker.style.display = 'none';
                mainBtnText.innerText = "開啟咪高風";
                gainLabel.innerText = "咪增益 / MIC GAIN";
                subHintText.innerText = "點擊上方按鈕開始超低延遲語音串流";
            } else {
                btnRoleReceiver.classList.add('mode-active');
                btnIconMic.style.display = 'none';
                btnIconSpeaker.style.display = 'block';
                mainBtnText.innerText = "啟用音響播放";
                gainLabel.innerText = "喇叭音量 / VOLUME";
                subHintText.innerText = "點擊以允許瀏覽器播放音訊串流";
            }
            updateURLParams();
        }

        function handleMainAction() {
            // 解除瀏覽器音訊限制
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }

            if (myRole === 'broadcaster') {
                if (!isStreaming) startBroadcaster();
                else stopBroadcaster();
            } else {
                // 接收端點擊以解鎖音訊自動播放機制
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                audioContext.resume().then(() => {
                    mainBtnText.innerText = "音訊已就緒";
                    subHintText.innerText = "已解鎖音響播放權限，正等待發射端傳送聲音...";
                    sendSignal({ type: 'receiver-ready', from: myPeerId });
                });
            }
        }

        function updateURLParams() {
            roomCodeDisplay.innerText = currentRoomId;
            modalRoomNum.innerText = currentRoomId;
            const newUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}&role=${myRole}`;
            window.history.replaceState(null, '', newUrl);
        }

        /* ------------------ 7. 配對彈窗與 QR Code ------------------ */
        const pairModal = document.getElementById('pairModal');
        const qrContainer = document.getElementById('qrContainer');

        function openPairModal() {
            pairModal.classList.add('active');
            qrContainer.innerHTML = '';

            // 生成專門讓另一台手機直接以「接收」或「發射」配對的連結
            const oppositeRole = (myRole === 'broadcaster') ? 'receiver' : 'broadcaster';
            const targetUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}&role=${oppositeRole}`;

            new QRCode(qrContainer, {
                text: targetUrl,
                width: 170,
                height: 170,
                colorDark: "#121315",
                colorLight: "#FFFFFF",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function closePairModal() { pairModal.classList.remove('active'); }
        function closeModalOnBackdrop(e) { if (e.target === pairModal) closePairModal(); }

        function submitManualJoin() {
            const val = document.getElementById('inputJoinRoom').value.replace(/\D/g, '').trim();
            if (val.length < 4) return alert("請輸入有效的房間號碼");
            currentRoomId = val;
            updateURLParams();
            closePairModal();
            initSignaling();
        }

        // 啟動初始化
        switchRole(myRole);
        updateURLParams();
        initSignaling();
    </script>
</body>
</html>
