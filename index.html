<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 粵語白話字幕機</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@600;700;900&display=swap" rel="stylesheet">

    <!-- 1. 權威粵拼 ESM 模組 -->
    <script type="module">
        import ToJyutping from 'https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm';
        window.ToJyutping = ToJyutping;
    </script>

    <!-- 2. Three.js 3D 繪圖引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- 3. OpenCC-js 香港繁體正字 -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>

    <!-- 4. Puter.js 白話大模型引擎 -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        :root {
            --bg-color: #07090e;
            --machine-bezel: #161b26;
            --screen-glass-bg: rgba(6, 11, 20, 0.88);
            --cantonese-color: #f8fafc;
            --mandarin-color: #38bdf8;
            --active-green: #10b981;
            --ruby-color: #f59e0b;
            --play-red: #ef4444;

            --cantonese-size: 1.55rem;
            --mandarin-size: 1.25rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--cantonese-color);
            font-family: "Noto Serif HK", serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* Three.js 3D 機體畫布 */
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 頂部機載狀態 HUD */
        header {
            position: relative;
            z-index: 20;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(180deg, rgba(8, 12, 20, 0.95) 0%, rgba(8, 12, 20, 0.75) 100%);
            backdrop-filter: blur(16px);
        }

        .hud-status-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .hud-status-badge {
            font-family: "Noto Sans HK", sans-serif;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(148, 163, 184, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .hud-status-badge.active {
            background: rgba(16, 185, 129, 0.18);
            border-color: rgba(16, 185, 129, 0.5);
            color: #34d399;
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.25);
        }

        .hud-status-badge .indicator-light {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .hud-status-badge.active .indicator-light {
            animation: pulseGlow 1.6s infinite;
        }

        .hud-info-text {
            font-size: 0.88rem;
            color: #94a3b8;
            font-weight: 500;
            font-family: "Noto Sans HK", sans-serif;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .hud-btn:active { transform: scale(0.92); }
        .hud-btn:hover { color: #ffffff; background: rgba(255, 255, 255, 0.14); }
        .hud-btn svg { width: 19px; height: 19px; stroke-width: 2; }

        .btn-power {
            background: var(--play-red);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.45);
            width: 44px;
            height: 44px;
            border-radius: 50%;
        }

        .btn-power:hover { background: #dc2626; }
        .btn-power.active {
            background: #059669;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* 3D 字幕機主屏幕容器 */
        #prompter-screen-wrapper {
            position: relative;
            z-index: 10;
            flex: 1;
            margin: 18px 36px 36px 36px;
            border-radius: 16px;
            border: 2px solid rgba(56, 189, 248, 0.22);
            background: var(--screen-glass-bg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(56, 189, 248, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        /* 屏幕內建遮罩與掃描線細節 */
        #prompter-screen-wrapper::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.18) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.55;
            z-index: 15;
        }

        #subtitle-stream {
            flex: 1;
            overflow-y: auto;
            padding: 26px 30px 240px 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
            position: relative;
            z-index: 12;
        }

        /* 字幕提詞卡 */
        .caption-segment {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 22px 26px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: segmentAppear 0.25s ease;
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .segment-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta-tags {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: "Noto Sans HK", sans-serif;
        }

        .meta-time {
            font-size: 0.76rem;
            color: #64748b;
        }

        .meta-count {
            font-size: 0.72rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .cantonese-display {
            font-size: var(--cantonese-size);
            font-weight: 700;
            line-height: 1.8;
            letter-spacing: 0.8px;
            color: var(--cantonese-color);
            word-break: break-word;
        }

        .cantonese-display .interim-inline {
            color: #38bdf8;
            opacity: 0.9;
            margin-left: 4px;
            border-bottom: 2px dashed rgba(56, 189, 248, 0.5);
        }

        .mandarin-display-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .mandarin-tag {
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--mandarin-color);
            font-weight: 700;
            margin-top: 4px;
            flex-shrink: 0;
            font-family: "Noto Sans HK", sans-serif;
        }

        .mandarin-text {
            font-size: var(--mandarin-size);
            line-height: 1.7;
            color: #bae6fd;
            word-break: break-word;
            font-weight: 500;
            font-family: "Noto Sans HK", sans-serif;
        }

        #fontToast {
            position: fixed;
            top: 75px;
            right: 28px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #38bdf8;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.2s ease;
            z-index: 30;
            font-family: "Noto Sans HK", sans-serif;
        }

        #fontToast.show { opacity: 1; transform: translateY(0); }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(14px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-window {
            background: #090e17;
            border: 1px solid rgba(56, 189, 248, 0.25);
            width: 100%;
            max-width: 680px;
            max-height: 84vh;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-header {
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: "Noto Sans HK", sans-serif;
        }

        .modal-body {
            padding: 26px;
            overflow-y: auto;
            flex: 1;
            line-height: 2.6;
            background: #05080f;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 2px;
        }

        ruby.jp-ruby {
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            vertical-align: bottom;
            margin: 2px 4px;
            line-height: 1;
        }

        ruby.jp-ruby rt.c-rt {
            display: block;
            font-size: 0.78rem;
            line-height: 1;
            font-family: "Noto Sans HK", sans-serif;
            color: var(--ruby-color);
            font-weight: 500;
            margin-bottom: 6px;
            user-select: none;
        }

        ruby.jp-ruby span.c-char {
            display: block;
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.25;
            font-family: "Noto Serif HK", serif;
            color: #f8fafc;
        }

        span.jp-punct {
            display: inline-block;
            font-size: 1.6rem;
            line-height: 1.25;
            vertical-align: bottom;
            color: #64748b;
            margin: 0 3px 2px 3px;
        }

        .modal-footer {
            padding: 14px 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            font-family: "Noto Sans HK", sans-serif;
        }

        @keyframes segmentAppear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulseGlow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }

        #subtitle-stream::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 5px; }
        #subtitle-stream::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Three.js 繪製實體字幕機機身 -->
    <canvas id="three-canvas"></canvas>

    <header>
        <div class="hud-status-group">
            <div id="liveBadge" class="hud-status-badge">
                <span class="indicator-light"></span>
                <span id="liveBadgeText">待命</span>
            </div>
            <span id="statusInfo" class="hud-info-text">字幕機準備就緒</span>
        </div>
        <div class="btn-group">
            <button class="hud-btn" title="切換字體尺寸" onclick="cycleFontSize()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.5 17.5L6.5 9.5L9.5 17.5"></path>
                    <path d="M4.8 14.5H8.2"></path>
                    <path d="M12.5 17.5L16.5 6.5L20.5 17.5"></path>
                    <path d="M14 13.5H19"></path>
                </svg>
            </button>

            <button class="hud-btn" title="示範語句" onclick="playDemoSentence()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
                </svg>
            </button>

            <!-- 按一下即授權並永續運作 -->
            <button id="toggleBtn" class="hud-btn btn-power" title="開始識別" onclick="toggleSpeech()">
                <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"></path>
                </svg>
                <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="5" width="4" height="14" rx="1.5"></rect>
                    <rect x="14" y="5" width="4" height="14" rx="1.5"></rect>
                </svg>
            </button>
        </div>
    </header>

    <div id="fontToast">字體 標準</div>

    <!-- 3D 提詞機屏幕區域 -->
    <div id="prompter-screen-wrapper">
        <main id="subtitle-stream"></main>
    </div>

    <!-- 粵拼彈窗 -->
    <div id="phoneticModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-window">
            <div class="modal-header">
                <div class="modal-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                    </svg>
                    <span>粵語每字拼音與發音</span>
                </div>
                <button class="hud-btn" style="width:32px; height:32px;" onclick="closePhoneticModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="modalContent" class="modal-body"></div>
            <div class="modal-footer">
                <span id="ttsStatus" style="font-size: 0.82rem; color: #94a3b8;">就緒</span>
                <button id="ttsPlayBtn" class="hud-btn" style="background:#0284c7; color:#fff;" title="播放粵語發音" onclick="speakCurrentText()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="6 3 20 12 6 21 6 3"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ------------------ 1. Three.js 繪製實體字幕機機體（非粒子） ------------------ */
        let scene, camera, renderer, machineGroup;
        let tallyLightMesh, tallyPointLight;
        let targetRotX = 0, targetRotY = 0;

        function initThreeMachine() {
            const canvas = document.getElementById('three-canvas');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 0, 520);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // 機體父級
            machineGroup = new THREE.Group();

            // 1. 字幕機主金屬外殼（Bezel）
            const chassisGeo = new THREE.BoxGeometry(460, 290, 16);
            const chassisMat = new THREE.MeshStandardMaterial({
                color: 0x111622,
                roughness: 0.35,
                metalness: 0.85
            });
            const chassis = new THREE.Mesh(chassisGeo, chassisMat);
            machineGroup.add(chassis);

            // 2. 演播室機頂金屬遮光罩（Hood/Visor）
            const hoodTopGeo = new THREE.BoxGeometry(470, 8, 40);
            const hoodSideGeo = new THREE.BoxGeometry(8, 290, 40);
            const hoodMat = new THREE.MeshStandardMaterial({ color: 0x090d15, roughness: 0.6, metalness: 0.5 });

            const hoodTop = new THREE.Mesh(hoodTopGeo, hoodMat);
            hoodTop.position.set(0, 145, 16);
            machineGroup.add(hoodTop);

            const hoodLeft = new THREE.Mesh(hoodSideGeo, hoodMat);
            hoodLeft.position.set(-232, 0, 16);
            machineGroup.add(hoodLeft);

            const hoodRight = new THREE.Mesh(hoodSideGeo, hoodMat);
            hoodRight.position.set(232, 0, 16);
            machineGroup.add(hoodRight);

            // 3. 機頂實體 Tally 運作指示燈
            const tallyGeo = new THREE.BoxGeometry(36, 12, 16);
            tallyLightMesh = new THREE.Mesh(tallyGeo, new THREE.MeshStandardMaterial({
                color: 0x222630,
                emissive: 0x000000,
                roughness: 0.2
            }));
            tallyLightMesh.position.set(0, 155, 6);
            machineGroup.add(tallyLightMesh);

            tallyPointLight = new THREE.PointLight(0x10b981, 0, 180);
            tallyPointLight.position.set(0, 165, 25);
            machineGroup.add(tallyPointLight);

            // 4. 四周精緻機身螺絲
            const screwGeo = new THREE.CylinderGeometry(3, 3, 2, 8);
            const screwMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9, roughness: 0.2 });
            const corners = [
                [-220, 135], [220, 135],
                [-220, -135], [220, -135]
            ];
            corners.forEach(([x, y]) => {
                const s = new THREE.Mesh(screwGeo, screwMat);
                s.rotation.x = Math.PI / 2;
                s.position.set(x, y, 9);
                machineGroup.add(s);
            });

            scene.add(machineGroup);

            // 演播室燈光
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            dirLight.position.set(150, 200, 300);
            scene.add(dirLight);

            const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
            rimLight.position.set(-200, -100, -100);
            scene.add(rimLight);

            // 視差微晃監聽
            window.addEventListener('mousemove', (e) => {
                const nx = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
                const ny = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
                targetRotY = nx * 0.08;
                targetRotX = -ny * 0.05;
            });

            window.addEventListener('resize', onThreeResize);
            animateThreeMachine();
        }

        function onThreeResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setMachineTallyActive(isActive) {
            if (!tallyLightMesh) return;
            if (isActive) {
                tallyLightMesh.material.emissive.setHex(0x10b981);
                tallyLightMesh.material.color.setHex(0x10b981);
                tallyPointLight.intensity = 2.0;
            } else {
                tallyLightMesh.material.emissive.setHex(0x000000);
                tallyLightMesh.material.color.setHex(0x222630);
                tallyPointLight.intensity = 0;
            }
        }

        function animateThreeMachine() {
            requestAnimationFrame(animateThreeMachine);
            machineGroup.rotation.y += (targetRotY - machineGroup.rotation.y) * 0.06;
            machineGroup.rotation.x += (targetRotX - machineGroup.rotation.x) * 0.06;
            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', initThreeMachine);

        /* ------------------ 2. 徹底現代白話文轉譯（無括號、無文言） ------------------ */
        let hkConverter = null;
        try {
            if (window.OpenCC) hkConverter = window.OpenCC.Converter({ from: 'cn', to: 'hk' });
        } catch (e) {}

        // 清除所有形式的括號
        function stripAllBrackets(text) {
            if (!text) return "";
            return text.replace(/[()（）\[\]【】{}《》「」『』〈〉"'“”‘’]/g, '').trim();
        }

        // 毫秒級通俗口語白話直出（嚴禁文言文）
        function translateToSpokenVernacular(text) {
            if (!text || !text.trim()) return "";
            let res = text;

            // 口語倒裝順序矯正
            res = res.replace(/([\u4e00-\u9fa5]{1,2})先([，。？！、\s]|$)/g, "先$1$2");
            res = res.replace(/([\u4e00-\u9fa5]{1,2})得滯/g, "太$1了");
            res = res.replace(/畀([\u4e00-\u9fa5]{1,4})我/g, "把$1給我");

            const SPOKEN_MAP = [
                [/都唔好肯定/g, "也不太敢確定"],
                [/唔好肯定/g, "不太敢確定"],
                [/唔係幾好/g, "不太好"],
                [/唔係咁/g, "不是這樣"],
                [/係咪/g, "是不是"],
                [/點解/g, "為什麼"],
                [/邊度/g, "哪裡"],
                [/邊個/g, "誰"],
                [/幾時/g, "什麼時候"],
                [/點樣/g, "怎樣"],
                [/冇乜/g, "沒什麼"],
                [/冇咩/g, "沒什麼"],
                [/有冇/g, "有沒有"],
                [/好似/g, "好像"],
                [/睇下/g, "看一下"],
                [/屋企/g, "家裡"],
                [/返工/g, "上班"],
                [/收工/g, "下班"],
                [/返學/g, "上學"],
                [/佢哋/g, "他們"],
                [/我哋/g, "我們"],
                [/你哋/g, "你們"],
                [/佢/g, "他"],
                [/喺度/g, "正在"],
                [/喺/g, "在"],
                [/呢個/g, "這個"],
                [/呢啲/g, "這些"],
                [/嗰個/g, "那個"],
                [/嗰啲/g, "那些"],
                [/咁樣/g, "這樣"],
                [/唔好/g, "不要"],
                [/唔/g, "不"],
                [/冇/g, "沒有"],
                [/咗/g, "了"],
                [/緊/g, "正在"],
                [/過嚟/g, "過來"],
                [/啱啱/g, "剛剛"],
                [/真係/g, "真是"],
                [/買咗/g, "買了"],
                [/畀/g, "給"],
                [/話/g, "說"],
                [/諗/g, "想"],
                [/睇/g, "看"],
                [/講/g, "說"],
                [/㗎喇/g, "的了"],
                [/㗎/g, "的"],
                [/啦/g, "吧"],
                [/囉/g, "呢"],
                [/嘅/g, "的"]
            ];

            for (let i = 0; i < SPOKEN_MAP.length; i++) {
                res = res.replace(SPOKEN_MAP[i][0], SPOKEN_MAP[i][1]);
            }
            return stripAllBrackets(res);
        }

        /* ------------------ 3. Puter AI 通俗白話深層轉譯（杜絕文言） ------------------ */
        async function requestPuterWhiteTalk(cardObj) {
            const rawCanto = cardObj.fullPunctuatedText;
            if (!rawCanto || !rawCanto.trim()) return;

            if (!window.puter || !window.puter.auth || !puter.auth.isSignedIn() || !window.puter.ai) {
                return;
            }

            try {
                const prompt = `你是粵語對譯白話文專家。請將以下粵語日常講話翻譯為通俗標準的現代白話文普通話。
要求：
1. 必須是通俗日常的現代白話文，絕不能帶任何文言、古漢語或書面文言字詞。
2. 徹底理順所有粵語倒裝句式。
3. 嚴禁任何括號，如圓括號、方括號、引號等。
4. 直接輸出白話譯文本身，不要包含任何解釋或附言。

粵語：${rawCanto}`;

                const response = await puter.ai.chat(prompt);

                let aiText = "";
                if (typeof response === 'string') aiText = response;
                else if (response && response.message) aiText = response.message.content;
                else if (response) aiText = String(response);

                aiText = stripAllBrackets(aiText);

                if (aiText) {
                    cardObj.mandarinEl.innerText = aiText;
                }
            } catch (err) {}
        }

        /* ------------------ 4. 字幕機串流架構 ------------------ */
        const streamContainer = document.getElementById('subtitle-stream');
        const liveBadge = document.getElementById('liveBadge');
        const liveBadgeText = document.getElementById('liveBadgeText');
        const statusInfo = document.getElementById('statusInfo');
        const toggleBtn = document.getElementById('toggleBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        let autoScroll = true;
        let currentCardObj = null;

        streamContainer.addEventListener('scroll', () => {
            const threshold = 80;
            autoScroll = streamContainer.scrollHeight - streamContainer.scrollTop - streamContainer.clientHeight < threshold;
        });

        function cleanString(str) {
            return (str || '').replace(/[，。？！、\s\.,!\?]/g, '');
        }

        function createNewSegmentCard() {
            const card = document.createElement('div');
            card.className = 'caption-segment';

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            card.innerHTML = `
                <div class="segment-meta-bar">
                    <div class="meta-tags">
                        <span class="meta-time">${timeStr}</span>
                        <span class="meta-count">0 字</span>
                    </div>
                    <button class="hud-btn" style="width:30px; height:30px;" title="查看每字粵拼與發音" onclick="openPhoneticModal(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </button>
                </div>
                <div class="cantonese-display"><span class="confirmed-part"></span><span class="interim-inline"></span></div>
                <div class="mandarin-display-box">
                    <span class="mandarin-tag">普通話</span>
                    <div class="mandarin-text">聆聽中...</div>
                </div>
            `;
            streamContainer.appendChild(card);

            currentCardObj = {
                cardEl: card,
                confirmedSpan: card.querySelector('.confirmed-part'),
                interimSpan: card.querySelector('.interim-inline'),
                mandarinEl: card.querySelector('.mandarin-text'),
                counterEl: card.querySelector('.meta-count'),
                rawConfirmedText: "",
                fullPunctuatedText: "",
                aiTimer: null
            };

            scrollToBottom();
            return currentCardObj;
        }

        function handleSpeechInterim(interim) {
            if (!interim || !interim.trim()) return;
            if (!currentCardObj) createNewSegmentCard();

            currentCardObj.interimSpan.innerText = interim;
            const previewText = currentCardObj.fullPunctuatedText + interim;
            currentCardObj.mandarinEl.innerText = translateToSpokenVernacular(previewText);
            scrollToBottom();
        }

        function handleSpeechFinal(finalText) {
            finalText = stripAllBrackets(finalText.trim());
            if (!finalText) return;

            if (hkConverter) {
                try { finalText = hkConverter(finalText); } catch (e) {}
            }

            if (!currentCardObj) createNewSegmentCard();
            currentCardObj.interimSpan.innerText = "";

            const cleanFinal = cleanString(finalText);
            const cleanConfirmed = cleanString(currentCardObj.rawConfirmedText);
            if (cleanConfirmed.endsWith(cleanFinal)) return;

            let delta = finalText;
            for (let i = finalText.length; i >= 1; i--) {
                const prefix = finalText.slice(0, i);
                if (cleanConfirmed.endsWith(cleanString(prefix))) {
                    delta = finalText.slice(i).trim();
                    break;
                }
            }
            if (!delta) return;

            if (cleanString(currentCardObj.rawConfirmedText).length > 150) {
                createNewSegmentCard();
            }

            const formatted = delta + "，";
            currentCardObj.rawConfirmedText += delta;
            currentCardObj.fullPunctuatedText += formatted;

            currentCardObj.confirmedSpan.innerText = currentCardObj.fullPunctuatedText;
            currentCardObj.counterEl.innerText = `${cleanString(currentCardObj.rawConfirmedText).length} 字`;

            currentCardObj.mandarinEl.innerText = translateToSpokenVernacular(currentCardObj.fullPunctuatedText);

            // 停頓 0.35 秒後直接替換為 Puter AI 精修白話版本
            if (window.puter && window.puter.auth && puter.auth.isSignedIn()) {
                if (currentCardObj.aiTimer) clearTimeout(currentCardObj.aiTimer);
                currentCardObj.aiTimer = setTimeout(() => {
                    requestPuterWhiteTalk(currentCardObj);
                }, 350);
            }

            scrollToBottom();
        }

        function scrollToBottom() {
            if (autoScroll) {
                streamContainer.scrollTop = streamContainer.scrollHeight;
            }
        }

        /* ------------------ 5. 永不中斷・防休眠全天候語音核心 ------------------ */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let userWantsListening = false;
        let isEngineRunning = false;
        let wakeLock = null;

        // HTML5 靜音音頻流防休眠保活機制（徹底阻止瀏覽器或手機進入省電休眠）
        const SILENT_AUDIO_URI = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
        const keepAliveAudio = new Audio(SILENT_AUDIO_URI);
        keepAliveAudio.loop = true;

        async function acquireWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
        }

        function ensureRecognitionActive() {
            if (userWantsListening && !isEngineRunning && recognition) {
                try {
                    recognition.start();
                } catch (e) {}
            }
        }

        // 看門狗守護線程：每 400ms 檢查並保證系統絕不停止
        setInterval(() => {
            if (userWantsListening) {
                ensureRecognitionActive();
            }
        }, 400);

        // 切換頁面或黑屏重亮時自動重連
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && userWantsListening) {
                acquireWakeLock();
                ensureRecognitionActive();
            }
        });

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-HK';
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isEngineRunning = true;
                liveBadge.className = "hud-status-badge active";
                liveBadgeText.innerText = "運作中";
                statusInfo.innerText = "白話字幕機常駐翻譯中";
                toggleBtn.classList.add('active');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                setMachineTallyActive(true);
            };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const trans = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        handleSpeechFinal(trans);
                    } else {
                        interim += trans;
                    }
                }
                if (interim) handleSpeechInterim(interim);
            };

            recognition.onerror = (e) => {
                // 不因任何暫態錯誤停止工作
                if (e.error === 'not-allowed') {
                    userWantsListening = false;
                    stopListeningUI();
                    alert("請允許麥克風權限以使用字幕機。");
                } else {
                    setTimeout(ensureRecognitionActive, 60);
                }
            };

            recognition.onend = () => {
                isEngineRunning = false;
                if (userWantsListening) {
                    // 自動重連，持續常駐
                    setTimeout(ensureRecognitionActive, 40);
                } else {
                    stopListeningUI();
                }
            };
        }

        /* ------------------ 6. 單鍵啟動：按紅鍵即授權啟動 ------------------ */
        async function toggleSpeech() {
            if (!recognition) {
                alert("當前瀏覽器不支援語音辨識，請使用 Chrome、Edge 或 Safari。");
                return;
            }

            if (userWantsListening) {
                userWantsListening = false;
                releaseWakeLock();
                try { keepAliveAudio.pause(); } catch(e) {}
                try { recognition.stop(); } catch(e) {}
                stopListeningUI();
            } else {
                userWantsListening = true;
                acquireWakeLock();
                try { keepAliveAudio.play(); } catch(e) {}
                ensureRecognitionActive();

                // 首次點擊時自動免密授權 Puter AI
                if (window.puter && window.puter.auth && !puter.auth.isSignedIn()) {
                    puter.auth.signIn({ attempt_temp_user_creation: true })
                        .then(() => {
                            if (currentCardObj && currentCardObj.fullPunctuatedText) {
                                requestPuterWhiteTalk(currentCardObj);
                            }
                        })
                        .catch(() => {});
                }
            }
        }

        function stopListeningUI() {
            liveBadge.className = "hud-status-badge";
            liveBadgeText.innerText = "待命";
            statusInfo.innerText = "字幕機已暫停";
            toggleBtn.classList.remove('active');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            setMachineTallyActive(false);
            if (currentCardObj && currentCardObj.interimSpan) {
                currentCardObj.interimSpan.innerText = "";
            }
        }

        /* ------------------ 7. 字體調節 ------------------ */
        const fontScales = [
            { name: "標準", canto: "1.55rem", mando: "1.25rem" },
            { name: "放大", canto: "1.85rem", mando: "1.45rem" },
            { name: "特大", canto: "2.25rem", mando: "1.75rem" }
        ];
        let currentScaleIdx = 0;
        let toastTimer = null;
        const fontToast = document.getElementById('fontToast');

        function cycleFontSize() {
            currentScaleIdx = (currentScaleIdx + 1) % fontScales.length;
            const cur = fontScales[currentScaleIdx];
            document.documentElement.style.setProperty('--cantonese-size', cur.canto);
            document.documentElement.style.setProperty('--mandarin-size', cur.mando);

            fontToast.innerText = `字體 ${cur.name}`;
            fontToast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => fontToast.classList.remove('show'), 1200);
            scrollToBottom();
        }

        /* ------------------ 8. 粵拼彈窗與發音 ------------------ */
        const modal = document.getElementById('phoneticModal');
        const modalContent = document.getElementById('modalContent');
        const ttsStatus = document.getElementById('ttsStatus');
        let currentPureText = "";

        async function fetchJyutpingRubyHTML(text) {
            if (!text) return "";
            if (!window.ToJyutping) {
                try {
                    const mod = await import('https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm');
                    window.ToJyutping = mod.default || mod;
                } catch (e) {}
            }

            let html = "";
            if (window.ToJyutping && typeof window.ToJyutping.getJyutpingList === 'function') {
                try {
                    const list = window.ToJyutping.getJyutpingList(text);
                    for (const [char, rawJp] of list) {
                        if (char === '\n') {
                            html += '<div style="flex-basis: 100%; height: 8px;"></div>';
                            continue;
                        }
                        if (rawJp) {
                            html += `<ruby class="jp-ruby"><span class="c-char">${char}</span><rt class="c-rt">${rawJp}</rt></ruby>`;
                        } else {
                            html += `<span class="jp-punct">${char}</span>`;
                        }
                    }
                    return html;
                } catch (err) {}
            }
            return text;
        }

        async function openPhoneticModal(btn) {
            const card = btn.closest('.caption-segment');
            const cantoneseEl = card.querySelector('.confirmed-part');
            const fullText = (cantoneseEl.innerText || "").trim();
            currentPureText = cleanString(fullText);

            if (!fullText) {
                modalContent.innerHTML = "<div style='color:#64748b; font-size:1rem; padding:10px;'>暫無文字</div>";
                modal.classList.add('active');
                return;
            }

            modalContent.innerHTML = "<div style='color:#94a3b8; font-size:1rem; width:100%; text-align:center; padding:30px 0;'>正在標註粵拼...</div>";
            ttsStatus.innerText = "標音中";
            modal.classList.add('active');

            const rubyHTML = await fetchJyutpingRubyHTML(fullText);
            modalContent.innerHTML = rubyHTML;
            ttsStatus.innerText = "就緒";
        }

        function closePhoneticModal() {
            modal.classList.remove('active');
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }

        function closeModalOnBackdrop(event) {
            if (event.target === modal) closePhoneticModal();
        }

        function speakCurrentText() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utter = new SpeechSynthesisUtterance(currentPureText);
            utter.lang = 'zh-HK';
            utter.rate = 0.85;

            utter.onstart = () => ttsStatus.innerText = "朗讀中";
            utter.onend = () => ttsStatus.innerText = "完畢";
            utter.onerror = () => ttsStatus.innerText = "就緒";

            window.speechSynthesis.speak(utter);
        }

        /* ------------------ 9. 範例示範 ------------------ */
        const demoSentences = [
            "其實我都唔好肯定㗎",
            "我覺得幾好",
            "今日我哋一齊研究下呢個課題，大家睇下邊個方案比較好"
        ];
        let demoIdx = 0;

        function playDemoSentence() {
            const text = demoSentences[demoIdx % demoSentences.length];
            demoIdx++;
            handleSpeechFinal(text);

            if (window.puter && window.puter.auth && !puter.auth.isSignedIn()) {
                puter.auth.signIn({ attempt_temp_user_creation: true })
                    .then(() => {
                        if (currentCardObj) requestPuterWhiteTalk(currentCardObj);
                    })
                    .catch(() => {});
            }
        }
    </script>
