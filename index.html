<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實時粵語課堂字幕機</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;600;700&family=Noto+Serif+HK:wght@500;600;700;900&display=swap" rel="stylesheet">

    <!-- 1. 權威粵拼 ESM 模組 -->
    <script type="module">
        import ToJyutping from 'https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm';
        window.ToJyutping = ToJyutping;
    </script>

    <!-- 2. 外部輔助庫 -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.basic.min.js"></script>
    <script src="https://js.puter.com/v2/"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.09);
            --cantonese-color: #f8fafc;
            --mandarin-color: #38bdf8;
            --meta-color: #94a3b8;
            --accent-active: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --ruby-color: #fbbf24;

            --play-red: #e11d48;
            --play-red-glow: rgba(225, 29, 72, 0.45);

            --cantonese-size: 1.45rem;
            --mandarin-size: 1.05rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--cantonese-color);
            font-family: "Noto Serif HK", "Noto Serif TC", "Source Han Serif TC", "Songti TC", "Kaiti TC", serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(14px);
            z-index: 10;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #475569;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: var(--accent-active);
            box-shadow: 0 0 12px var(--accent-glow);
            animation: pulse 1.8s infinite;
        }

        .status-text {
            font-size: 0.88rem;
            color: var(--meta-color);
            font-weight: 500;
            font-family: "Noto Sans HK", sans-serif;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .svg-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: #94a3b8;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .svg-btn:active { transform: scale(0.9); }
        .svg-btn:hover { color: #f8fafc; background: rgba(255, 255, 255, 0.12); }
        .svg-btn svg { width: 18px; height: 18px; stroke-width: 2; }

        .play-btn-red {
            background: var(--play-red);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            box-shadow: 0 0 14px var(--play-red-glow);
        }

        .play-btn-red:hover { background: #be123c; }
        .play-btn-red.active { background: #9f1239; animation: redPulse 1.8s infinite; }

        #subtitle-stream {
            flex: 1;
            overflow-y: auto;
            padding: 22px 20px 240px 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            scroll-behavior: smooth;
        }

        .caption-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.25s ease;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .caption-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .caption-meta-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: "Noto Sans HK", sans-serif;
        }

        .caption-time {
            font-size: 0.75rem;
            color: #64748b;
        }

        .char-counter {
            font-size: 0.72rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .cantonese-text {
            font-size: var(--cantonese-size);
            font-weight: 600;
            line-height: 1.85;
            letter-spacing: 0.8px;
            color: var(--cantonese-color);
            word-break: break-word;
            transition: font-size 0.2s ease;
        }

        .cantonese-text .interim-preview {
            color: #38bdf8;
            opacity: 0.85;
            margin-left: 4px;
            border-bottom: 1px dashed rgba(56, 189, 248, 0.4);
        }

        .mandarin-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 6px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .mandarin-tag {
            font-size: 0.68rem;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--mandarin-color);
            font-weight: 700;
            margin-top: 4px;
            flex-shrink: 0;
            font-family: "Noto Sans HK", sans-serif;
            transition: all 0.2s ease;
        }

        .mandarin-tag.ai-loading {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .mandarin-tag.ai-active {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .mandarin-text {
            font-size: var(--mandarin-size);
            line-height: 1.7;
            color: #7dd3fc;
            word-break: break-word;
            font-weight: 400;
            transition: font-size 0.2s ease, color 0.2s ease;
        }

        #fontToast {
            position: fixed;
            top: 60px;
            right: 18px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 10px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.2s ease;
            z-index: 20;
            font-family: "Noto Sans HK", sans-serif;
        }

        #fontToast.show { opacity: 1; transform: translateY(0); }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-window {
            background: #12151d;
            border: 1px solid rgba(255, 255, 255, 0.16);
            width: 100%;
            max-width: 680px;
            max-height: 84vh;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-header {
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: "Noto Sans HK", sans-serif;
        }

        .modal-body {
            padding: 26px;
            overflow-y: auto;
            flex: 1;
            line-height: 2.6;
            background: #0d0f15;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 2px 2px;
        }

        ruby.jp-ruby {
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            vertical-align: bottom;
            margin: 2px 3px;
            line-height: 1;
        }

        ruby.jp-ruby rt.c-rt {
            display: block;
            font-size: 0.76rem;
            line-height: 1;
            font-family: "Noto Sans HK", sans-serif;
            color: var(--ruby-color);
            font-weight: 500;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
            user-select: none;
        }

        ruby.jp-ruby span.c-char {
            display: block;
            font-size: 1.55rem;
            font-weight: 600;
            line-height: 1.25;
            font-family: "Noto Serif HK", serif;
            color: #f8fafc;
        }

        span.jp-punct {
            display: inline-block;
            font-size: 1.55rem;
            line-height: 1.25;
            vertical-align: bottom;
            color: #64748b;
            margin: 0 3px 2px 3px;
            font-family: "Noto Serif HK", serif;
        }

        .modal-footer {
            padding: 14px 22px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            font-family: "Noto Sans HK", sans-serif;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }
        @keyframes redPulse { 0% { box-shadow: 0 0 10px rgba(225, 29, 72, 0.4); } 50% { box-shadow: 0 0 22px rgba(225, 29, 72, 0.85); } 100% { box-shadow: 0 0 10px rgba(225, 29, 72, 0.4); } }
        #subtitle-stream::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 5px; }
        #subtitle-stream::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <div class="status-container">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText" class="status-text">語音引擎準備就緒</span>
        </div>
        <div class="btn-group">
            <button class="svg-btn" title="調節字體大小" onclick="cycleFontSize()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.5 17.5L6.5 9.5L9.5 17.5"></path>
                    <path d="M4.8 14.5H8.2"></path>
                    <path d="M12.5 17.5L16.5 6.5L20.5 17.5"></path>
                    <path d="M14 13.5H19"></path>
                </svg>
            </button>

            <button class="svg-btn" title="課堂範例示範" onclick="playDemoSentence()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
                </svg>
            </button>

            <button id="toggleBtn" class="svg-btn play-btn-red" title="開始/暫停識別" onclick="toggleSpeech()">
                <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"></path>
                </svg>
                <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="5" width="4" height="14" rx="1.5"></rect>
                    <rect x="14" y="5" width="4" height="14" rx="1.5"></rect>
                </svg>
            </button>
        </div>
    </header>

    <div id="fontToast">字體：標準</div>
    <main id="subtitle-stream"></main>

    <div id="phoneticModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-window">
            <div class="modal-header">
                <div class="modal-title-group">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                    </svg>
                    <span>粵語每字拼音與發音</span>
                </div>
                <button class="svg-btn" style="width:32px; height:32px;" onclick="closePhoneticModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="modalContent" class="modal-body"></div>
            <div class="modal-footer">
                <span id="ttsStatus" style="font-size: 0.82rem; color: #94a3b8;">就緒</span>
                <button id="ttsPlayBtn" class="svg-btn" style="background:#0284c7; color:#fff;" title="播放粵語發音" onclick="speakCurrentText()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="6 3 20 12 6 21 6 3"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ------------------ 1. 外部輔助庫初始化 ------------------ */
        let hkConverter = null;
        try {
            if (window.OpenCC) {
                hkConverter = window.OpenCC.Converter({ from: 'cn', to: 'hk' });
            }
        } catch (e) {}

        const CLASSROOM_CORE_VOCAB = [
            "出師表", "六國論", "岳陽樓記", "醉翁亭記", "始得西山宴遊記", "前赤壁賦",
            "念奴嬌", "赤壁懷古", "聲聲慢", "青玉案", "逍遙遊", "庖丁解牛",
            "廉頗藺相如列傳", "師說", "勸學", "魚我所欲也", "鴻門會", "項莊舞劍",
            "中道崩殂", "陟罰臧否", "裨補闕漏", "猥自枉屈", "咨諏善道", "臨表涕零",
            "弊在賂秦", "抱薪救火", "檣傾楫摧", "浩浩湯湯", "岸芷汀蘭", "政通人和",
            "百廢具興", "傴僂提攜", "宴酣之樂", "觥籌交錯", "餘音嫋嫋", "正襟危坐"
        ];

        let vocabFuse = null;
        if (window.Fuse) {
            vocabFuse = new window.Fuse(CLASSROOM_CORE_VOCAB, {
                includeScore: true,
                threshold: 0.32,
                minMatchCharLength: 2
            });
        }

        /* ------------------ 2. 定稿專用校正庫（僅在定稿時執行 1 次，零消耗） ------------------ */
        const CHINESE_SUBJECT_RULES = [
            [/出[屍尸]表/g, "出師表"],
            [/六國[亂爛]/g, "六國論"],
            [/[約越月]洋樓記/g, "岳陽樓記"],
            [/[最醉]擁亭記/g, "醉翁亭記"],
            [/始得西山[燕宴]遊記/g, "始得西山宴遊記"],
            [/前赤壁[副婦父]/g, "前赤壁賦"],
            [/念[老佬]嬌/g, "念奴嬌"],
            [/星[星猩]慢/g, "聲聲慢"],
            [/青[肉落]案/g, "青玉案"],
            [/消[遙遙]遊/g, "逍遙遊"],
            [/[拋包][釘丁]解牛/g, "庖丁解牛"],
            [/連[波坡]藺相如/g, "廉頗藺相如"],
            [/[練連]頗/g, "廉頗"],
            [/藺相[魚余]/g, "藺相如"],
            [/[C絲C司]說/g, "師說"],
            [/[券倦]學/g, "勸學"],
            [/魚我所[欲慾]也/g, "魚我所欲也"],
            [/[紅洪]門[宴會]/g, "鴻門會"],
            [/項[莊裝]舞劍/g, "項莊舞劍"],
            [/中道崩[曹除存]/g, "中道崩殂"],
            [/崩[曹除存]/g, "崩殂"],
            [/[則直]發[裝藏]否/g, "陟罰臧否"],
            [/[避卑]補[闕缺]漏/g, "裨補闕漏"],
            [/委自枉屈/g, "猥自枉屈"],
            [/資諏善道/g, "咨諏善道"],
            [/臨表[體涕]零/g, "臨表涕零"],
            [/弊在[露路]秦/g, "弊在賂秦"],
            [/抱[身薪]救火/g, "抱薪救火"],
            [/檣[傾頃]楫[摧催]/g, "檣傾楫摧"],
            [/浩浩[蕩蕩湯湯]{2}/g, "浩浩湯湯"],
            [/岸[子芷]汀蘭/g, "岸芷汀蘭"],
            [/政通人[何和]/g, "政通人和"],
            [/百廢[具俱]興/g, "百廢具興"],
            [/傴[樓僂]提攜/g, "傴僂提攜"],
            [/燕[堪酣]之樂/g, "宴酣之樂"],
            [/光籌交錯/g, "觥籌交錯"]
        ];

        function optimizeFinalText(text) {
            if (!text) return "";
            let res = text;

            if (hkConverter) {
                try { res = hkConverter(res); } catch (e) {}
            }

            for (let i = 0; i < CHINESE_SUBJECT_RULES.length; i++) {
                res = res.replace(CHINESE_SUBJECT_RULES[i][0], CHINESE_SUBJECT_RULES[i][1]);
            }
            return res;
        }

        /* ------------------ 3. 毫秒級極速本地粵普轉譯（0 延遲，支持倒裝） ------------------ */
        function translateFast(text) {
            if (!text || !text.trim()) return "";
            let res = text;

            res = res.replace(/([\u4e00-\u9fa5]{1,2})先([，。？！、\s]|$)/g, "先$1$2");
            res = res.replace(/([\u4e00-\u9fa5]{1,2})得滯/g, "太$1了");
            res = res.replace(/畀([\u4e00-\u9fa5]{1,4})我/g, "把$1給我");

            const FAST_MAP = [
                [/都唔好肯定/g, "也不太敢確定"],
                [/唔好肯定/g, "不太敢確定"],
                [/唔係幾好/g, "不太好"],
                [/唔係咁/g, "不是這樣"],
                [/係咪/g, "是不是"],
                [/點解/g, "為什麼"],
                [/邊度/g, "哪裡"],
                [/邊個/g, "誰"],
                [/幾時/g, "什麼時候"],
                [/點樣/g, "怎樣"],
                [/冇乜/g, "沒什麼"],
                [/冇咩/g, "沒什麼"],
                [/有冇/g, "有沒有"],
                [/好似/g, "好像"],
                [/睇下/g, "看一下"],
                [/屋企/g, "家裡"],
                [/返工/g, "上班"],
                [/佢哋/g, "他們"],
                [/我哋/g, "我們"],
                [/你哋/g, "你們"],
                [/佢/g, "他"],
                [/喺度/g, "正在"],
                [/喺/g, "在"],
                [/呢個/g, "這個"],
                [/呢啲/g, "這些"],
                [/嗰個/g, "那個"],
                [/嗰啲/g, "那些"],
                [/咁樣/g, "這樣"],
                [/唔好/g, "不要"],
                [/唔/g, "不"],
                [/冇/g, "沒有"],
                [/咗/g, "了"],
                [/緊/g, "正在"],
                [/過嚟/g, "過來"],
                [/啱啱/g, "剛剛"],
                [/啱/g, "對"],
                [/真係/g, "真是"],
                [/買咗/g, "買了"],
                [/畀/g, "給"],
                [/話/g, "說"],
                [/諗/g, "想"],
                [/睇/g, "看"],
                [/講/g, "說"],
                [/㗎喇[。，！]/g, "的了。"],
                [/㗎[。，！]/g, "的。"],
                [/啦[。，！]/g, "吧。"],
                [/囉[。，！]/g, "呢。"],
                [/嘅/g, "的"]
            ];

            for (let i = 0; i < FAST_MAP.length; i++) {
                res = res.replace(FAST_MAP[i][0], FAST_MAP[i][1]);
            }
            return res;
        }

        /* ------------------ 4. 第二軌：Puter AI 靜默潤色（背景非阻塞） ------------------ */
        async function requestPuterAIRefinement(cardObj) {
            const textToTranslate = cardObj.fullPunctuatedText;
            if (!textToTranslate || !textToTranslate.trim()) return;

            if (!window.puter || !window.puter.auth || !puter.auth.isSignedIn() || !window.puter.ai) {
                return;
            }

            if (cardObj.mandarinTagEl) {
                cardObj.mandarinTagEl.innerText = "普通話 (AI 潤色中...)";
                cardObj.mandarinTagEl.className = "mandarin-tag ai-loading";
            }

            try {
                const prompt = `你是粵普翻譯專家。請將以下粵語轉換為規範普通話書面語，修正倒裝，保留文言詞彙與詩句。只輸出結果：\n${textToTranslate}`;
                const response = await puter.ai.chat(prompt);

                let aiText = "";
                if (typeof response === 'string') aiText = response;
                else if (response && response.message) aiText = response.message.content;
                else if (response) aiText = String(response);

                aiText = aiText.replace(/^["'「『](.*)["'」』]$/s, '$1').trim();

                if (aiText) {
                    cardObj.mandarinEl.innerText = aiText;
                    if (cardObj.mandarinTagEl) {
                        cardObj.mandarinTagEl.innerText = "普通話・AI 精修";
                        cardObj.mandarinTagEl.className = "mandarin-tag ai-active";
                    }
                }
            } catch (err) {
                if (cardObj.mandarinTagEl) {
                    cardObj.mandarinTagEl.innerText = "普通話";
                    cardObj.mandarinTagEl.className = "mandarin-tag";
                }
            }
        }

        /* ------------------ 5. 字幕串流管理器 ------------------ */
        const streamContainer = document.getElementById('subtitle-stream');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const toggleBtn = document.getElementById('toggleBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        let autoScroll = true;
        let currentCardObj = null;
        const MAX_CHAR_PER_CARD = 160;

        streamContainer.addEventListener('scroll', () => {
            const threshold = 80;
            autoScroll = streamContainer.scrollHeight - streamContainer.scrollTop - streamContainer.clientHeight < threshold;
        });

        function cleanString(str) {
            return (str || '').replace(/[，。？！、\s\.,!\?]/g, '');
        }

        function createNewCard() {
            const card = document.createElement('div');
            card.className = 'caption-card';

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            card.innerHTML = `
                <div class="caption-card-header">
                    <div class="caption-meta-info">
                        <span class="caption-time">${timeStr}</span>
                        <span class="char-counter">0 字</span>
                    </div>
                    <button class="svg-btn" style="width:32px; height:32px;" title="查看每字粵拼與發音" onclick="openPhoneticModal(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </button>
                </div>
                <div class="cantonese-text"><span class="confirmed-content"></span><span class="interim-preview"></span></div>
                <div class="mandarin-box">
                    <span class="mandarin-tag">普通話</span>
                    <div class="mandarin-text">聆聽中...</div>
                </div>
            `;
            streamContainer.appendChild(card);

            currentCardObj = {
                cardEl: card,
                confirmedSpan: card.querySelector('.confirmed-content'),
                interimSpan: card.querySelector('.interim-preview'),
                mandarinEl: card.querySelector('.mandarin-text'),
                mandarinTagEl: card.querySelector('.mandarin-tag'),
                counterEl: card.querySelector('.char-counter'),
                rawConfirmedText: "",
                fullPunctuatedText: "",
                aiTimer: null
            };

            scrollToBottom();
            return currentCardObj;
        }

        // 毫秒級臨時渲染：邊說邊出字，完全不卡頓
        function handleInterimSpeech(interimRaw) {
            if (!interimRaw || !interimRaw.trim()) return;
            if (!currentCardObj) createNewCard();

            // 臨時字直接上屏（0 延遲，絕不跑重型運算）
            currentCardObj.interimSpan.innerText = interimRaw;

            // 同步快速預覽普通話（讓用戶看到即時反應）
            const combinedPreview = currentCardObj.fullPunctuatedText + interimRaw;
            currentCardObj.mandarinEl.innerText = translateFast(combinedPreview);
            scrollToBottom();
        }

        // 定稿上屏：停頓時觸發
        function handleFinalSpeech(finalRaw) {
            finalRaw = finalRaw.trim();
            if (!finalRaw) return;

            if (!currentCardObj) createNewCard();
            currentCardObj.interimSpan.innerText = "";

            // 僅在定稿時做輕量正字修正
            const corrected = optimizeFinalText(finalRaw);
            const cleanFinal = cleanString(corrected);
            const cleanConfirmed = cleanString(currentCardObj.rawConfirmedText);

            if (cleanConfirmed.endsWith(cleanFinal)) return;

            let deltaText = corrected;
            for (let i = corrected.length; i >= 1; i--) {
                const prefix = corrected.slice(0, i);
                if (cleanConfirmed.endsWith(cleanString(prefix))) {
                    deltaText = corrected.slice(i).trim();
                    break;
                }
            }
            if (!deltaText) return;

            if (cleanString(currentCardObj.rawConfirmedText).length > MAX_CHAR_PER_CARD) {
                createNewCard();
            }

            const formattedDelta = deltaText + "，";
            currentCardObj.rawConfirmedText += deltaText;
            currentCardObj.fullPunctuatedText += formattedDelta;

            currentCardObj.confirmedSpan.innerText = currentCardObj.fullPunctuatedText;
            currentCardObj.counterEl.innerText = `${cleanString(currentCardObj.rawConfirmedText).length} 字`;

            // 即時本機普通話
            currentCardObj.mandarinEl.innerText = translateFast(currentCardObj.fullPunctuatedText);

            // 觸發 Puter AI 防抖潤色
            if (window.puter && window.puter.auth && puter.auth.isSignedIn()) {
                if (currentCardObj.aiTimer) clearTimeout(currentCardObj.aiTimer);
                currentCardObj.aiTimer = setTimeout(() => {
                    requestPuterAIRefinement(currentCardObj);
                }, 400);
            }

            scrollToBottom();
        }

        function scrollToBottom() {
            if (autoScroll) {
                streamContainer.scrollTop = streamContainer.scrollHeight;
            }
        }

        /* ------------------ 6. Web Speech 語音識別核心（輕量流暢） ------------------ */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let userWantsListening = false;
        let isEngineRunning = false;
        let wakeLock = null;

        async function acquireWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-HK';
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isEngineRunning = true;
                statusDot.classList.add('active');
                statusText.innerText = "極速識別中（即講即出）...";
                toggleBtn.classList.add('active');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const trans = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        handleFinalSpeech(trans);
                    } else {
                        interim += trans;
                    }
                }
                if (interim) {
                    handleInterimSpeech(interim);
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    userWantsListening = false;
                    stopListeningUI();
                    alert("請允許麥克風權限以進行課堂識別。");
                }
            };

            recognition.onend = () => {
                isEngineRunning = false;
                if (userWantsListening) {
                    setTimeout(() => {
                        if (userWantsListening && !isEngineRunning) {
                            try { recognition.start(); } catch (e) {}
                        }
                    }, 50);
                } else {
                    stopListeningUI();
                }
            };
        }

        /* ------------------ 7. 啟動按鈕（單擊紅鍵一體化授權） ------------------ */
        async function toggleSpeech() {
            if (!recognition) {
                alert("當前瀏覽器不支援 Web Speech 語音辨識，請使用 Chrome、Edge 或 Safari。");
                return;
            }

            if (userWantsListening) {
                userWantsListening = false;
                releaseWakeLock();
                try { recognition.stop(); } catch(e) {}
                stopListeningUI();
            } else {
                userWantsListening = true;
                acquireWakeLock();
                try { recognition.start(); } catch(e) {}

                // 首次使用紅色按鈕時，靜默啟用 Puter AI
                if (window.puter && window.puter.auth && !puter.auth.isSignedIn()) {
                    puter.auth.signIn({ attempt_temp_user_creation: true })
                        .then(() => {
                            statusText.innerText = "極速識別中（Puter AI 已連線）";
                            if (currentCardObj && currentCardObj.fullPunctuatedText) {
                                requestPuterAIRefinement(currentCardObj);
                            }
                        })
                        .catch(() => {
                            statusText.innerText = "極速識別中（本地極速引擎）";
                        });
                }
            }
        }

        function stopListeningUI() {
            statusDot.classList.remove('active');
            statusText.innerText = "課堂識別已暫停";
            toggleBtn.classList.remove('active');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            if (currentCardObj && currentCardObj.interimSpan) {
                currentCardObj.interimSpan.innerText = "";
            }
        }

        /* ------------------ 8. 字體調節 ------------------ */
        const fontScales = [
            { name: "標準", canto: "1.45rem", mando: "1.05rem" },
            { name: "放大", canto: "1.75rem", mando: "1.25rem" },
            { name: "特大", canto: "2.10rem", mando: "1.45rem" }
        ];
        let currentScaleIdx = 0;
        let toastTimer = null;
        const fontToast = document.getElementById('fontToast');

        function cycleFontSize() {
            currentScaleIdx = (currentScaleIdx + 1) % fontScales.length;
            const cur = fontScales[currentScaleIdx];
            document.documentElement.style.setProperty('--cantonese-size', cur.canto);
            document.documentElement.style.setProperty('--mandarin-size', cur.mando);

            fontToast.innerText = `字體：${cur.name}`;
            fontToast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => fontToast.classList.remove('show'), 1200);
            scrollToBottom();
        }

        /* ------------------ 9. 粵拼彈窗與朗讀 TTS ------------------ */
        const modal = document.getElementById('phoneticModal');
        const modalContent = document.getElementById('modalContent');
        const ttsStatus = document.getElementById('ttsStatus');
        let currentSectionPureText = "";

        const CLASSICAL_SPECIAL_JYUTPING = {
            "屬": "zuk1", "湯": "soeng1", "具": "keoi1", "殂": "cou4", "長": "zoeng2",
            "藏": "zong6", "說": "seoi3", "裨": "bei1", "否": "fau2", "罷": "baa6",
            "賈": "gaa2", "數": "sou3", "石": "daan3", "龜": "gwan1", "鬻": "zuk1",
            "擁": "jung2", "遺": "wai6", "率": "seot1", "暴": "puk1", "當": "dong1",
            "輮": "jau4", "挺": "ting5", "知": "zi3", "生": "sing3", "惡": "wu1"
        };

        async function fetchJyutpingRubyHTML(text) {
            if (!text) return "";
            let htmlResult = "";
            if (window.ToJyutping && typeof window.ToJyutping.getJyutpingList === 'function') {
                try {
                    const list = window.ToJyutping.getJyutpingList(text);
                    for (const [char, rawJp] of list) {
                        if (char === '\n') {
                            htmlResult += '<div style="flex-basis: 100%; height: 8px;"></div>';
                            continue;
                        }
                        const jp = CLASSICAL_SPECIAL_JYUTPING[char] || rawJp;
                        if (jp) {
                            htmlResult += `<ruby class="jp-ruby"><span class="c-char">${char}</span><rt class="c-rt">${jp}</rt></ruby>`;
                        } else {
                            htmlResult += `<span class="jp-punct">${char}</span>`;
                        }
                    }
                    return htmlResult;
                } catch (err) {}
            }
            return text;
        }

        async function openPhoneticModal(btn) {
            const card = btn.closest('.caption-card');
            const cantoneseEl = card.querySelector('.confirmed-content');
            const fullText = (cantoneseEl.innerText || "").trim();
            currentSectionPureText = cleanString(fullText);

            if (!fullText) {
                modalContent.innerHTML = "<div style='color:#64748b; font-size:1rem; padding:10px;'>暫未有已確認錄入的文字。</div>";
                modal.classList.add('active');
                return;
            }

            modalContent.innerHTML = "<div style='color:#94a3b8; font-size:1rem; width:100%; text-align:center; padding:30px 0;'>正在標註每字標準粵拼...</div>";
            ttsStatus.innerText = "標音中...";
            modal.classList.add('active');

            const rubyHTML = await fetchJyutpingRubyHTML(fullText);
            modalContent.innerHTML = rubyHTML;
            ttsStatus.innerText = "就緒";
        }

        function closePhoneticModal() {
            modal.classList.remove('active');
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }

        function closeModalOnBackdrop(event) {
            if (event.target === modal) closePhoneticModal();
        }

        function speakCurrentText() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utter = new SpeechSynthesisUtterance(currentSectionPureText);
            utter.lang = 'zh-HK';
            utter.rate = 0.82;

            utter.onstart = () => ttsStatus.innerText = "朗讀中...";
            utter.onend = () => ttsStatus.innerText = "完畢";
            utter.onerror = () => ttsStatus.innerText = "就緒";

            window.speechSynthesis.speak(utter);
        }

        /* ------------------ 10. 測試示範 ------------------ */
        const demoSentences = [
            "其實我都唔好肯定㗎不過唔知，等陣你行先啦，訂製嗰面教練可能似冇乜經驗啦",
            "我覺得佢大的時候呢，個底稿寫得唔係幾好，畀本書我睇下先",
            "今天我們探討諸葛亮出師表，先帝創業未半而中道崩殂",
            "在六國論中蘇洵提出弊在賂秦，暴霜露斬荊棘，抱薪救火",
            "范仲淹在岳陽樓記描寫浩浩湯湯，政通人和百廢具興"
        ];
        let demoIdx = 0;

        function playDemoSentence() {
            const text = demoSentences[demoIdx % demoSentences.length];
            demoIdx++;
            handleFinalSpeech(text);

            if (window.puter && window.puter.auth && !puter.auth.isSignedIn()) {
                puter.auth.signIn({ attempt_temp_user_creation: true })
                    .then(() => {
                        if (currentCardObj) requestPuterAIRefinement(currentCardObj);
                    })
                    .catch(() => {});
            }
        }
    </script>
</body>
