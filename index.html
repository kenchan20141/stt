<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實時粵語課堂字幕機（Puter AI 旗艦版）</title>

    <!-- 香港教育標準字型：Noto Serif HK (明體) 與 Noto Sans HK (無襯線) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;600;700&family=Noto+Serif+HK:wght@500;600;700;900&display=swap" rel="stylesheet">

    <!-- 1. 權威粵拼 ESM 模組 -->
    <script type="module">
        import ToJyutping from 'https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm';
        window.ToJyutping = ToJyutping;
    </script>

    <!-- 2. 外部庫：OpenCC-js (香港標準繁體轉換與正字標準化) -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>

    <!-- 3. 外部庫：Fuse.js (中文專題/範文名詞音近語義模糊校正引擎) -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.basic.min.js"></script>

    <!-- 4. 外部庫：Diff-Match-Patch (ASR 語音識別流式重疊字消除與平滑拼接) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff-match-patch/20121119/diff_match_patch.js"></script>

    <!-- 5. 外部庫：Puter.js (深度粵普大模型轉譯) -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.09);
            --cantonese-color: #f8fafc;
            --mandarin-color: #38bdf8;
            --meta-color: #94a3b8;
            --accent-active: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --ruby-color: #fbbf24;

            --play-red: #e11d48;
            --play-red-glow: rgba(225, 29, 72, 0.45);

            --cantonese-size: 1.45rem;
            --mandarin-size: 1.05rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--cantonese-color);
            font-family: "Noto Serif HK", "Noto Serif TC", "Source Han Serif TC", "Songti TC", "Kaiti TC", serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(14px);
            z-index: 10;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #475569;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: var(--accent-active);
            box-shadow: 0 0 12px var(--accent-glow);
            animation: pulse 1.8s infinite;
        }

        .status-text {
            font-size: 0.88rem;
            color: var(--meta-color);
            font-weight: 500;
            font-family: "Noto Sans HK", sans-serif;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Puter AI 狀態膠囊按鈕 */
        .puter-auth-badge {
            font-size: 0.76rem;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #38bdf8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: "Noto Sans HK", sans-serif;
            font-weight: 500;
            transition: all 0.25s ease;
            outline: none;
        }

        .puter-auth-badge:hover {
            background: rgba(56, 189, 248, 0.22);
        }

        .puter-auth-badge.connected {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.45);
            color: #34d399;
        }

        .svg-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: #94a3b8;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .svg-btn:active { transform: scale(0.9); }
        .svg-btn:hover { color: #f8fafc; background: rgba(255, 255, 255, 0.12); }
        .svg-btn svg { width: 18px; height: 18px; stroke-width: 2; }

        .play-btn-red {
            background: var(--play-red);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            box-shadow: 0 0 14px var(--play-red-glow);
        }

        .play-btn-red:hover { background: #be123c; }
        .play-btn-red.active { background: #9f1239; animation: redPulse 1.8s infinite; }

        #subtitle-stream {
            flex: 1;
            overflow-y: auto;
            padding: 22px 20px 240px 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            scroll-behavior: smooth;
        }

        .caption-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.3s ease;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .caption-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .caption-meta-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: "Noto Sans HK", sans-serif;
        }

        .caption-time {
            font-size: 0.75rem;
            color: #64748b;
        }

        .char-counter {
            font-size: 0.72rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .cantonese-text {
            font-size: var(--cantonese-size);
            font-weight: 600;
            line-height: 1.85;
            letter-spacing: 0.8px;
            color: var(--cantonese-color);
            word-break: break-word;
            transition: font-size 0.2s ease;
        }

        .cantonese-text .interim-preview {
            color: #64748b;
            font-style: italic;
            margin-left: 6px;
        }

        .mandarin-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 6px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .mandarin-tag {
            font-size: 0.68rem;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--mandarin-color);
            font-weight: 700;
            margin-top: 4px;
            flex-shrink: 0;
            font-family: "Noto Sans HK", sans-serif;
            transition: all 0.3s ease;
        }

        .mandarin-tag.ai-active {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .mandarin-text {
            font-size: var(--mandarin-size);
            line-height: 1.7;
            color: #7dd3fc;
            word-break: break-word;
            font-weight: 400;
            transition: font-size 0.2s ease, color 0.3s ease;
        }

        #fontToast {
            position: fixed;
            top: 60px;
            right: 18px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 10px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.2s ease;
            z-index: 20;
            font-family: "Noto Sans HK", sans-serif;
        }

        #fontToast.show { opacity: 1; transform: translateY(0); }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-window {
            background: #12151d;
            border: 1px solid rgba(255, 255, 255, 0.16);
            width: 100%;
            max-width: 680px;
            max-height: 84vh;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-header {
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: "Noto Sans HK", sans-serif;
        }

        .modal-body {
            padding: 26px;
            overflow-y: auto;
            flex: 1;
            line-height: 2.6;
            background: #0d0f15;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 2px 2px;
        }

        ruby.jp-ruby {
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            vertical-align: bottom;
            margin: 2px 3px;
            line-height: 1;
        }

        ruby.jp-ruby rt.c-rt {
            display: block;
            font-size: 0.76rem;
            line-height: 1;
            font-family: "Noto Sans HK", sans-serif;
            color: var(--ruby-color);
            font-weight: 500;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
            user-select: none;
        }

        ruby.jp-ruby span.c-char {
            display: block;
            font-size: 1.55rem;
            font-weight: 600;
            line-height: 1.25;
            font-family: "Noto Serif HK", serif;
            color: #f8fafc;
        }

        span.jp-punct {
            display: inline-block;
            font-size: 1.55rem;
            line-height: 1.25;
            vertical-align: bottom;
            color: #64748b;
            margin: 0 3px 2px 3px;
            font-family: "Noto Serif HK", serif;
        }

        .modal-footer {
            padding: 14px 22px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            font-family: "Noto Sans HK", sans-serif;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }
        @keyframes redPulse { 0% { box-shadow: 0 0 10px rgba(225, 29, 72, 0.4); } 50% { box-shadow: 0 0 22px rgba(225, 29, 72, 0.85); } 100% { box-shadow: 0 0 10px rgba(225, 29, 72, 0.4); } }
        #subtitle-stream::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 5px; }
        #subtitle-stream::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <div class="status-container">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText" class="status-text">語音引擎準備就緒</span>
        </div>
        <div class="btn-group">
            <!-- Puter AI 授權與連線狀態按鈕 -->
            <button id="puterAuthBtn" class="puter-auth-badge" onclick="handlePuterAuthClick()" title="點擊授權 Puter AI">
                啟用
            </button>

            <button class="svg-btn" title="調節字體大小" onclick="cycleFontSize()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.5 17.5L6.5 9.5L9.5 17.5"></path>
                    <path d="M4.8 14.5H8.2"></path>
                    <path d="M12.5 17.5L16.5 6.5L20.5 17.5"></path>
                    <path d="M14 13.5H19"></path>
                </svg>
            </button>

            <button class="svg-btn" title="課堂範例示範" onclick="playDemoSentence()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
                </svg>
            </button>

            <button id="toggleBtn" class="svg-btn play-btn-red" title="開始/暫停識別" onclick="toggleSpeech()">
                <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"></path>
                </svg>
                <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="5" width="4" height="14" rx="1.5"></rect>
                    <rect x="14" y="5" width="4" height="14" rx="1.5"></rect>
                </svg>
            </button>
        </div>
    </header>

    <div id="fontToast">字體：標準</div>
    <main id="subtitle-stream"></main>

    <div id="phoneticModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-window">
            <div class="modal-header">
                <div class="modal-title-group">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                    </svg>
                    <span>粵語每字拼音與發音</span>
                </div>
                <button class="svg-btn" style="width:32px; height:32px;" onclick="closePhoneticModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="modalContent" class="modal-body"></div>
            <div class="modal-footer">
                <span id="ttsStatus" style="font-size: 0.82rem; color: #94a3b8;">就緒</span>
                <button id="ttsPlayBtn" class="svg-btn" style="background:#0284c7; color:#fff;" title="播放粵語發音" onclick="speakCurrentText()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="6 3 20 12 6 21 6 3"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ------------------ 1. Puter.js 授權守衛與狀態管理 ------------------ */
        // 更新頂部 Puter AI 按鈕狀態
        function updatePuterUIState() {
            const btn = document.getElementById('puterAuthBtn');
            if (!btn) return;
            if (window.puter && window.puter.auth && puter.auth.isSignedIn()) {
                btn.classList.add('connected');
                btn.innerHTML = `✓ Puter AI 已連線`;
                btn.title = "Puter AI 已就緒，享受零彈窗神經網絡深度潤色";
            } else {
                btn.classList.remove('connected');
                btn.innerHTML = `⚡ 啟用 Puter AI`;
                btn.title = "點擊進行一鍵免註冊授權，開啟深度翻譯";
            }
        }

        // 手動點擊一鍵授權 Puter（支援免註冊臨時訪客）
        async function handlePuterAuthClick() {
            if (!window.puter || !window.puter.auth) {
                alert("Puter.js 模組載入中，請稍候再試...");
                return;
            }
            if (puter.auth.isSignedIn()) {
                const user = await puter.auth.getUser();
                alert(`Puter AI 目前已處於授權狀態！用戶：${user.username || '匿名授權用戶'}`);
                return;
            }
            try {
                // attempt_temp_user_creation: true 自動為未註冊用戶建立匿名憑證，無痛連線
                await puter.auth.signIn({ attempt_temp_user_creation: true });
                updatePuterUIState();
            } catch (err) {
                console.warn("Puter 授權視窗已被用戶關閉或取消", err);
            }
        }

        // 頁面載入後自動檢測授權狀態
        window.addEventListener('load', () => {
            setTimeout(updatePuterUIState, 500);
        });

        /* ------------------ 2. 外部庫初始化 (OpenCC + DMP + Fuse.js) ------------------ */
        let hkConverter = null;
        try {
            if (window.OpenCC) {
                hkConverter = window.OpenCC.Converter({ from: 'cn', to: 'hk' });
            }
        } catch (e) {
            console.warn("OpenCC 載入警告", e);
        }

        const dmp = window.diff_match_patch ? new window.diff_match_patch() : null;

        const CLASSROOM_CORE_VOCAB = [
            "出師表", "六國論", "岳陽樓記", "醉翁亭記", "始得西山宴遊記", "前赤壁賦",
            "念奴嬌", "赤壁懷古", "聲聲慢", "青玉案", "逍遙遊", "庖丁解牛",
            "廉頗藺相如列傳", "師說", "勸學", "魚我所欲也", "鴻門會", "項莊舞劍",
            "中道崩殂", "陟罰臧否", "裨補闕漏", "猥自枉屈", "咨諏善道", "臨表涕零",
            "弊在賂秦", "抱薪救火", "檣傾楫摧", "浩浩湯湯", "岸芷汀蘭", "政通人和",
            "百廢具興", "傴僂提攜", "宴酣之樂", "觥籌交錯", "餘音嫋嫋", "正襟危坐",
            "舳艫千里", "橫槊賦詩", "寄蜉蝣於天地", "渺滄海之一粟", "木直中繩",
            "輮以為輪", "金石可鏤", "不龜手之藥", "舍生取義", "完璧歸趙", "澠池之會",
            "負荊請罪", "商鞅變法", "焚書坑儒", "分封制", "宗法制", "郡縣制",
            "推恩令", "罷黜百家", "獨尊儒術", "鹽鐵官營", "張騫通西域", "司馬遷",
            "光武中興", "黨錮之禍", "黃巾之亂", "九品中正制", "孝文帝漢化", "三省六部制",
            "房謀杜斷", "貞觀之治", "開元盛世", "安史之亂", "藩鎮割據", "黃巢之亂",
            "杯酒釋兵權", "強幹弱枝", "重文輕武", "澶淵之盟", "靖康之禍", "王安石變法",
            "四等人制", "朱元璋", "靖難之變", "土木之變", "鄭和下西洋", "張居正改革",
            "一條鞭法", "攤丁入畝", "虎門銷煙", "鴉片戰爭", "戊戌變法", "辛丑條約",
            "辛亥革命", "武昌起義"
        ];

        let vocabFuse = null;
        if (window.Fuse) {
            vocabFuse = new window.Fuse(CLASSROOM_CORE_VOCAB, {
                includeScore: true,
                threshold: 0.36,
                minMatchCharLength: 2
            });
        }

        /* ------------------ 3. 結合正則 + Fuse.js + OpenCC 文本校正 ------------------ */
        const CHINESE_SUBJECT_RULES = [
            [/出[屍尸]表/g, "出師表"],
            [/六國[亂爛]/g, "六國論"],
            [/[約越月]洋樓記/g, "岳陽樓記"],
            [/[最醉]擁亭記/g, "醉翁亭記"],
            [/始得西山[燕宴]遊記/g, "始得西山宴遊記"],
            [/前赤壁[副婦父]/g, "前赤壁賦"],
            [/念[老佬]嬌/g, "念奴嬌"],
            [/星[星猩]慢/g, "聲聲慢"],
            [/青[肉落]案/g, "青玉案"],
            [/消[遙遙]遊/g, "逍遙遊"],
            [/[拋包][釘丁]解牛/g, "庖丁解牛"],

        function optimizeChineseSubjectText(text) {
            if (!text) return "";
            let res = text;

            if (hkConverter) {
                try { res = hkConverter(res); } catch (e) {}
            }

            for (const [regex, rep] of CHINESE_SUBJECT_RULES) {
                res = res.replace(regex, rep);
            }

            if (vocabFuse && res.length >= 3) {
                for (let len = 4; len >= 3; len--) {
                    for (let i = 0; i <= res.length - len; i++) {
                        const slice = res.slice(i, i + len);
                        if (/[，。？！、\s]/.test(slice)) continue;
                        const match = vocabFuse.search(slice);
                        if (match.length > 0 && match[0].score < 0.25) {
                            const correctedWord = match[0].item;
                            if (correctedWord.length === len && slice !== correctedWord) {
                                res = res.slice(0, i) + correctedWord + res.slice(i + len);
                            }
                        }
                    }
                }
            }
            return res;
        }

        async function fetchJyutpingRubyHTML(text) {
            if (!text) return "";
            if (!window.ToJyutping) {

            }

            let htmlResult = "";
            if (window.ToJyutping && typeof window.ToJyutping.getJyutpingList === 'function') {
                try {
                    const list = window.ToJyutping.getJyutpingList(text);
                    for (const [char, rawJp] of list) {
                        if (char === '\n') {
                            htmlResult += '<div style="flex-basis: 100%; height: 8px;"></div>';
                            continue;
                        }
                        const jp = CLASSICAL_SPECIAL_JYUTPING[char] || rawJp;
                        if (jp) {
                            htmlResult += `<ruby class="jp-ruby"><span class="c-char">${char}</span><rt class="c-rt">${jp}</rt></ruby>`;
                        } else {
                            htmlResult += `<span class="jp-punct">${char}</span>`;
                        }
                    }
                    return htmlResult;
                } catch (err) {}
            }

            for (const char of text) {
                if (/[\u4e00-\u9fa5]/.test(char)) {
                    const jp = CLASSICAL_SPECIAL_JYUTPING[char] || "zi6";
                    htmlResult += `<ruby class="jp-ruby"><span class="c-char">${char}</span><rt class="c-rt">${jp}</rt></ruby>`;
                } else {

        /* ------------------ 5. 第一軌：本地快速語法轉譯（0 延遲） ------------------ */

        /* ------------------ 6. 第二軌：Puter.js 神經網絡 AI 精修（嚴密授權守衛） ------------------ */
        async function requestPuterAIRefinement(cardObj) {
            const textToTranslate = cardObj.fullPunctuatedText;
            if (!textToTranslate || !textToTranslate.trim()) return;

            // 【關鍵守衛】：只有在明確授權（isSignedIn）後才調用，未登入絕不觸發，杜絕彈窗轟炸！
            if (!window.puter || !window.puter.auth || !puter.auth.isSignedIn() || !window.puter.ai) {
                return;
            }

            try {
                const prompt = `你是精通粵普對譯與中文課堂教育的專家。請將以下粵語口語轉換為標準、典雅、流暢的現代漢語普通話書面語：
1. 嚴格修正粵語語法倒裝（如「行先」->「先走」、「畀本筆我」->「給我一支筆」）。
2. 保留課堂文言文專有名詞、詩詞與人名原文。
3. 嚴禁任何解釋或標註，直接輸出純文本翻譯結果。

粵語：${textToTranslate}`;

                const response = await puter.ai.chat(prompt, { model: 'gpt-4o-mini' });
                let aiText = "";
                if (typeof response === 'string') {
                    aiText = response.trim();
                } else if (response && response.message && response.message.content) {
                    aiText = response.message.content.trim();
                }

                aiText = aiText.replace(/^["'「『](.*)["'」』]$/s, '$1').trim();

                if (aiText && cardObj.fullPunctuatedText === textToTranslate) {
                    cardObj.mandarinEl.innerText = aiText;
                    if (cardObj.mandarinTagEl) {
                        cardObj.mandarinTagEl.innerText = "普通話・Puter AI 精修";
                        cardObj.mandarinTagEl.classList.add('ai-active');
                    }
                }
            } catch (err) {
                console.warn("Puter AI 呼叫降級，維持本地翻譯", err);
            }
        }

        // 雙軌分流控制器
        function updateDualTrackTranslation(cardObj) {
            const targetText = cardObj.fullPunctuatedText;
            if (!targetText) return;

            // [第一軌] 本地 0 延遲先行渲染
            const fastTranslated = translateCantoneseToMandarinFast(targetText);
            cardObj.mandarinEl.innerText = fastTranslated;
            if (cardObj.mandarinTagEl) {
                cardObj.mandarinTagEl.innerText = "普通話";
                cardObj.mandarinTagEl.classList.remove('ai-active');
            }

            // [第二軌] 若 Puter AI 已授權，透過防抖在停頓時進行大模型精修
            if (window.puter && window.puter.auth && puter.auth.isSignedIn()) {
                if (cardObj.aiTimer) clearTimeout(cardObj.aiTimer);
                cardObj.aiTimer = setTimeout(() => {
                    requestPuterAIRefinement(cardObj);
                }, 600);
            }
        }

        /* ------------------ 7. 字幕串流管理器 ------------------ */
        const streamContainer = document.getElementById('subtitle-stream');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const toggleBtn = document.getElementById('toggleBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        let autoScroll = true;
        let currentCardObj = null;
        const MAX_CHAR_PER_CARD = 200;

        streamContainer.addEventListener('scroll', () => {
            const threshold = 80;
            const atBottom = streamContainer.scrollHeight - streamContainer.scrollTop - streamContainer.clientHeight < threshold;
            autoScroll = atBottom;
        });

        function cleanString(str) {
            return (str || '').replace(/[，。？！、\s\.,!\?]/g, '');
        }

        function countPureChars(str) {
            return cleanString(str).length;
        }

        function formatSentence(text) {
            text = text.trim();
            if (!text) return "";
            if (/(咩|嗎|點解|邊度|邊個|幾時|點樣|係咪|係唔係|何哉|歟)$/.test(text)) return text + "？";
            if (/(呀|啦|喎|哇|㗎|乎|矣|哉)$/.test(text)) return text + "！";
            return text + "，";
        }

        function createNewCard() {
            const card = document.createElement('div');
            card.className = 'caption-card';

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            card.innerHTML = `
                <div class="caption-card-header">
                    <div class="caption-meta-info">
                        <span class="caption-time">${timeStr}</span>
                        <span class="char-counter">0 / ${MAX_CHAR_PER_CARD} 字</span>
                    </div>
                    <button class="svg-btn" style="width:32px; height:32px;" title="查看每字粵拼與發音" onclick="openPhoneticModal(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </button>
                </div>
                <div class="cantonese-text"><span class="confirmed-content"></span><span class="interim-preview"></span></div>
                <div class="mandarin-box">
                    <span class="mandarin-tag">普通話</span>
                    <div class="mandarin-text">等待翻譯...</div>
                </div>
            `;
            streamContainer.appendChild(card);

            currentCardObj = {
                cardEl: card,
                confirmedSpan: card.querySelector('.confirmed-content'),
                interimSpan: card.querySelector('.interim-preview'),
                mandarinEl: card.querySelector('.mandarin-text'),
                mandarinTagEl: card.querySelector('.mandarin-tag'),
                counterEl: card.querySelector('.char-counter'),
                rawConfirmedText: "",
                fullPunctuatedText: "",
                aiTimer: null
            };

            scrollToBottom();
            return currentCardObj;
        }

        function computeSmartSpeechDelta(existingText, incomingText) {
            const cleanExist = cleanString(existingText);
            const cleanIncoming = cleanString(incomingText);

            if (!cleanExist) return incomingText;
            if (cleanExist.endsWith(cleanIncoming) || cleanExist === cleanIncoming) {
                return "";
            }

            if (dmp) {
                const diffs = dmp.diff_main(cleanExist, cleanIncoming);
                dmp.diff_cleanupSemantic(diffs);
                let delta = "";
                for (let i = 0; i < diffs.length; i++) {
                    const [op, data] = diffs[i];
                    if (op === 1) { delta += data; }
                }
                if (delta) return delta;
            }

            for (let i = incomingText.length; i >= 1; i--) {
                const prefix = incomingText.slice(0, i);
                if (cleanExist.endsWith(cleanString(prefix))) {
                    return incomingText.slice(i).trim();
                }
            }
            return incomingText;
        }

        function appendSpeechText(incomingRaw) {
            incomingRaw = incomingRaw.trim();
            if (!incomingRaw) return;

            const corrected = optimizeChineseSubjectText(incomingRaw);

            if (currentCardObj && currentCardObj.interimSpan) {
                currentCardObj.interimSpan.innerText = "";
            }

            if (!currentCardObj) {
                createNewCard();
            }

            const deltaText = computeSmartSpeechDelta(currentCardObj.rawConfirmedText, corrected);
            if (!deltaText) return;

            const currentCount = countPureChars(currentCardObj.rawConfirmedText);
            const deltaCount = countPureChars(deltaText);

            if (currentCount + deltaCount > MAX_CHAR_PER_CARD) {
                if (currentCardObj.fullPunctuatedText && !/[。？！]$/.test(currentCardObj.fullPunctuatedText)) {
                    currentCardObj.fullPunctuatedText = currentCardObj.fullPunctuatedText.replace(/，$/, '。');
                    currentCardObj.confirmedSpan.innerText = currentCardObj.fullPunctuatedText;
                }
                createNewCard();
            }

            const formattedDelta = formatSentence(deltaText);
            currentCardObj.rawConfirmedText += deltaText;
            currentCardObj.fullPunctuatedText += formattedDelta;

            currentCardObj.confirmedSpan.innerText = currentCardObj.fullPunctuatedText;
            currentCardObj.counterEl.innerText = `${countPureChars(currentCardObj.rawConfirmedText)} / ${MAX_CHAR_PER_CARD} 字`;

            updateDualTrackTranslation(currentCardObj);
            scrollToBottom();
        }

        function updateInterimPreview(interimText) {
            if (!interimText.trim()) return;
            if (!currentCardObj) {
                createNewCard();
            }
            const optimized = optimizeChineseSubjectText(interimText);
            currentCardObj.interimSpan.innerText = " " + optimized;
            scrollToBottom();
        }

        /* ------------------ 8. 語音辨識核心與保活機制 ------------------ */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let userWantsListening = false;
        let isEngineRunning = false;
        let isRestarting = false;
        let wakeLock = null;

        let warmAudioCtx = null;
        let warmOscillator = null;

        function startHardwareWarmKeepAlive() {
            try {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtxClass) return;
                if (!warmAudioCtx || warmAudioCtx.state === 'closed') {
                    warmAudioCtx = new AudioCtxClass();
                }
                if (warmAudioCtx.state === 'suspended') {
                    warmAudioCtx.resume();
                }
                if (!warmOscillator) {
                    warmOscillator = warmAudioCtx.createOscillator();
                    const silentGain = warmAudioCtx.createGain();
                    silentGain.gain.value = 0.00001;
                    warmOscillator.connect(silentGain);
                    silentGain.connect(warmAudioCtx.destination);
                    warmOscillator.start();
                }
            } catch (e) {}
        }

        function stopHardwareWarmKeepAlive() {
            if (warmOscillator) {
                try { warmOscillator.stop(); warmOscillator.disconnect(); } catch (e) {}
                warmOscillator = null;
            }
            if (warmAudioCtx && warmAudioCtx.state !== 'closed') {
                try { warmAudioCtx.close(); } catch (e) {}
                warmAudioCtx = null;
            }
        }

        async function acquireWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        function triggerImmediateRestart() {
            if (!userWantsListening || isEngineRunning || isRestarting) return;
            isRestarting = true;
            try {
                recognition.start();
                isRestarting = false;
            } catch (err) {
                setTimeout(() => {
                    isRestarting = false;
                    if (userWantsListening && !isEngineRunning) {
                        try { recognition.start(); } catch (e) {}
                    }
                }, 40);
            }
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-HK';

            recognition.onstart = () => {
                isEngineRunning = true;
                isRestarting = false;
                statusDot.classList.add('active');
                statusText.innerText = "課堂持續聆聽中...";
                toggleBtn.classList.add('active');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const trans = event.results[i][0].transcript.trim();
                    if (event.results[i].isFinal) {
                        finalTranscript += trans;
                    } else {
                        interimTranscript += trans;
                    }
                }

                if (finalTranscript) {
                    appendSpeechText(finalTranscript);
                } else if (interimTranscript) {
                    updateInterimPreview(interimTranscript);
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    userWantsListening = false;
                    stopHardwareWarmKeepAlive();
                    stopListeningUI();
                    alert("請允許麥克風權限以持續識別。");
                }
            };

            recognition.onend = () => {
                isEngineRunning = false;
                if (userWantsListening) {
                    triggerImmediateRestart();
                } else {
                    stopListeningUI();
                }
            };

            setInterval(() => {
                if (userWantsListening && !isEngineRunning) {
                    triggerImmediateRestart();
                }
            }, 400);
        }

        function toggleSpeech() {
            if (!recognition) {
                alert("當前瀏覽器不支援 Web Speech 語音辨識，請使用 Chrome、Edge 或 Safari。");
                return;
            }

            if (userWantsListening) {
                userWantsListening = false;
                releaseWakeLock();
                stopHardwareWarmKeepAlive();
                try { recognition.stop(); } catch(e) {}
                stopListeningUI();
            } else {
                userWantsListening = true;
                acquireWakeLock();
                startHardwareWarmKeepAlive();
                triggerImmediateRestart();

                // 首次啟動時，若尚未授權 Puter，在用戶手勢中嘗試免密授權
                if (window.puter && window.puter.auth && !puter.auth.isSignedIn()) {
                    puter.auth.signIn({ attempt_temp_user_creation: true })
                        .then(() => updatePuterUIState())
                        .catch(() => console.log("未完成 Puter 授權，將先行使用本地高速引擎"));
                }
            }
        }

        function stopListeningUI() {
            statusDot.classList.remove('active');
            statusText.innerText = "課堂識別已暫停";
            toggleBtn.classList.remove('active');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            if (currentCardObj && currentCardObj.interimSpan) {
                currentCardObj.interimSpan.innerText = "";
            }
        }

        function scrollToBottom() {
            if (autoScroll) {
                streamContainer.scrollTop = streamContainer.scrollHeight;
            }
        }

        /* ------------------ 9. 字體大小調節 ------------------ */
        const fontScales = [
            { name: "標準", canto: "1.45rem", mando: "1.05rem" },
            { name: "放大", canto: "1.75rem", mando: "1.25rem" },
            { name: "特大", canto: "2.10rem", mando: "1.45rem" }
        ];
        let currentScaleIdx = 0;
        let toastTimer = null;
        const fontToast = document.getElementById('fontToast');

        function cycleFontSize() {
            currentScaleIdx = (currentScaleIdx + 1) % fontScales.length;
            const cur = fontScales[currentScaleIdx];
            document.documentElement.style.setProperty('--cantonese-size', cur.canto);
            document.documentElement.style.setProperty('--mandarin-size', cur.mando);

            fontToast.innerText = `字體：${cur.name}`;
            fontToast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => fontToast.classList.remove('show'), 1200);
            scrollToBottom();
        }

        /* ------------------ 10. 粵拼彈窗與朗讀 TTS ------------------ */
        const modal = document.getElementById('phoneticModal');
        const modalContent = document.getElementById('modalContent');
        const ttsStatus = document.getElementById('ttsStatus');
        let currentSectionPureText = "";

        async function openPhoneticModal(btn) {
            const card = btn.closest('.caption-card');
            const cantoneseEl = card.querySelector('.confirmed-content');
            const fullText = (cantoneseEl.innerText || "").trim();
            currentSectionPureText = fullText.replace(/[，。？！、\s\.,!\?]/g, "");

            if (!fullText) {
                modalContent.innerHTML = "<div style='color:#64748b; font-size:1rem; padding:10px;'>暫未有已確認錄入的文字。</div>";
                modal.classList.add('active');
                return;
            }

            modalContent.innerHTML = "<div style='color:#94a3b8; font-size:1rem; width:100%; text-align:center; padding:30px 0;'>正在標註每字標準粵拼...</div>";
            ttsStatus.innerText = "標音中...";
            modal.classList.add('active');

            const rubyHTML = await fetchJyutpingRubyHTML(fullText);
            modalContent.innerHTML = rubyHTML;
            ttsStatus.innerText = "就緒";
        }

        function closePhoneticModal() {
            modal.classList.remove('active');
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }

        function closeModalOnBackdrop(event) {
            if (event.target === modal) closePhoneticModal();
        }

        function speakCurrentText() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utter = new SpeechSynthesisUtterance(currentSectionPureText);
            utter.lang = 'zh-HK';
            utter.rate = 0.82;

            utter.onstart = () => ttsStatus.innerText = "朗讀中...";
            utter.onend = () => ttsStatus.innerText = "完畢";
            utter.onerror = () => ttsStatus.innerText = "就緒";

            window.speechSynthesis.speak(utter);
        }

        /* ------------------ 11. 示範句播放 ------------------ */
        const demoSentences = [
            "其實我都唔好肯定㗎不過唔知，等陣你行先啦，訂製嗰面教練可能似冇乜經驗啦",
            "我覺得佢大的時候呢，個底稿寫得唔係幾好，畀本書我睇下先",
            "今天我們探討諸葛亮出師表，先帝創業未半而中道崩殂",
            "在六國論中蘇洵提出弊在賂秦，暴霜露斬荊棘，抱薪救火",
            "范仲淹在岳陽樓記描寫浩浩湯湯，政通人和百廢具興"
        ];
        let demoIdx = 0;

        function playDemoSentence() {
            const text = demoSentences[demoIdx % demoSentences.length];
            demoIdx++;
            appendSpeechText(text);
        }
    </script>
</body>
</html>
