<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>實時粵語提詞器</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@600;700&display=swap" rel="stylesheet">

    <!-- Three.js 3D 核心庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- 權威粵拼模組 -->
    <script type="module">
        import ToJyutping from 'https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm';
        window.ToJyutping = ToJyutping;
    </script>

    <!-- 繁體字強制校準庫 -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>

    <!-- 雲端穿透傳輸庫 (MQTT over WSS) -->
    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <!-- QRCode 生成庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg: #05070a;
            --canto-bg: #090a0f;
            --card-border: rgba(255, 255, 255, 0.08);
            --ruby: #f59e0b;
            --accent: #38bdf8;
            --cantonese-size: 2.15rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #threeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .teleprompter-rig {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            height: 100vh;
            height: 100dvh;
            max-height: 960px;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 28px 24px;
            box-sizing: border-box;
            pointer-events: auto;
        }

        .rig-screen-enclosure {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #090a0f;
            border-radius: 14px;
            border: 2px solid #1e2638;
            box-shadow: 
                0 0 0 1px rgba(0, 0, 0, 0.8),
                0 20px 45px rgba(0, 0, 0, 0.9),
                inset 0 0 20px rgba(0, 0, 0, 0.85);
            overflow: hidden;
            position: relative;
            min-height: 0;
        }

        /* 頂部導航列排版佈局 */
        header {
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            background: #090a0f;
            z-index: 30;
            flex-shrink: 0;
            gap: 10px;
            min-height: 58px;
        }

        .brand-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            min-width: 0;
        }

        .brand-logo-icon {
            display: none;
            color: #38bdf8;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.8px;
            font-family: "Noto Sans HK", sans-serif;
            white-space: nowrap;
        }

        /* 狀態指示燈 */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #334155;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .status-dot.broadcast {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: pulseDot 1.8s infinite;
        }

        .status-dot.receive {
            background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulseDot 1.8s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: nowrap; /* 嚴禁折行，避免垂直重疊 */
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: #cbd5e1;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            position: relative;
            flex-shrink: 0;
        }

        .icon-btn:hover { background: rgba(255, 255, 255, 0.12); color: #ffffff; }
        .icon-btn:active { transform: scale(0.94); }
        .icon-btn svg { width: 18px; height: 18px; stroke-width: 2; }

        .icon-btn.mode-active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.45);
            color: #38bdf8;
        }

        .power-btn {
            background: #ef4444;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
            flex-shrink: 0;
        }

        .power-btn.active {
            background: #10b981;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.45);
        }

        /* 📱 手機端響應式排版優化 (解決擠壓與歪斜) */
        @media (max-width: 640px) {
            .teleprompter-rig {
                max-width: 100%;
                height: 100dvh;
                padding: 6px 6px 12px 6px;
            }

            .rig-screen-enclosure {
                border-radius: 10px;
                border-width: 1.5px;
            }

            header {
                padding: 8px 10px;
                min-height: 48px;
                gap: 6px;
            }

            /* 手機上隱藏文字標題，改顯示精緻圖標，釋放空間 */
            .brand-title {
                display: none;
            }

            .brand-logo-icon {
                display: flex;
            }

            .btn-group {
                gap: 5px;
            }

            .icon-btn {
                width: 33px;
                height: 33px;
                border-radius: 7px;
            }

            .icon-btn svg {
                width: 16px;
                height: 16px;
            }

            .power-btn {
                width: 36px;
                height: 36px;
            }

            /* 手機瀏覽器不支援 Document PiP，隱藏按鈕避免無效佔位 */
            #btnPip {
                display: none !important;
            }

            .scroll-body {
                padding: 16px 16px 40px 16px !important;
            }
        }

        .viewport-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            min-height: 0; 
            background-color: var(--canto-bg);
            position: relative;
        }

        .viewport-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 36px;
            background: linear-gradient(to bottom, #090a0f 25%, transparent);
            z-index: 10;
            pointer-events: none;
        }

        .scroll-body {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding: 24px 28px 48px 28px;
            position: relative;
            z-index: 1;
        }

        .cantonese-stream {
            font-family: "Noto Serif HK", serif;
            font-size: var(--cantonese-size);
            line-height: 1.85;
            letter-spacing: 0.8px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            word-break: break-word;
        }

        .phrase-group {
            display: block;
            position: relative;
            line-height: 1.85;
            word-break: break-word;
            transition: color 0.4s ease, opacity 0.4s ease;
        }

        .phrase-group.past {
            color: #475569;
            font-weight: 500;
            opacity: 0.42;
        }

        /* 最新句組：純白高光聚焦 */
        .phrase-group.active-latest {
            color: #ffffff;
            font-weight: 700;
            opacity: 1;
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.28);
            animation: phrasePop 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .phrase-item.interim {
            color: #f8fafc;
            font-weight: 700;
            opacity: 0.9;
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.28);
            display: inline;
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
        }

        .phrase-item.interim:empty {
            display: none;
        }

        @keyframes phrasePop {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .bottom-safe-spacer {
            height: calc(140px + env(safe-area-inset-bottom, 24px));
            width: 100%;
            pointer-events: none;
            flex-shrink: 0;
        }

        #fontToast {
            position: fixed;
            top: 62px;
            right: 24px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.25s ease;
            z-index: 40;
            font-family: "Noto Sans HK", sans-serif;
        }

        #fontToast.show { opacity: 1; transform: translateY(0); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active { display: flex; }

        .modal-window {
            background: #0d1117;
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 680px;
            max-height: 85vh;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            font-family: "Noto Sans HK", sans-serif;
            font-size: 0.95rem;
            color: #f1f5f9;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            line-height: 2.6;
            background: #080a0e;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        ruby.jp-ruby {
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            margin: 2px 4px;
            line-height: 1;
        }

        ruby.jp-ruby rt.c-rt {
            display: block;
            font-size: 0.82rem;
            line-height: 1;
            font-family: "Noto Sans HK", sans-serif;
            color: var(--ruby);
            margin-bottom: 6px;
        }

        ruby.jp-ruby span.c-char {
            display: block;
            font-size: 1.65rem;
            font-weight: 600;
            color: #f8fafc;
        }

        span.jp-punct {
            font-size: 1.65rem;
            line-height: 1.2;
            color: #64748b;
            margin: 0 3px;
        }

        .modal-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #qrContainer {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        #roomLinkText {
            font-family: monospace;
            font-size: 0.76rem;
            color: #94a3b8;
            word-break: break-all;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            text-align: center;
        }

        /* 純數字房間碼與金鑰卡片 */
        .pin-display-box {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .pin-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 8px 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .pin-label {
            font-size: 0.72rem;
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .pin-val {
            font-family: monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 1.8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            text-align: left;
        }

        .input-label {
            font-size: 0.82rem;
            color: #94a3b8;
            font-family: "Noto Sans HK", sans-serif;
        }

        .app-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .app-input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

     .join-icon-action-btn {
    width: 52px;
    height: 52px;
    margin: 6px auto 0 auto;
    border-radius: 14px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.8), rgba(8, 12, 20, 0.95));
    color: #38bdf8;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 
        0 4px 16px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    position: relative;
    overflow: hidden;
}

/* 懸停狀態：柔和的天藍色霓虹微光與向右輕微微動 */
.join-icon-action-btn:hover {
    border-color: rgba(56, 189, 248, 0.7);
    color: #ffffff;
    background: linear-gradient(145deg, rgba(2, 132, 199, 0.25), rgba(15, 23, 42, 0.9));
    box-shadow: 
        0 0 22px rgba(56, 189, 248, 0.35),
        inset 0 0 12px rgba(56, 189, 248, 0.15);
    transform: translateY(-2px);
}

.join-icon-action-btn:active {
    transform: translateY(1px) scale(0.94);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
}

/* SVG 圖示細節與推進動畫 */
.join-icon-action-btn svg {
    width: 22px;
    height: 22px;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.join-icon-action-btn:hover svg {
    transform: translateX(2px);
}

.join-icon-action-btn .node-ring {
    stroke-opacity: 0.6;
    transition: stroke-opacity 0.25s ease;
}

.join-icon-action-btn:hover .node-ring {
    stroke-opacity: 1;
}
    </style>
</head>
<body>

    <canvas id="threeCanvas"></canvas>

    <main id="teleprompterRig" class="teleprompter-rig">
        <div class="rig-screen-enclosure">
            <header>
                <div class="brand-meta">
                    <!-- 手機小螢幕專用精巧圖標 -->
                    <svg class="brand-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                    </svg>
                    <span class="brand-title">實時粵語提詞</span>
                    <span id="statusDot" class="status-dot"></span>
                </div>
                
                <div class="btn-group">
                    <!-- 個人模式 -->
                    <button id="btnSolo" class="icon-btn mode-active" title="個人版" onclick="switchToSoloMode()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>
                    <!-- 廣播版 (主持發布) -->
                    <button id="btnBroadcast" class="icon-btn" title="廣播版" onclick="switchToBroadcastMode()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"></path>
                            <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"></path>
                            <circle cx="12" cy="12" r="2"></circle>
                            <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"></path>
                            <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"></path>
                        </svg>
                    </button>
                    <!-- 加入觀看 (無相機電腦/學生端) -->
                    <button id="btnJoinModal" class="icon-btn" title="輸入數字代碼加入" onclick="openJoinModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                    </button>
                    <!-- 粵拼注音與朗讀 -->
                    <button class="icon-btn" title="粵拼注音" onclick="openPhoneticModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </button>
                    <!-- 字體大小 -->
                    <button class="icon-btn" title="字體大小" onclick="cycleFontSize()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3.5 17.5L6.5 9.5L9.5 17.5"></path>
                            <path d="M4.8 14.5H8.2"></path>
                            <path d="M12.5 17.5L16.5 6.5L20.5 17.5"></path>
                            <path d="M14 13.5H19"></path>
                        </svg>
                    </button>
                    <!-- 螢幕底置頂懸浮字幕條 (電腦專用，手機自動隱藏) -->
                    <button id="btnPip" class="icon-btn" title="螢幕底置頂字幕" onclick="togglePipPrompter()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="13" rx="2"></rect>
                            <path d="M2 17h20"></path>
                            <line x1="7" y1="20" x2="17" y2="20"></line>
                        </svg>
                    </button>
                    <!-- 麥克風開關 -->
                    <button id="toggleBtn" class="icon-btn power-btn" title="開關" onclick="toggleSpeech()">
                        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"></path>
                        </svg>
                        <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="5" width="4" height="14" rx="1.5"></rect>
                            <rect x="14" y="5" width="4" height="14" rx="1.5"></rect>
                        </svg>
                    </button>
                </div>
            </header>

            <div id="fontToast">字體 標準</div>

            <div class="viewport-container">
                <div id="cantoScroll" class="scroll-body">
                    <div id="cantoStream" class="cantonese-stream">
                        <div id="interimPart" class="phrase-item interim"></div>
                    </div>
                    <div class="bottom-safe-spacer"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 廣播分享視窗 (純數字房間號 + 保留原 QR 碼) -->
    <div id="qrModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-window" style="max-width: 360px; text-align: center;">
            <div class="modal-header">
                <span style="font-weight: 600;">廣播邀請與配對</span>
                <button class="icon-btn" style="width:28px; height:28px;" onclick="closeQrModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" style="display:flex; flex-direction:column; align-items:center; gap:14px; padding: 20px;">
                <div id="qrContainer"></div>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- 粵拼注音彈窗 -->
    <div id="phoneticModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-window">
            <div class="modal-header">
                <span>粵拼注音與朗讀</span>
                <button class="icon-btn" style="width:28px; height:28px;" onclick="closePhoneticModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

            <div class="modal-footer">
                <span id="ttsStatus" style="font-size: 0.82rem; color: #94a3b8;">就緒</span>
                <button id="ttsPlayBtn" class="icon-btn" style="background:#0284c7; color:#fff;" onclick="speakCurrentText()">
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>

    <script>
        /* ------------------ 0. 端到端加密引擎 (AES-256-GCM) ------------------ */
        let cryptoKey = null;

        async function initEncryptionKey(keyString) {
            const enc = new TextEncoder();
            const keyHash = await crypto.subtle.digest('SHA-256', enc.encode(keyString));
            cryptoKey = await crypto.subtle.importKey(
                'raw',
                keyHash,
                { name: 'AES-GCM' },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptPayload(plainObj) {
            if (!cryptoKey) return JSON.stringify(plainObj);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const enc = new TextEncoder();
            const cipherBuffer = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv },
                cryptoKey,
                enc.encode(JSON.stringify(plainObj))
            );
            return JSON.stringify({
                iv: Array.from(iv).map(b => b.toString(16).padStart(2, '0')).join(''),
                cipher: btoa(String.fromCharCode(...new Uint8Array(cipherBuffer)))
            });
        }

        async function decryptPayload(rawMsgString) {
            try {
                const packet = JSON.parse(rawMsgString);
                if (!cryptoKey || !packet.iv || !packet.cipher) return packet;
                const iv = new Uint8Array(packet.iv.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                const cipherBytes = Uint8Array.from(atob(packet.cipher), c => c.charCodeAt(0));
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv },
                    cryptoKey,
                    cipherBytes
                );
                return JSON.parse(new TextDecoder().decode(decryptedBuffer));
            } catch (err) {
                return null;
            }
        }

        /* ------------------ 1. 運行模式設定 (個人 / 廣播 / 接收) ------------------ */
        const urlParams = new URLSearchParams(window.location.search);
        const joinRoom = urlParams.get('room') ? urlParams.get('room').replace(/\D/g, '') : null;
        const joinKey = window.location.hash.replace('#', '');
        const isReceiverMode = Boolean(joinRoom && joinKey);

        let currentMode = isReceiverMode ? 'receive' : 'solo';
        // 純數字 6 位房間號
        let currentRoomId = joinRoom || '';
        let currentSecretKey = joinKey || '';

        const statusDot = document.getElementById('statusDot');
        const btnSolo = document.getElementById('btnSolo');
        const btnBroadcast = document.getElementById('btnBroadcast');
        const btnJoinModal = document.getElementById('btnJoinModal');
        const toggleBtn = document.getElementById('toggleBtn');

        let mqttClient = null;

        function updateUIState() {
            btnSolo.classList.remove('mode-active');
            btnBroadcast.classList.remove('mode-active');
            btnJoinModal.classList.remove('mode-active');
            statusDot.className = 'status-dot';

            if (currentMode === 'solo') {
                btnSolo.classList.add('mode-active');
                toggleBtn.style.display = 'flex';
            } else if (currentMode === 'broadcast') {
                btnBroadcast.classList.add('mode-active');
                statusDot.classList.add('broadcast');
                toggleBtn.style.display = 'flex';
            } else if (currentMode === 'receive') {
                btnJoinModal.classList.add('mode-active');
                toggleBtn.style.display = 'none'; // 接收端純觀看
                statusDot.classList.add('receive');
            }
        }

        /* ------------------ 2. 靜態 3D 背景 ------------------ */
        const canvas = document.getElementById('threeCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 24);

        const machineGroup = new THREE.Group();
        scene.add(machineGroup);

        const hoodMat = new THREE.MeshStandardMaterial({ color: 0x141822, metalness: 0.8, roughness: 0.3 });
        const bezelMat = new THREE.MeshStandardMaterial({ color: 0x222a38, metalness: 0.85, roughness: 0.25 });

        const chassis = new THREE.Mesh(new THREE.BoxGeometry(19.5, 23.5, 2.0), hoodMat);
        chassis.position.z = -1.2;
        machineGroup.add(chassis);

        const topHood = new THREE.Mesh(new THREE.BoxGeometry(19.6, 0.35, 3.2), bezelMat);
        topHood.position.set(0, 11.8, 0.4);
        topHood.rotation.x = 0.15;
        machineGroup.add(topHood);

        const leftHood = new THREE.Mesh(new THREE.BoxGeometry(0.35, 23.6, 3.2), bezelMat);
        leftHood.position.set(-9.85, 0, 0.4);
        leftHood.rotation.y = -0.15;
        machineGroup.add(leftHood);

        const rightHood = leftHood.clone();
        rightHood.position.x = 9.85;
        rightHood.rotation.y = 0.15;
        machineGroup.add(rightHood);

        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const keyLight = new THREE.DirectionalLight(0xbae6fd, 0.85);
        keyLight.position.set(10, 15, 18);
        scene.add(keyLight);

        function renderStatic3D() { renderer.render(scene, camera); }
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderStatic3D();
        });
        renderStatic3D();

        /* ------------------ 3. 繁體字校準 ------------------ */
        let hkConverter = null;
        try {
            if (window.OpenCC) {
                hkConverter = window.OpenCC.Converter({ from: 'cn', to: 'hk' });
            }
        } catch (e) {}

        function convertToHK(str) {
            if (!str) return '';
            if (hkConverter) {
                try { return hkConverter(str); } catch(e) {}
            }
            return str;
        }

        function cleanString(str) {
            return (str || '').replace(/[，。？！、\s\.,!\?…—]/g, '');
        }

        const fontToast = document.getElementById('fontToast');
        let toastTimer = null;
        function showToast(msg) {
            fontToast.innerText = msg;
            fontToast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => fontToast.classList.remove('show'), 1500);
        }

        /* ------------------ 4. 粵語句組引擎 (純白聚焦) ------------------ */
        const QUESTION_ENDINGS = /(點解|係咪|係唔係|係未|得唔得|好唔好|幾時|邊個|邊度|邊處|點樣|點做|點算|成點|做咩|做乜|做乜嘢|嗎|下話|得未|好未|係咪呀|係唔係呀|點樣呀|做咩呀|邊個呀|幾時呀)$/;
        const EXCLAMATION_ENDINGS = /(太好喇|好犀利|超勁|正呀|好正|利害|搞錯|痴線|唔係卦|救命|嘩|哇|好嘢|真係誇張|真係正|勁呀|正話|好痛呀|好正呀)$/;

        const cantoScroll = document.getElementById('cantoScroll');
        const cantoStream = document.getElementById('cantoStream');
        const interimPart = document.getElementById('interimPart');

        let autoScrollCanto = true;
        let confirmedPlainHistory = "";
        let lastFinalCleanText = "";
        let lastFinalTimestamp = 0;

        const groupList = [];
        let currentGroup = null;
        let longPauseTimer = null;

        const MAX_VALID_SENTENCES_PER_GROUP = 3;
        const LONG_PAUSE_THRESHOLD = 1400;

        cantoScroll.addEventListener('scroll', () => {
            autoScrollCanto = (cantoScroll.scrollHeight - cantoScroll.scrollTop - cantoScroll.clientHeight) < 120;
        });

        function scrollCantoToBottom() {
            if (autoScrollCanto) {
                requestAnimationFrame(() => {
                    cantoScroll.scrollTop = cantoScroll.scrollHeight;
                });
            }
        }

        function extractNonOverlappingDelta(incomingText) {
            if (!incomingText) return "";
            const cleanIncoming = cleanString(incomingText);
            if (!cleanIncoming) return "";
            if (!confirmedPlainHistory) return incomingText.trim();

            const recentHistory = confirmedPlainHistory.slice(-200);
            if (cleanIncoming.length >= 3 && recentHistory.includes(cleanIncoming)) return "";
            if (recentHistory.endsWith(cleanIncoming)) return "";

            const maxLen = Math.min(recentHistory.length, cleanIncoming.length);
            let overlapLen = 0;
            for (let len = maxLen; len >= 1; len--) {
                if (recentHistory.endsWith(cleanIncoming.slice(0, len))) {
                    overlapLen = len;
                    break;
                }
            }
            if (overlapLen === cleanIncoming.length) return "";

            if (overlapLen > 0) {
                let cleanCount = 0;
                let cutIndex = 0;
                for (let i = 0; i < incomingText.length; i++) {
                    if (!/[，。？！、\s\.,!\?…—]/.test(incomingText[i])) cleanCount++;
                    if (cleanCount === overlapLen) {
                        cutIndex = i + 1;
                        break;
                    }
                }
                return incomingText.slice(cutIndex).trim();
            }
            return incomingText.trim();
        }

        const wordSegmenter = (typeof Intl !== 'undefined' && Intl.Segmenter)
            ? new Intl.Segmenter('zh-HK', { granularity: 'word' }) : null;

        const LEXICON = {
            strongParticles: new Set(['啦', '喇', '㗎', '喎', '囉', '啫', '咋', '添', '之嘛', '喇喎', '㗎啦', '㗎喇', '㗎咋', '咩', '呢', '呀嘛', '嗎', '下話', '嘅']),
            connectives: new Set(['但係', '不過', '然而', '跟住', '然後', '所以', '因此', '而且', '即係話', '另外', '總之', '事實上', '仲有', '反之', '換言之', '其實']),
            starters: new Set(['我哋', '你哋', '佢哋', '大家', '其實我', '如果', '因為', '咁樣']),
            glueWords: new Set(['緊', '咗', '過', '嘅', '同埋', '一齊', '喺', '去', '想', '要'])
        };

        function splitIntoSemanticClauses(rawText) {
            if (!rawText) return [];
            const text = rawText.trim().replace(/^[，。？！、\.,!\?\s…—]+|[，。？！、\.,!\?\s…—]+$/g, '');
            if (!text) return [];
            if (cleanString(text).length <= 7) return [text];

            const rawBlocks = text.split(/[，。？！、\.,!\?\n\r]+/);
            const finalClauses = [];

            for (let block of rawBlocks) {
                block = block.trim();
                const blockClean = cleanString(block);
                if (!blockClean) continue;
                if (blockClean.length <= 8) {
                    finalClauses.push(block);
                    continue;
                }

                let words = wordSegmenter ? Array.from(wordSegmenter.segment(block)).map(s => s.segment) : block.split('');
                let currentClause = "";
                let splitScore = 0;

                for (let i = 0; i < words.length; i++) {
                    const word = words[i];
                    const nextWord = words[i + 1] || "";
                    currentClause += word;

                    const curLen = cleanString(currentClause).length;
                    const remainingLen = cleanString(words.slice(i + 1).join('')).length;

                    if (remainingLen < 3) continue;

                    splitScore = 0;
                    if (curLen >= 6) splitScore += (curLen - 5) * 6;
                    if (LEXICON.strongParticles.has(word)) splitScore += 40;
                    if (LEXICON.connectives.has(nextWord)) splitScore += 45;
                    if (LEXICON.starters.has(nextWord) && curLen >= 6) splitScore += 30;
                    if (LEXICON.glueWords.has(word)) splitScore -= 40;

                    if (splitScore >= 65 || curLen >= 13) {
                        finalClauses.push(currentClause.trim());
                        currentClause = "";
                    }
                }
                if (currentClause.trim()) finalClauses.push(currentClause.trim());
            }
            return finalClauses.filter(c => cleanString(c).length > 0);
        }

        function getClausePunctuation(rawClauseText, isGroupFinalClause = false) {
            const clean = cleanString(rawClauseText);
            if (QUESTION_ENDINGS.test(clean)) return '？';
            if (EXCLAMATION_ENDINGS.test(clean)) return '！';
            if (isGroupFinalClause) return '。';
            return '，';
        }

        function renderGroupText(group, isFinalized = false) {
            const clauses = group.clauses;
            if (clauses.length === 0) return "";
            let fullStr = "";
            for (let i = 0; i < clauses.length; i++) {
                const pureText = clauses[i].replace(/[，。？！、\.,!\?\s…—]+$/g, '').trim();
                if (!pureText) continue;
                const isLast = (i === clauses.length - 1);
                const punct = getClausePunctuation(pureText, isLast && isFinalized);
                fullStr += pureText + punct;
            }
            return fullStr;
        }

        function refreshGroupHighlights() {
            const total = groupList.length;
            groupList.forEach((group, index) => {
                if (index === total - 1) {
                    group.elem.classList.remove('past');
                    group.elem.classList.add('active-latest');
                } else {
                    group.elem.classList.remove('active-latest');
                    group.elem.classList.add('past');
                }
            });
        }

        function createNewGroup() {
            const groupElem = document.createElement('div');
            groupElem.className = 'phrase-group active-latest';
            cantoStream.insertBefore(groupElem, interimPart);

            const newGroup = { elem: groupElem, clauses: [], validCount: 0, fullText: "" };
            groupList.push(newGroup);

            if (groupList.length > 50) {
                const old = groupList.shift();
                if (old?.elem?.parentNode) old.elem.parentNode.removeChild(old.elem);
            }
            refreshGroupHighlights();
            return newGroup;
        }

        function finalizeCurrentGroup() {
            clearTimeout(longPauseTimer);
            longPauseTimer = null;
            if (!currentGroup) return;

            currentGroup.fullText = renderGroupText(currentGroup, true);
            currentGroup.elem.textContent = currentGroup.fullText;

            if (currentMode === 'broadcast') {
                broadcastSecurePayload({ type: 'finalize', fullText: currentGroup.fullText });
            }

            currentGroup = null;
            refreshGroupHighlights();
        }

        function commitSpeechDelta(rawText) {
            clearTimeout(longPauseTimer);
            let delta = convertToHK(rawText).trim();
            delta = extractNonOverlappingDelta(delta);
            if (!delta) return;

            const semanticClauses = splitIntoSemanticClauses(delta);
            if (semanticClauses.length === 0) return;

            for (const clause of semanticClauses) {
                const cleanLen = cleanString(clause).length;
                if (cleanLen === 0) continue;
                const cleanClause = cleanString(clause);
                if (confirmedPlainHistory.endsWith(cleanClause)) continue;

                const isValidSentence = cleanLen > 5;
                if (!currentGroup) currentGroup = createNewGroup();

                currentGroup.clauses.push(clause);
                if (isValidSentence) currentGroup.validCount++;

                currentGroup.fullText = renderGroupText(currentGroup, false);
                currentGroup.elem.textContent = currentGroup.fullText;

                confirmedPlainHistory += cleanClause;
                if (confirmedPlainHistory.length > 1000) confirmedPlainHistory = confirmedPlainHistory.slice(-600);

                if (currentMode === 'broadcast') {
                    broadcastSecurePayload({ type: 'update_group', fullText: currentGroup.fullText });
                }

                if (currentGroup.validCount >= MAX_VALID_SENTENCES_PER_GROUP) {
                    finalizeCurrentGroup();
                }
            }

            refreshGroupHighlights();
            scrollCantoToBottom();

            if (currentGroup) {
                longPauseTimer = setTimeout(() => { finalizeCurrentGroup(); }, LONG_PAUSE_THRESHOLD);
            }
        }

        /* ------------------ 5. 語音辨識機制 ------------------ */
        function handleSpeechInterim(interim) {
            if (!interim || !interim.trim()) {
                interimPart.textContent = "";
                if (currentMode === 'broadcast') broadcastSecurePayload({ type: 'interim', text: "" });
                return;
            }
            let delta = extractNonOverlappingDelta(convertToHK(interim.trim()));
            interimPart.textContent = delta || "";
            if (currentMode === 'broadcast') broadcastSecurePayload({ type: 'interim', text: delta || "" });
            if (delta) scrollCantoToBottom();
        }

        function handleSpeechFinal(finalText) {
            if (!finalText || !finalText.trim()) return;
            const cleanFinal = cleanString(finalText);
            const now = Date.now();
            if (cleanFinal === lastFinalCleanText && (now - lastFinalTimestamp < 1800)) {
                interimPart.textContent = "";
                if (currentMode === 'broadcast') broadcastSecurePayload({ type: 'interim', text: "" });
                return;
            }
            lastFinalCleanText = cleanFinal;
            lastFinalTimestamp = now;
            interimPart.textContent = "";
            if (currentMode === 'broadcast') broadcastSecurePayload({ type: 'interim', text: "" });
            commitSpeechDelta(finalText);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let userWantsListening = false;
        let isEngineRunning = false;
        let wakeLock = null;
        let restartDebounce = null;

        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        async function acquireWakeLock() {
            try {
                if ('wakeLock' in navigator && !wakeLock) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        function scheduleSafeRestart() {
            if (!userWantsListening) return;
            clearTimeout(restartDebounce);
            restartDebounce = setTimeout(() => {
                if (userWantsListening && !isEngineRunning && recognition) {
                    try { recognition.start(); } catch (e) {}
                }
            }, 80);
        }

        if (SpeechRecognition && !isReceiverMode) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-HK';
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isEngineRunning = true;
                toggleBtn.classList.add('active');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const res = event.results[i];
                    if (!res || !res[0]) continue;
                    if (res.isFinal) handleSpeechFinal(res[0].transcript);
                    else interim += res[0].transcript;
                }
                if (interim) handleSpeechInterim(interim);
            };

            recognition.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    userWantsListening = false;
                    stopListeningUI();
                } else scheduleSafeRestart();
            };

            recognition.onend = () => {
                isEngineRunning = false;
                interimPart.textContent = "";
                if (userWantsListening) scheduleSafeRestart();
                else stopListeningUI();
            };
        }

        function toggleSpeech() {
            if (!recognition) return alert("瀏覽器不支援語音辨識。");
            if (userWantsListening) {
                userWantsListening = false;
                if (restartDebounce) clearTimeout(restartDebounce);
                finalizeCurrentGroup();
                releaseWakeLock();
                try { recognition.stop(); } catch(e) {}
                stopListeningUI();
            } else {
                userWantsListening = true;
                acquireWakeLock();
                scheduleSafeRestart();
            }
        }

        function stopListeningUI() {
            toggleBtn.classList.remove('active');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            interimPart.textContent = "";
        }

        /* ------------------ 6. 純數字房間加密傳輸 ------------------ */
        async function broadcastSecurePayload(payload) {
            if (mqttClient && mqttClient.connected && currentMode === 'broadcast') {
                const encryptedString = await encryptPayload(payload);
                mqttClient.publish(`canto/room_${currentRoomId}`, encryptedString);
            }
        }

        async function initReceiverCloud() {
            await initEncryptionKey(currentSecretKey);
            if (mqttClient) {
                try { mqttClient.end(); } catch (e) {}
            }
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clean: true });
            
            mqttClient.on('connect', () => {
                mqttClient.subscribe(`canto/room_${currentRoomId}`);
                showToast("已成功同步房間");
            });

            mqttClient.on('message', async (topic, msg) => {
                const data = await decryptPayload(msg.toString());
                if (!data) return;

                if (data.type === 'interim') {
                    interimPart.textContent = data.text;
                    if (data.text) scrollCantoToBottom();
                } else if (data.type === 'update_group') {
                    interimPart.textContent = ""; 

                    if (!currentGroup) currentGroup = createNewGroup();
                    currentGroup.fullText = data.fullText;
                    currentGroup.elem.textContent = data.fullText;
                    refreshGroupHighlights();
                    scrollCantoToBottom();
                } else if (data.type === 'finalize') {
                    interimPart.textContent = ""; 

                    if (currentGroup) {
                        currentGroup.fullText = data.fullText;
                        currentGroup.elem.textContent = data.fullText;
                        currentGroup = null;
                        refreshGroupHighlights();
                    }
                }
            });
        }

        async function switchToBroadcastMode() {
            if (currentMode === 'broadcast') {
                openQrModal();
                return;
            }
            currentMode = 'broadcast';

            // 確保產生 6 位純數字房間號
            if (!currentRoomId) currentRoomId = String(Math.floor(100000 + Math.random() * 900000));
            if (!currentSecretKey) currentSecretKey = Math.random().toString(36).substring(2, 8).toUpperCase();

            await initEncryptionKey(currentSecretKey);

            if (!mqttClient) {
                mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clean: true });
            }

            updateUIState();
            setupMinimalQR();
            openQrModal();
        }

        function switchToSoloMode() {
            currentMode = 'solo';
            if (mqttClient) {
                try { mqttClient.end(); } catch(e) {}
                mqttClient = null;
            }
            updateUIState();
        }

        function setupMinimalQR() {
            const currentUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}#${currentSecretKey}`;
            
            document.getElementById('roomLinkText').innerText = currentUrl;
            document.getElementById('qrRoomCodeDisplay').innerText = currentRoomId;
            document.getElementById('qrSecretKeyDisplay').innerText = currentSecretKey;

            const qrContainer = document.getElementById('qrContainer');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: currentUrl,
                width: 170,
                height: 170,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function copyShareLink() {
            const currentUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}#${currentSecretKey}`;
            const shareText = `【粵語提詞器同步】\n純數字房間號：${currentRoomId}\n密鑰：${currentSecretKey}\n連結：${currentUrl}`;
            navigator.clipboard.writeText(shareText).then(() => {
                showToast("已複製房間資訊");
            }).catch(() => {
                navigator.clipboard.writeText(currentUrl).then(() => showToast("已複製連結"));
            });
        }

        /* ------------------ 純數字房間手動加入機制 ------------------ */
        const joinModal = document.getElementById('joinModal');
        function openJoinModal() { joinModal.classList.add('active'); }
        function closeJoinModal() { joinModal.classList.remove('active'); }

        function handleFastPaste(e) {
            const val = e.target.value.trim();
            try {
                if (val.includes('room=') && val.includes('#')) {
                    const u = new URL(val);
                    const r = u.searchParams.get('room');
                    const k = u.hash.replace('#', '');
                    if (r) document.getElementById('inputRoomId').value = r.replace(/\D/g, '');
                    if (k) document.getElementById('inputSecretKey').value = k;
                }
            } catch (err) {}
        }

        async function submitJoinRoom() {
            let r = document.getElementById('inputRoomId').value.replace(/\D/g, '').trim();
            const k = document.getElementById('inputSecretKey').value.trim();

            if (!r || r.length < 4) {
                return alert("請填寫正確的純數字房間號碼！");
            }
            if (!k) {
                return alert("請填寫連線密鑰！");
            }

            currentMode = 'receive';
            currentRoomId = r;
            currentSecretKey = k;

            // 保持網址列純淨並同步
            const newUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}#${currentSecretKey}`;
            window.history.replaceState(null, '', newUrl);

            updateUIState();
            closeJoinModal();
            await initReceiverCloud();
        }

        const qrModal = document.getElementById('qrModal');
        function openQrModal() { qrModal.classList.add('active'); }
        function closeQrModal() { qrModal.classList.remove('active'); }

        updateUIState();
        if (isReceiverMode) {
            initReceiverCloud();
        }

        /* ------------------ 7. 字體調節 ------------------ */
        const fontScales = [
            { name: "標準", canto: "2.15rem" },
            { name: "放大", canto: "2.60rem" },
            { name: "特大", canto: "3.10rem" }
        ];
        let currentScaleIdx = 0;

        function cycleFontSize() {
            currentScaleIdx = (currentScaleIdx + 1) % fontScales.length;
            const cur = fontScales[currentScaleIdx];
            document.documentElement.style.setProperty('--cantonese-size', cur.canto);
            showToast(`字體 ${cur.name}`);
            scrollCantoToBottom();
        }

        /* ------------------ 8. 粵拼注音與朗讀 ------------------ */
        const modal = document.getElementById('phoneticModal');
        const modalContent = document.getElementById('modalContent');
        const ttsStatus = document.getElementById('ttsStatus');
        let currentPureText = "";

        function getAllRecognizedText() {
            return groupList.map(item => item.fullText).join('') + interimPart.textContent;
        }

        async function fetchJyutpingRubyHTML(text) {
            if (!text) return "";
            if (!window.ToJyutping) {
                try {
                    const mod = await import('https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm');
                    window.ToJyutping = mod.default || mod;
                } catch (e) {}
            }

            let html = "";
            if (window.ToJyutping && typeof window.ToJyutping.getJyutpingList === 'function') {
                try {
                    const list = window.ToJyutping.getJyutpingList(text);
                    for (const [char, rawJp] of list) {
                        if (char === '\n') {
                            html += '<div style="flex-basis: 100%; height: 8px;"></div>';
                            continue;
                        }
                        if (rawJp) {
                            html += `<ruby class="jp-ruby"><span class="c-char">${char}</span><rt class="c-rt">${rawJp}</rt></ruby>`;
                        } else {
                            html += `<span class="jp-punct">${char}</span>`;
                        }
                    }
                    return html;
                } catch (err) {}
            }
            return text;
        }

        async function openPhoneticModal() {
            const fullText = getAllRecognizedText().trim();
            currentPureText = cleanString(fullText);

            if (!fullText) {
                modalContent.innerHTML = "<div style='color:#64748b; font-size:1rem; padding:10px;'>暫無文字</div>";
                modal.classList.add('active');
                return;
            }

            modalContent.innerHTML = "<div style='color:#94a3b8; font-size:1rem; width:100%; text-align:center; padding:30px 0;'>粵拼注音生成中...</div>";
            ttsStatus.innerText = "標音中";
            modal.classList.add('active');

            const rubyHTML = await fetchJyutpingRubyHTML(fullText);
            modalContent.innerHTML = rubyHTML;
            ttsStatus.innerText = "就緒";
        }

        function closePhoneticModal() {
            modal.classList.remove('active');
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }

        function closeModalOnBackdrop(event) {
            if (event.target === modal) closePhoneticModal();
            if (event.target === qrModal) closeQrModal();
            if (event.target === joinModal) closeJoinModal();
        }

        function speakCurrentText() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utter = new SpeechSynthesisUtterance(currentPureText);
            utter.lang = 'zh-HK';
            utter.rate = 0.85;

            utter.onstart = () => ttsStatus.innerText = "朗讀中";
            utter.onend = () => ttsStatus.innerText = "完畢";
            utter.onerror = () => ttsStatus.innerText = "就緒";

            window.speechSynthesis.speak(utter);
        }

        /* ------------------ 9. 桌面置頂懸浮字幕條 ------------------ */
        let pipWindow = null;

       async function togglePipPrompter() {
            if (pipWindow && !pipWindow.closed) {
                pipWindow.close();
                pipWindow = null;
                return;
            }

            if (!('documentPictureInPicture' in window)) {
                alert('您的瀏覽器尚未支援 Document Picture-in-Picture。\n請在電腦使用最新版 Chrome 或 Edge 瀏覽器！');
                return;
            }

            try {
                // 取得目前螢幕的可用全寬度與原點
                const availLeft = window.screen.availLeft ?? 0;
                const availTop = window.screen.availTop ?? 0;
                const availW = window.screen.availWidth || window.screen.width || window.innerWidth;
                const availH = window.screen.availHeight || window.screen.height || window.innerHeight;
                const targetH = 80;

                pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: availW,
                    height: targetH
                });

                // 強制覆寫邊界，撐滿 100% 寬度並貼齊底端
                const snapToFullWidthBottom = () => {
                    try {
                        const winH = pipWindow.outerHeight || targetH;
                        // 1. 強制重設為螢幕 100% 可用寬度
                        pipWindow.resizeTo(availW, winH);
                        // 2. 移動至最左側 (availLeft) 並置底
                        pipWindow.moveTo(availLeft, availTop + availH - winH);
                    } catch (e) {}
                };

                // 分段觸發以繞過瀏覽器在視窗載入初期的尺寸限制
                snapToFullWidthBottom();
                requestAnimationFrame(snapToFullWidthBottom);
                setTimeout(snapToFullWidthBottom, 100);
                setTimeout(snapToFullWidthBottom, 300);

                document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
                    pipWindow.document.head.appendChild(link.cloneNode(true));
                });
                document.querySelectorAll('style').forEach(style => {
                    pipWindow.document.head.appendChild(style.cloneNode(true));
                });

                const pipStyle = pipWindow.document.createElement('style');
                pipStyle.textContent = `
                    html, body {
                        margin: 0 !important;
                        padding: 0 !important;
                        background: #05070a !important;
                        height: 100vh !important;
                        width: 100vw !important;
                        overflow: hidden !important;
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                    }
                    .viewport-container::before {
                        display: none !important;
                    }
                    .scroll-body {
                        height: 100% !important;
                        width: 100% !important;
                        padding: 0 24px !important;
                        margin: 0 !important;
                        box-sizing: border-box !important;
                        overflow: hidden !important;
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                    }
                    .cantonese-stream {
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                        text-align: center !important;
                        gap: 8px !important;
                        width: 100% !important;
                        font-size: var(--cantonese-size, 2.15rem) !important;
                        line-height: 1.25 !important;
                        white-space: nowrap !important;
                        overflow: hidden !important;
                        text-overflow: ellipsis !important;
                    }
                    .phrase-group.past {
                        display: none !important;
                    }
                    .phrase-group.active-latest {
                        display: inline !important;
                        color: #ffffff !important;
                        font-weight: 700 !important;
                        text-shadow: 0 0 16px rgba(255, 255, 255, 0.45) !important;
                    }
                    .phrase-item.interim {
                        display: inline !important;
                        color: #38bdf8 !important;
                    }
                    .bottom-safe-spacer {
                        display: none !important;
                    }
                `;
                pipWindow.document.head.appendChild(pipStyle);

                const cantoScrollElem = document.getElementById('cantoScroll');
                const viewportContainer = document.querySelector('.viewport-container');
                pipWindow.document.body.appendChild(cantoScrollElem);

                const btnPip = document.getElementById('btnPip');
                if (btnPip) btnPip.classList.add('mode-active');

                pipWindow.addEventListener('pagehide', () => {
                    if (viewportContainer && cantoScrollElem) {
                        viewportContainer.appendChild(cantoScrollElem);
                    }
                    pipWindow = null;
                    if (btnPip) btnPip.classList.remove('mode-active');
                    scrollCantoToBottom();
                });

            } catch (err) {
                console.error('開啟置頂字幕視窗失敗:', err);
            }
        }
    </script>
</body>
