<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實時粵普字幕</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@600;700&display=swap" rel="stylesheet">

    <!-- 權威粵拼模組 -->
    <script type="module">
        import ToJyutping from 'https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm';
        window.ToJyutping = ToJyutping;
    </script>

    <!-- 繁體字強制校準庫 -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>

    <!-- 核心 Puter.js AI 引擎 -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        :root {
            --bg: #090a0f;
            --canto-bg: #090a0f;
            --mando-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            
            --cantonese: #f8fafc;
            --mandarin: #38bdf8;
            --mandarin-text: #bae6fd;
            --ruby: #f59e0b;

            --cantonese-size: 1.55rem;
            --mandarin-size: 1.18rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--cantonese);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 頂部控制欄 */
        header {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            background: rgba(9, 10, 15, 0.96);
            backdrop-filter: blur(12px);
            z-index: 20;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.8px;
            font-family: "Noto Sans HK", sans-serif;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: #cbd5e1;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .icon-btn:active { transform: scale(0.92); }
        .icon-btn svg { width: 17px; height: 17px; stroke-width: 2; }

        .power-btn {
            background: #ef4444;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
        }

        .power-btn.active {
            background: #10b981;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.5);
        }

        /* 雙欄核心排版容器 (垂直分配) */
        .viewport-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        /* 上欄：主視覺 粵語區 (約佔 58%) */
        .pane-cantonese {
            flex: 58;
            overflow-y: auto;
            padding: 18px 20px 24px 20px;
            display: flex;
            flex-direction: column;
            background-color: var(--canto-bg);
            border-bottom: 1px solid var(--card-border);
            scroll-behavior: smooth;
            position: relative;
        }

        /* 下欄：對照 普語區 (約佔 42%) */
        .pane-mandarin {
            flex: 42;
            overflow-y: auto;
            padding: 16px 20px 30px 20px;
            display: flex;
            flex-direction: column;
            background-color: var(--mando-bg);
            scroll-behavior: smooth;
            position: relative;
        }

        /* 隱形欄頂部的小標籤欄 */
        .pane-meta {
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            margin-bottom: 8px;
            z-index: 10;
            pointer-events: none;
        }

        .pane-tag {
            font-family: "Noto Sans HK", sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            pointer-events: auto;
        }

        .tag-canto {
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tag-mando {
            color: var(--mandarin);
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .meta-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .char-counter {
            font-family: "Noto Sans HK", sans-serif;
            font-size: 0.72rem;
            color: #64748b;
        }

        /* 文字流排版 */
        .cantonese-content {
            font-family: "Noto Serif HK", serif;
            font-size: var(--cantonese-size);
            font-weight: 700;
            line-height: 1.85;
            letter-spacing: 0.8px;
            color: var(--cantonese);
            word-break: break-word;
            flex: 1;
        }

        .cantonese-content .interim-text {
            color: #38bdf8;
            opacity: 0.85;
            margin-left: 4px;
            border-bottom: 2px dashed rgba(56, 189, 248, 0.4);
        }

        .mandarin-content {
            font-family: "Noto Sans HK", sans-serif;
            font-size: var(--mandarin-size);
            font-weight: 500;
            line-height: 1.75;
            color: var(--mandarin-text);
            word-break: break-word;
            flex: 1;
        }

        .mandarin-pending {
            color: #64748b;
            font-size: 0.9em;
            margin-left: 4px;
            animation: pulseQuiet 1.2s infinite;
        }

        @keyframes pulseQuiet {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.7; }
        }

        #fontToast {
            position: fixed;
            top: 58px;
            right: 20px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.8rem;
            padding: 5px 10px;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.2s ease;
            z-index: 30;
            font-family: "Noto Sans HK", sans-serif;
        }

        #fontToast.show { opacity: 1; transform: translateY(0); }

        /* 滾動條樣式優化 */
        .pane-cantonese::-webkit-scrollbar,
        .pane-mandarin::-webkit-scrollbar,
        .modal-body::-webkit-scrollbar {
            width: 4px;
        }
        .pane-cantonese::-webkit-scrollbar-thumb,
        .pane-mandarin::-webkit-scrollbar-thumb,
        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* 拼音彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-window {
            background: #0d1117;
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 640px;
            max-height: 80vh;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            font-family: "Noto Sans HK", sans-serif;
            font-size: 0.9rem;
            color: #f1f5f9;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            line-height: 2.6;
            background: #080a0e;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        ruby.jp-ruby {
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            margin: 2px 4px;
            line-height: 1;
        }

        ruby.jp-ruby rt.c-rt {
            display: block;
            font-size: 0.78rem;
            line-height: 1;
            font-family: "Noto Sans HK", sans-serif;
            color: var(--ruby);
            margin-bottom: 5px;
        }

        ruby.jp-ruby span.c-char {
            display: block;
            font-size: 1.55rem;
            font-weight: 600;
            color: #f8fafc;
        }

        span.jp-punct {
            font-size: 1.55rem;
            line-height: 1.2;
            color: #64748b;
            margin: 0 3px;
        }

        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <span class="brand-title">粵普實時字幕</span>
        <div class="btn-group">
            <button class="icon-btn" title="切換字體" onclick="cycleFontSize()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.5 17.5L6.5 9.5L9.5 17.5"></path>
                    <path d="M4.8 14.5H8.2"></path>
                    <path d="M12.5 17.5L16.5 6.5L20.5 17.5"></path>
                    <path d="M14 13.5H19"></path>
                </svg>
            </button>
            <button id="toggleBtn" class="icon-btn power-btn" title="啟動識別" onclick="toggleSpeech()">
                <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"></path>
                </svg>
                <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="5" width="4" height="14" rx="1.5"></rect>
                    <rect x="14" y="5" width="4" height="14" rx="1.5"></rect>
                </svg>
            </button>
        </div>
    </header>

    <div id="fontToast">字體 標準</div>

    <!-- 上下獨立分欄排版 -->
    <div class="viewport-container">
        
        <!-- 上欄：粵語區 -->
        <section id="cantoPane" class="pane-cantonese">
            <div class="pane-meta">
                <span class="pane-tag tag-canto">粵語原文</span>
                <div class="meta-actions">
                    <span id="charCount" class="char-counter">0 字</span>
                    <button class="icon-btn" style="width:24px; height:24px;" onclick="openPhoneticModal()" title="粵拼">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="cantonese-content">
                <span id="confirmedPart"></span><span id="interimPart" class="interim-text"></span>
            </div>
        </section>

        <!-- 下欄：普通話區 -->
        <section id="mandoPane" class="pane-mandarin">
            <div class="pane-meta">
                <span class="pane-tag tag-mando">普通話對照</span>
            </div>
            <div id="mandarinContent" class="mandarin-content"></div>
        </section>

    </div>

    <!-- 粵拼彈窗 -->
    <div id="phoneticModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-window">
            <div class="modal-header">
                <span>粵拼與發音</span>
                <button class="icon-btn" style="width:28px; height:28px;" onclick="closePhoneticModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="modalContent" class="modal-body"></div>
            <div class="modal-footer">
                <span id="ttsStatus" style="font-size: 0.8rem; color: #94a3b8; font-family: 'Noto Sans HK', sans-serif;">就緒</span>
                <button id="ttsPlayBtn" class="icon-btn" style="background:#0284c7; color:#fff;" onclick="speakCurrentText()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="6 3 20 12 6 21 6 3"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ------------------ 1. 繁體字校準與括號過濾器 ------------------ */
        let hkConverter = null;
        try {
            if (window.OpenCC) {
                hkConverter = window.OpenCC.Converter({ from: 'cn', to: 'hk' });
            }
        } catch (e) {}

        function ensureTraditional(text) {
            if (!text) return "";
            if (hkConverter) {
                try { text = hkConverter(text); } catch (e) {}
            }
            return text;
        }

        function stripAllBrackets(text) {
            if (!text) return "";
            return text.replace(/[()（）\[\]【】{}《》「」『』〈〉"'“”‘’]/g, '').trim();
        }

        function cleanString(str) {
            return (str || '').replace(/[，。？！、\s\.,!\?]/g, '');
        }

        /* ------------------ 2. Puter.js 單句增量續寫翻譯 ------------------ */
        async function translateDeltaWithPuter(newSentence, targetSpan) {
            if (!newSentence || !newSentence.trim()) {
                targetSpan.remove();
                return;
            }

            if (!window.puter || !window.puter.ai) {
                targetSpan.remove();
                return;
            }

            try {
                const prompt = `請將以下這句粵語口語直接翻譯成清晰、通俗、現代標準的白話文普通話。
要求：
1. 必須全部使用繁體中文，嚴禁出現任何簡體字。
2. 必須是通俗日常的現代白話文，絕不能使用文言文或半文言。
3. 徹底理順倒裝句式。
4. 嚴禁任何括號、引號或附加解釋，只輸出這一句譯文。

粵語：${newSentence}`;

                const response = await puter.ai.chat(prompt);

                let aiText = "";
                if (typeof response === 'string') {
                    aiText = response;
                } else if (response && response.message && response.message.content) {
                    aiText = response.message.content;
                } else if (response && response.text) {
                    aiText = response.text;
                } else if (response) {
                    aiText = String(response);
                }

                aiText = ensureTraditional(stripAllBrackets(aiText));

                if (aiText) {
                    if (!/[，。？！、]$/.test(aiText)) {
                        aiText += "，";
                    }
                    targetSpan.className = "";
                    targetSpan.innerText = aiText;
                } else {
                    targetSpan.remove();
                }
            } catch (err) {
                console.error("【Puter.js 增量翻譯失敗】：", err);
                targetSpan.remove();
            } finally {
                scrollMandoToBottom();
            }
        }

        /* ------------------ 3. 雙欄分離管理器 ------------------ */
        const cantoPane = document.getElementById('cantoPane');
        const mandoPane = document.getElementById('mandoPane');
        const confirmedPart = document.getElementById('confirmedPart');
        const interimPart = document.getElementById('interimPart');
        const mandarinContent = document.getElementById('mandarinContent');
        const charCount = document.getElementById('charCount');

        let rawConfirmedText = "";
        let fullPunctuatedText = "";

        let autoScrollCanto = true;
        let autoScrollMando = true;

        cantoPane.addEventListener('scroll', () => {
            const threshold = 60;
            autoScrollCanto = (cantoPane.scrollHeight - cantoPane.scrollTop - cantoPane.clientHeight) < threshold;
        });

        mandoPane.addEventListener('scroll', () => {
            const threshold = 60;
            autoScrollMando = (mandoPane.scrollHeight - mandoPane.scrollTop - mandoPane.clientHeight) < threshold;
        });

        function scrollCantoToBottom() {
            if (autoScrollCanto) {
                cantoPane.scrollTop = cantoPane.scrollHeight;
            }
        }

        function scrollMandoToBottom() {
            if (autoScrollMando) {
                mandoPane.scrollTop = mandoPane.scrollHeight;
            }
        }

        // 說話時實時更新未定稿內容
        function handleSpeechInterim(interim) {
            if (!interim || !interim.trim()) return;
            interimPart.innerText = interim;
            scrollCantoToBottom();
        }

        // 定稿：雙欄分別追加，各自獨立滾動
        function handleSpeechFinal(finalText) {
            finalText = ensureTraditional(stripAllBrackets(finalText.trim()));
            if (!finalText) return;

            interimPart.innerText = "";

            const cleanFinal = cleanString(finalText);
            const cleanConfirmed = cleanString(rawConfirmedText);
            if (cleanConfirmed.endsWith(cleanFinal)) return;

            // 計算出新講的那一句 delta
            let delta = finalText;
            for (let i = finalText.length; i >= 1; i--) {
                const prefix = finalText.slice(0, i);
                if (cleanConfirmed.endsWith(cleanString(prefix))) {
                    delta = finalText.slice(i).trim();
                    break;
                }
            }
            if (!delta) return;

            // 1. 更新粵語欄
            const formatted = delta + "，";
            rawConfirmedText += delta;
            fullPunctuatedText += formatted;
            confirmedPart.innerText = fullPunctuatedText;
            charCount.innerText = `${cleanString(rawConfirmedText).length} 字`;
            scrollCantoToBottom();

            // 2. 更新普通話欄（在尾部追加等待 span）
            const targetSpan = document.createElement('span');
            targetSpan.className = "mandarin-pending";
            targetSpan.innerText = " ⋯";
            mandarinContent.appendChild(targetSpan);
            scrollMandoToBottom();

            // 送去 AI 翻譯
            translateDeltaWithPuter(delta, targetSpan);
        }

        /* ------------------ 4. 語音辨識與防休眠 ------------------ */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let userWantsListening = false;
        let isEngineRunning = false;
        let wakeLock = null;

        const toggleBtn = document.getElementById('toggleBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        const SILENT_AUDIO_URI = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
        const keepAliveAudio = new Audio(SILENT_AUDIO_URI);
        keepAliveAudio.loop = true;

        async function acquireWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
        }

        function ensureRecognitionActive() {
            if (userWantsListening && !isEngineRunning && recognition) {
                try { recognition.start(); } catch (e) {}
            }
        }

        setInterval(() => {
            if (userWantsListening) ensureRecognitionActive();
        }, 400);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && userWantsListening) {
                acquireWakeLock();
                ensureRecognitionActive();
            }
        });

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-HK';
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isEngineRunning = true;
                toggleBtn.classList.add('active');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const trans = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        handleSpeechFinal(trans);
                    } else {
                        interim += trans;
                    }
                }
                if (interim) handleSpeechInterim(interim);
            };

            recognition.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    userWantsListening = false;
                    stopListeningUI();
                    alert("請允許麥克風權限以進行實時識別。");
                } else {
                    setTimeout(ensureRecognitionActive, 60);
                }
            };

            recognition.onend = () => {
                isEngineRunning = false;
                if (userWantsListening) {
                    setTimeout(ensureRecognitionActive, 40);
                } else {
                    stopListeningUI();
                }
            };
        }

        /* ------------------ 5. 單鍵授權與啟動 ------------------ */
        async function toggleSpeech() {
            if (!recognition) {
                alert("當前瀏覽器不支援語音辨識，請使用 Chrome、Edge 或 Safari。");
                return;
            }

            if (userWantsListening) {
                userWantsListening = false;
                releaseWakeLock();
                try { keepAliveAudio.pause(); } catch(e) {}
                try { recognition.stop(); } catch(e) {}
                stopListeningUI();
            } else {
                if (window.puter && window.puter.auth && !puter.auth.isSignedIn()) {
                    try {
                        await puter.auth.signIn({ attempt_temp_user_creation: true });
                    } catch (e) {
                        alert("Puter AI 授權未完成，請允許授權視窗以開啟翻譯。");
                        return;
                    }
                }

                userWantsListening = true;
                acquireWakeLock();
                try { keepAliveAudio.play(); } catch(e) {}
                ensureRecognitionActive();
            }
        }

        function stopListeningUI() {
            toggleBtn.classList.remove('active');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            interimPart.innerText = "";
        }

        /* ------------------ 6. 字體調節 ------------------ */
        const fontScales = [
            { name: "標準", canto: "1.55rem", mando: "1.18rem" },
            { name: "放大", canto: "1.85rem", mando: "1.38rem" },
            { name: "特大", canto: "2.20rem", mando: "1.65rem" }
        ];
        let currentScaleIdx = 0;
        let toastTimer = null;
        const fontToast = document.getElementById('fontToast');

        function cycleFontSize() {
            currentScaleIdx = (currentScaleIdx + 1) % fontScales.length;
            const cur = fontScales[currentScaleIdx];
            document.documentElement.style.setProperty('--cantonese-size', cur.canto);
            document.documentElement.style.setProperty('--mandarin-size', cur.mando);

            fontToast.innerText = `字體 ${cur.name}`;
            fontToast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => fontToast.classList.remove('show'), 1200);

            scrollCantoToBottom();
            scrollMandoToBottom();
        }

        /* ------------------ 7. 粵拼彈窗與發音 ------------------ */
        const modal = document.getElementById('phoneticModal');
        const modalContent = document.getElementById('modalContent');
        const ttsStatus = document.getElementById('ttsStatus');
        let currentPureText = "";

        async function fetchJyutpingRubyHTML(text) {
            if (!text) return "";
            if (!window.ToJyutping) {
                try {
                    const mod = await import('https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm');
                    window.ToJyutping = mod.default || mod;
                } catch (e) {}
            }

            let html = "";
            if (window.ToJyutping && typeof window.ToJyutping.getJyutpingList === 'function') {
                try {
                    const list = window.ToJyutping.getJyutpingList(text);
                    for (const [char, rawJp] of list) {
                        if (char === '\n') {
                            html += '<div style="flex-basis: 100%; height: 8px;"></div>';
                            continue;
                        }
                        if (rawJp) {
                            html += `<ruby class="jp-ruby"><span class="c-char">${char}</span><rt class="c-rt">${rawJp}</rt></ruby>`;
                        } else {
                            html += `<span class="jp-punct">${char}</span>`;
                        }
                    }
                    return html;
                } catch (err) {}
            }
            return text;
        }

        async function openPhoneticModal() {
            const fullText = (confirmedPart.innerText || "").trim();
            currentPureText = cleanString(fullText);

            if (!fullText) {
                modalContent.innerHTML = "<div style='color:#64748b; font-size:1rem; padding:10px;'>暫無文字</div>";
                modal.classList.add('active');
                return;
            }

            modalContent.innerHTML = "<div style='color:#94a3b8; font-size:1rem; width:100%; text-align:center; padding:30px 0;'>標註中...</div>";
            ttsStatus.innerText = "標音中";
            modal.classList.add('active');

            const rubyHTML = await fetchJyutpingRubyHTML(fullText);
            modalContent.innerHTML = rubyHTML;
            ttsStatus.innerText = "就緒";
        }

        function closePhoneticModal() {
            modal.classList.remove('active');
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }

        function closeModalOnBackdrop(event) {
            if (event.target === modal) closePhoneticModal();
        }

        function speakCurrentText() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utter = new SpeechSynthesisUtterance(currentPureText);
            utter.lang = 'zh-HK';
            utter.rate = 0.85;

            utter.onstart = () => ttsStatus.innerText = "朗讀中";
            utter.onend = () => ttsStatus.innerText = "完畢";
            utter.onerror = () => ttsStatus.innerText = "就緒";

            window.speechSynthesis.speak(utter);
        }
    </script>
</body>
</html>
