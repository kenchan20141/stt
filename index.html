<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>實時粵語提詞</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@600;700&display=swap" rel="stylesheet">

    <!-- Three.js 3D 核心庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- 權威粵拼模組 -->
    <script type="module">
        import ToJyutping from 'https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm';
        window.ToJyutping = ToJyutping;
    </script>

    <!-- 繁體字強制校準庫 -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>

    <style>
        :root {
            --bg: #05070a;
            --canto-bg: #090a0f;
            --card-border: rgba(255, 255, 255, 0.08);
            
            --ruby: #f59e0b;
            --accent: #38bdf8;
            --cantonese-size: 2.05rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #threeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .teleprompter-rig {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 880px;
            height: 100vh;
            height: 100dvh;
            max-height: 960px;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 28px 24px;
            box-sizing: border-box;
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            .teleprompter-rig {
                max-width: 100%;
                height: 100dvh;
                max-height: none;
                padding: 10px 8px 16px 8px;
            }
        }

        .rig-screen-enclosure {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #090a0f;
            border-radius: 14px;
            border: 2px solid #1e2638;
            box-shadow: 
                0 0 0 1px rgba(0, 0, 0, 0.8),
                0 20px 45px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            position: relative;
            min-height: 0;
        }

        header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            background: #090a0f;
            z-index: 30;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.8px;
            font-family: "Noto Sans HK", sans-serif;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: #cbd5e1;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .icon-btn:hover { background: rgba(255, 255, 255, 0.12); color: #ffffff; }
        .icon-btn:active { transform: scale(0.94); }
        .icon-btn svg { width: 18px; height: 18px; stroke-width: 2; }

        .power-btn {
            background: #ef4444;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
        }

        .power-btn.active {
            background: #10b981;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.45);
        }

        /* 視圖區域 */
        .viewport-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            min-height: 0; 
            background-color: var(--canto-bg);
            position: relative;
        }

        /* 頂部柔和漸隱罩（防止捲動邊界銳利生硬） */
        .viewport-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 32px;
            background: linear-gradient(to bottom, #090a0f 20%, transparent);
            z-index: 10;
            pointer-events: none;
        }

        .scroll-body {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding: 24px 28px 40px 28px;
            position: relative;
            z-index: 1;
        }

        /* 自然語音流容器 */
        .cantonese-stream {
            font-family: "Noto Serif HK", serif;
            font-size: var(--cantonese-size);
            line-height: 1.85;
            letter-spacing: 0.6px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            word-break: break-word;
        }

        /* 歷史句子：柔和暗灰，退居背景，不造成眼力疲勞 */
        .phrase-item.past {
            color: #526075;
            font-weight: 500;
            transition: color 0.4s ease, opacity 0.4s ease;
            opacity: 0.6;
        }

        /* 最新完成的一句：純白高光聚焦，眼睛一眼就能找到 */
        .phrase-item.latest {
            color: #ffffff;
            font-weight: 700;
            opacity: 1;
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.28);
            animation: phrasePop 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            display: inline-block;
        }

        /* 手機即時辨識中（或剛彈出的一小段）：帶天藍色柔和辨識標籤 */
        .phrase-item.interim {
            color: #38bdf8;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid #38bdf8;
            padding: 2px 10px;
            border-radius: 0 6px 6px 0;
            animation: fadeIn 0.15s ease forwards;
        }

        .phrase-item.interim:empty {
            display: none;
        }

        @keyframes phrasePop {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .bottom-safe-spacer {
            height: calc(140px + env(safe-area-inset-bottom, 24px));
            width: 100%;
            pointer-events: none;
            flex-shrink: 0;
        }

        #fontToast {
            position: fixed;
            top: 62px;
            right: 24px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.25s ease;
            z-index: 40;
            font-family: "Noto Sans HK", sans-serif;
        }

        #fontToast.show { opacity: 1; transform: translateY(0); }

        .scroll-body::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 4px; }
        .scroll-body::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
        }

        /* 粵拼注音彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-window {
            background: #0d1117;
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 680px;
            max-height: 82vh;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            font-family: "Noto Sans HK", sans-serif;
            font-size: 0.95rem;
            color: #f1f5f9;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            line-height: 2.6;
            background: #080a0e;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        ruby.jp-ruby {
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            margin: 2px 4px;
            line-height: 1;
        }

        ruby.jp-ruby rt.c-rt {
            display: block;
            font-size: 0.82rem;
            line-height: 1;
            font-family: "Noto Sans HK", sans-serif;
            color: var(--ruby);
            margin-bottom: 6px;
        }

        ruby.jp-ruby span.c-char {
            display: block;
            font-size: 1.65rem;
            font-weight: 600;
            color: #f8fafc;
        }

        span.jp-punct {
            font-size: 1.65rem;
            line-height: 1.2;
            color: #64748b;
            margin: 0 3px;
        }

        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <canvas id="threeCanvas"></canvas>

    <main id="teleprompterRig" class="teleprompter-rig">
        <div class="rig-screen-enclosure">
            <header>
                <span class="brand-title">實時粵語提詞</span>
                <div class="btn-group">
                    <button class="icon-btn" title="粵拼注音" onclick="openPhoneticModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </button>
                    <button class="icon-btn" title="切換字體大小" onclick="cycleFontSize()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3.5 17.5L6.5 9.5L9.5 17.5"></path>
                            <path d="M4.8 14.5H8.2"></path>
                            <path d="M12.5 17.5L16.5 6.5L20.5 17.5"></path>
                            <path d="M14 13.5H19"></path>
                        </svg>
                    </button>
                    <button id="toggleBtn" class="icon-btn power-btn" title="啟動識別" onclick="toggleSpeech()">
                        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"></path>
                        </svg>
                        <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="5" width="4" height="14" rx="1.5"></rect>
                            <rect x="14" y="5" width="4" height="14" rx="1.5"></rect>
                        </svg>
                    </button>
                </div>
            </header>

            <div id="fontToast">字體 標準</div>

            <!-- 自然語意斷句提詞流 -->
            <div class="viewport-container">
                <div id="cantoScroll" class="scroll-body">
                    <div id="cantoStream" class="cantonese-stream">
                        <div id="interimPart" class="phrase-item interim"></div>
                    </div>
                    <div class="bottom-safe-spacer"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 粵拼彈窗 -->
    <div id="phoneticModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-window">
            <div class="modal-header">
                <span>粵拼注音與朗讀</span>
                <button class="icon-btn" style="width:28px; height:28px;" onclick="closePhoneticModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="modalContent" class="modal-body"></div>
            <div class="modal-footer">
                <span id="ttsStatus" style="font-size: 0.82rem; color: #94a3b8; font-family: 'Noto Sans HK', sans-serif;">就緒</span>
                <button id="ttsPlayBtn" class="icon-btn" style="background:#0284c7; color:#fff;" onclick="speakCurrentText()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="6 3 20 12 6 21 6 3"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ------------------ 0. 靜態 3D 背景 ------------------ */
        const canvas = document.getElementById('threeCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 24);

        const machineGroup = new THREE.Group();
        scene.add(machineGroup);

        const hoodMat = new THREE.MeshStandardMaterial({ color: 0x141822, metalness: 0.8, roughness: 0.3 });
        const bezelMat = new THREE.MeshStandardMaterial({ color: 0x222a38, metalness: 0.85, roughness: 0.25 });

        const chassis = new THREE.Mesh(new THREE.BoxGeometry(19.5, 23.5, 2.0), hoodMat);
        chassis.position.z = -1.2;
        machineGroup.add(chassis);

        const topHood = new THREE.Mesh(new THREE.BoxGeometry(19.6, 0.35, 3.2), bezelMat);
        topHood.position.set(0, 11.8, 0.4);
        topHood.rotation.x = 0.15;
        machineGroup.add(topHood);

        const leftHood = new THREE.Mesh(new THREE.BoxGeometry(0.35, 23.6, 3.2), bezelMat);
        leftHood.position.set(-9.85, 0, 0.4);
        leftHood.rotation.y = -0.15;
        machineGroup.add(leftHood);

        const rightHood = leftHood.clone();
        rightHood.position.x = 9.85;
        rightHood.rotation.y = 0.15;
        machineGroup.add(rightHood);

        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const keyLight = new THREE.DirectionalLight(0xbae6fd, 0.85);
        keyLight.position.set(10, 15, 18);
        scene.add(keyLight);

        function renderStatic3D() {
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderStatic3D();
        });

        renderStatic3D();

        /* ------------------ 1. 繁體字校準 ------------------ */
        let hkConverter = null;
        try {
            if (window.OpenCC) {
                hkConverter = window.OpenCC.Converter({ from: 'cn', to: 'hk' });
            }
        } catch (e) {}

        function convertToHK(str) {
            if (!str) return '';
            if (hkConverter) {
                try { return hkConverter(str); } catch(e) {}
            }
            return str;
        }

        function cleanString(str) {
            return (str || '').replace(/[，。？！、\s\.,!\?]/g, '');
        }

        const fontToast = document.getElementById('fontToast');
        let toastTimer = null;
        function showToast(msg) {
            fontToast.innerText = msg;
            fontToast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => fontToast.classList.remove('show'), 1500);
        }

        /* ------------------ 2. 核心自然斷句與階梯流 ------------------ */
        const cantoScroll = document.getElementById('cantoScroll');
        const cantoStream = document.getElementById('cantoStream');
        const interimPart = document.getElementById('interimPart');

        let pauseTimer = null;
        let autoScrollCanto = true;
        let confirmedPlainHistory = "";
        let lastFinalCleanText = "";
        let lastFinalTimestamp = 0;

        const phrasesList = [];
        const MAX_HISTORY_PHRASES = 40;

        cantoScroll.addEventListener('scroll', () => {
            autoScrollCanto = (cantoScroll.scrollHeight - cantoScroll.scrollTop - cantoScroll.clientHeight) < 140;
        });

        function scrollCantoToBottom() {
            if (autoScrollCanto) {
                requestAnimationFrame(() => {
                    cantoScroll.scrollTop = cantoScroll.scrollHeight;
                });
            }
        }

        /**
         * 智慧標點附著：根據自然語意或停頓賦予最合適的標點
         */
        function attachSmartPunctuation(text, isLongPause = false) {
            let s = text.trim();
            // 如果原本已經有標點，轉成全形標準標點
            if (/[，。？！、\.,!\?]$/.test(s)) {
                return s.replace(/\.$/, '。')
                        .replace(/,$/, '，')
                        .replace(/\?$/, '？')
                        .replace(/!$/, '！');
            }

            // 粵語常見疑問詞檢測
            const questionSuffixes = /(點解|係咪|係唔係|咩|呀嘛|呢|邊度|幾時|點樣|嗎|嘛|阿|呀)$/;
            if (questionSuffixes.test(s)) {
                return s + '？';
            }

            // 長停頓定稿為句號，短語句定稿為逗號
            return isLongPause ? (s + '。') : (s + '，');
        }

        /**
         * 杜絕重疊句子
         */
        function removeOverlap(rawText) {
            if (!rawText || !confirmedPlainHistory) return rawText;
            const cleanText = cleanString(rawText);
            if (!cleanText) return "";

            const maxCheck = Math.min(confirmedPlainHistory.length, cleanText.length, 30);
            let overlapLen = 0;
            for (let len = maxCheck; len >= 1; len--) {
                if (confirmedPlainHistory.endsWith(cleanText.slice(0, len))) {
                    overlapLen = len;
                    break;
                }
            }

            if (overlapLen > 0) {
                let counted = 0;
                let cutIndex = 0;
                for (let i = 0; i < rawText.length; i++) {
                    if (!/[，。？！、\s\.,!\?]/.test(rawText[i])) counted++;
                    if (counted === overlapLen) {
                        cutIndex = i + 1;
                        break;
                    }
                }
                return rawText.slice(cutIndex).trim();
            }
            return rawText;
        }

        /**
         * 提交完整句子（依自然停頓或 isFinal 觸發，絕不生硬按字數截斷）
         */
        function commitSentence(rawText, isLongPause = false) {
            if (!rawText) return;
            const deduplicated = removeOverlap(rawText);
            let seg = convertToHK(deduplicated || '').trim();
            if (!seg) return;

            const plainSeg = cleanString(seg);
            if (!plainSeg) return;

            // 智慧附著自然標點
            seg = attachSmartPunctuation(seg, isLongPause);

            // 1. 先前「最新句子」平滑褪色轉為歷史暗調（不再刺激眼球）
            const prevLatest = cantoStream.querySelector('.phrase-item.latest');
            if (prevLatest) {
                prevLatest.classList.remove('latest');
                prevLatest.classList.add('past');
            }

            // 2. 建立新句子：明亮純白，成為當前第一焦點
            const phraseElem = document.createElement('div');
            phraseElem.className = 'phrase-item latest';
            phraseElem.textContent = seg;

            cantoStream.insertBefore(phraseElem, interimPart);

            confirmedPlainHistory += plainSeg;
            if (confirmedPlainHistory.length > 250) {
                confirmedPlainHistory = confirmedPlainHistory.slice(-180);
            }

            phrasesList.push(phraseElem);
            if (phrasesList.length > MAX_HISTORY_PHRASES) {
                const old = phrasesList.shift();
                if (old && old.parentNode) old.parentNode.removeChild(old);
            }

            scrollCantoToBottom();
        }

        /**
         * 處理即時語音流（回歸附檔自然的語句感知）
         */
        function handleSpeechInterim(interimText) {
            clearTimeout(pauseTimer);
            if (!interimText || !interimText.trim()) {
                interimPart.textContent = '';
                return;
            }

            let pending = removeOverlap(interimText);
            if (pending.trim()) {
                // 手機跳出即時字時，帶藍色流光外觀
                interimPart.textContent = convertToHK(pending.trim());
                scrollCantoToBottom();

                // 講話自然微停頓（550ms 靜音即自然落句定稿）
                pauseTimer = setTimeout(() => {
                    commitPendingInterim(false);
                }, 550);
            } else {
                interimPart.textContent = '';
            }
        }

        function handleSpeechFinal(finalText) {
            clearTimeout(pauseTimer);
            interimPart.textContent = '';

            if (!finalText || !finalText.trim()) return;

            const cleanFinal = cleanString(finalText);
            const now = Date.now();

            // 2秒內完全重複之 finalText 不重複追加
            if (cleanFinal === lastFinalCleanText && (now - lastFinalTimestamp < 2000)) return;

            lastFinalCleanText = cleanFinal;
            lastFinalTimestamp = now;

            // 語音引擎認定整句完結，以自然停頓收尾
            commitSentence(finalText, true);
        }

        function commitPendingInterim(isLongPause = false) {
            clearTimeout(pauseTimer);
            const pending = interimPart.textContent;
            interimPart.textContent = '';
            if (pending && pending.trim()) {
                commitSentence(pending, isLongPause);
            }
        }

        /* ------------------ 3. 語音辨識機制（純離線無 PUTER） ------------------ */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let userWantsListening = false;
        let isEngineRunning = false;
        let wakeLock = null;
        let restartDebounce = null;

        const toggleBtn = document.getElementById('toggleBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        async function acquireWakeLock() {
            try {
                if ('wakeLock' in navigator && !wakeLock) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        function scheduleSafeRestart() {
            if (!userWantsListening) return;
            clearTimeout(restartDebounce);
            restartDebounce = setTimeout(() => {
                if (userWantsListening && !isEngineRunning && recognition) {
                    try {
                        recognition.start();
                    } catch (e) {
                        setTimeout(() => {
                            if (userWantsListening && !isEngineRunning && recognition) {
                                try { recognition.start(); } catch(err) {}
                            }
                        }, 80);
                    }
                }
            }, 30);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && userWantsListening) {
                acquireWakeLock();
                scheduleSafeRestart();
            }
        });

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-HK';
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isEngineRunning = true;
                toggleBtn.classList.add('active');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const res = event.results[i];
                    if (!res || !res[0]) continue;
                    const trans = res[0].transcript;

                    if (res.isFinal) {
                        handleSpeechFinal(trans);
                    } else {
                        interim += trans;
                    }
                }

                if (interim) {
                    handleSpeechInterim(interim);
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    userWantsListening = false;
                    stopListeningUI();
                    alert("請允許麥克風權限以進行實時提詞。");
                } else if (e.error === 'no-speech') {
                    if (userWantsListening) scheduleSafeRestart();
                } else {
                    scheduleSafeRestart();
                }
            };

            recognition.onend = () => {
                commitPendingInterim(true);
                isEngineRunning = false;
                if (userWantsListening) {
                    scheduleSafeRestart();
                } else {
                    stopListeningUI();
                }
            };
        }

        function stopListeningSession() {
            userWantsListening = false;
            if (restartDebounce) clearTimeout(restartDebounce);
            commitPendingInterim(true);
            releaseWakeLock();
            try { recognition.stop(); } catch(e) {}
            stopListeningUI();
        }

        function toggleSpeech() {
            if (!recognition) {
                alert("此瀏覽器不支援 Web Speech API，建議使用 Safari 或 Chrome。");
                return;
            }

            if (userWantsListening) {
                stopListeningSession();
                showToast("已停止提詞");
            } else {
                userWantsListening = true;
                acquireWakeLock();
                scheduleSafeRestart();
                showToast("已啟動實時提詞");
            }
        }

        function stopListeningUI() {
            toggleBtn.classList.remove('active');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            interimPart.textContent = "";
        }

        /* ------------------ 4. 字體調節 ------------------ */
        const fontScales = [
            { name: "標準", canto: "2.05rem" },
            { name: "放大", canto: "2.45rem" },
            { name: "特大", canto: "2.90rem" }
        ];
        let currentScaleIdx = 0;

        function cycleFontSize() {
            currentScaleIdx = (currentScaleIdx + 1) % fontScales.length;
            const cur = fontScales[currentScaleIdx];
            document.documentElement.style.setProperty('--cantonese-size', cur.canto);
            showToast(`字體 ${cur.name}`);
            scrollCantoToBottom();
        }

        /* ------------------ 5. 粵拼注音彈窗與朗讀 ------------------ */
        const modal = document.getElementById('phoneticModal');
        const modalContent = document.getElementById('modalContent');
        const ttsStatus = document.getElementById('ttsStatus');
        let currentPureText = "";

        function getAllRecognizedText() {
            return phrasesList.map(el => el.textContent).join('') + interimPart.textContent;
        }

        async function fetchJyutpingRubyHTML(text) {
            if (!text) return "";
            if (!window.ToJyutping) {
                try {
                    const mod = await import('https://cdn.jsdelivr.net/npm/to-jyutping@3.1.1/+esm');
                    window.ToJyutping = mod.default || mod;
                } catch (e) {}
            }

            let html = "";
            if (window.ToJyutping && typeof window.ToJyutping.getJyutpingList === 'function') {
                try {
                    const list = window.ToJyutping.getJyutpingList(text);
                    for (const [char, rawJp] of list) {
                        if (char === '\n') {
                            html += '<div style="flex-basis: 100%; height: 8px;"></div>';
                            continue;
                        }
                        if (rawJp) {
                            html += `<ruby class="jp-ruby"><span class="c-char">${char}</span><rt class="c-rt">${rawJp}</rt></ruby>`;
                        } else {
                            html += `<span class="jp-punct">${char}</span>`;
                        }
                    }
                    return html;
                } catch (err) {}
            }
            return text;
        }

        async function openPhoneticModal() {
            const fullText = getAllRecognizedText().trim();
            currentPureText = cleanString(fullText);

            if (!fullText) {
                modalContent.innerHTML = "<div style='color:#64748b; font-size:1rem; padding:10px;'>暫無文字</div>";
                modal.classList.add('active');
                return;
            }

            modalContent.innerHTML = "<div style='color:#94a3b8; font-size:1rem; width:100%; text-align:center; padding:30px 0;'>粵拼注音生成中...</div>";
            ttsStatus.innerText = "標音中";
            modal.classList.add('active');

            const rubyHTML = await fetchJyutpingRubyHTML(fullText);
            modalContent.innerHTML = rubyHTML;
            ttsStatus.innerText = "就緒";
        }

        function closePhoneticModal() {
            modal.classList.remove('active');
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }

        function closeModalOnBackdrop(event) {
            if (event.target === modal) closePhoneticModal();
        }

        function speakCurrentText() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utter = new SpeechSynthesisUtterance(currentPureText);
            utter.lang = 'zh-HK';
            utter.rate = 0.85;

            utter.onstart = () => ttsStatus.innerText = "朗讀中";
            utter.onend = () => ttsStatus.innerText = "完畢";
            utter.onerror = () => ttsStatus.innerText = "就緒";

            window.speechSynthesis.speak(utter);
        }
    </script>
</body>
</html>
